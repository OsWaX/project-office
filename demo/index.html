<title>Портал Проектного офиса</title>
<style>
/* ==========================================================================
   Портал Проектного офиса — оформление интерфейса
   ========================================================================== */

:root {
  --paper: #f4f6fa;
  --surface: #ffffff;
  --surface-2: #fafbfd;
  --surface-3: #eef1f7;
  --ink: #16202f;
  --ink-soft: #4a5568;
  --ink-faint: #7b869b;
  --line: #dde2ea;
  --line-soft: #eaeef4;

  --indigo: #1f4e9e;
  --indigo-deep: #163a78;
  --indigo-soft: #e8eefa;
  --gold: #9a7016;
  --gold-soft: #f8f1df;

  --ok: #1f7a4d;
  --ok-soft: #e4f4ea;
  --warn: #a8620f;
  --warn-soft: #fdf0e0;
  --danger: #a52f2f;
  --danger-soft: #fbe9e9;
  --violet: #6f45c9;

  --radius: 8px;
  --radius-sm: 5px;
  --shadow-sm: 0 1px 2px rgba(20, 32, 51, .07);
  --shadow: 0 4px 16px rgba(20, 32, 51, .09);
  --shadow-lg: 0 16px 48px rgba(20, 32, 51, .18);

  --sidebar-w: 250px;
  --header-h: 58px;
  --font: "Segoe UI", Roboto, "Helvetica Neue", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11151c;
    --surface: #191f28;
    --surface-2: #1e252f;
    --surface-3: #252d39;
    --ink: #e7eaf0;
    --ink-soft: #a9b2c1;
    --ink-faint: #7b8497;
    --line: #303948;
    --line-soft: #242c37;
    --indigo: #7ea3ec;
    --indigo-deep: #a2bdf4;
    --indigo-soft: #1e2a41;
    --gold: #d3a94f;
    --gold-soft: #2c2617;
    --ok: #5fbf90;
    --ok-soft: #14291f;
    --warn: #d7994f;
    --warn-soft: #2c2114;
    --danger: #e07878;
    --danger-soft: #2e1a1a;
    --violet: #a184e8;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow: 0 4px 16px rgba(0, 0, 0, .45);
    --shadow-lg: 0 16px 48px rgba(0, 0, 0, .6);
  }
}

:root[data-theme="dark"] {
  --paper: #11151c; --surface: #191f28; --surface-2: #1e252f; --surface-3: #252d39;
  --ink: #e7eaf0; --ink-soft: #a9b2c1; --ink-faint: #7b8497;
  --line: #303948; --line-soft: #242c37;
  --indigo: #7ea3ec; --indigo-deep: #a2bdf4; --indigo-soft: #1e2a41;
  --gold: #d3a94f; --gold-soft: #2c2617;
  --ok: #5fbf90; --ok-soft: #14291f; --warn: #d7994f; --warn-soft: #2c2114;
  --danger: #e07878; --danger-soft: #2e1a1a; --violet: #a184e8;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4); --shadow: 0 4px 16px rgba(0,0,0,.45); --shadow-lg: 0 16px 48px rgba(0,0,0,.6);
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.55;
  color: var(--ink);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 { margin: 0; font-weight: 600; line-height: 1.25; }
h1 { font-size: 22px; }
h2 { font-size: 17px; }
h3 { font-size: 15px; }
p { margin: 0 0 10px; }
a { color: var(--indigo); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; border-radius: 3px; }

/* ---------- Вход в систему ------------------------------------------------ */
.login-page {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1.05fr 1fr;
  background: var(--surface);
}
.login-hero {
  background:
    radial-gradient(1100px 520px at 12% -10%, rgba(255, 255, 255, .16), transparent 60%),
    linear-gradient(155deg, #163a78 0%, #1f4e9e 52%, #2a63c0 100%);
  color: #fff;
  padding: 52px 56px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.login-hero .emblem {
  width: 54px; height: 54px; border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, .55);
  display: grid; place-items: center; font-size: 24px; margin-bottom: 26px;
}
.login-hero h1 { font-size: 30px; line-height: 1.22; margin-bottom: 14px; max-width: 17ch; }
.login-hero .ministry { font-size: 12.5px; letter-spacing: .09em; text-transform: uppercase; opacity: .82; margin-bottom: 30px; max-width: 40ch; }
.login-hero p.lead { font-size: 15.5px; opacity: .92; max-width: 46ch; }
.login-hero ul { list-style: none; padding: 0; margin: 26px 0 0; font-size: 14px; opacity: .9; }
.login-hero ul li { padding-left: 22px; position: relative; margin-bottom: 8px; }
.login-hero ul li::before { content: "—"; position: absolute; left: 0; opacity: .65; }
.login-hero .foot { font-size: 12px; opacity: .7; }

.login-form-wrap { display: grid; place-items: center; padding: 40px 32px; }
.login-form { width: 100%; max-width: 384px; }
.login-form h2 { font-size: 21px; margin-bottom: 6px; }
.login-form .hint { color: var(--ink-faint); font-size: 13px; margin-bottom: 26px; }
.demo-box {
  margin-top: 26px; padding: 14px 16px; background: var(--surface-2);
  border: 1px solid var(--line-soft); border-radius: var(--radius); font-size: 12.5px; color: var(--ink-soft);
}
.demo-box b { color: var(--ink); }
.demo-box code { font-family: var(--mono); font-size: 12px; background: var(--surface-3); padding: 1px 5px; border-radius: 3px; }
.demo-accounts { display: grid; gap: 4px; margin-top: 8px; }
.demo-accounts button {
  text-align: left; background: none; border: none; padding: 3px 0; cursor: pointer;
  color: var(--indigo); font-size: 12.5px; font-family: inherit;
}
.demo-accounts button:hover { text-decoration: underline; }

@media (max-width: 900px) {
  .login-page { grid-template-columns: 1fr; }
  .login-hero { padding: 34px 26px; }
  .login-hero h1 { font-size: 24px; }
  .login-hero ul, .login-hero .foot { display: none; }
}

/* ---------- Каркас приложения --------------------------------------------- */
.app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100vh; }

.sidebar {
  background: var(--indigo-deep);
  color: #fff;
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.sidebar-brand { padding: 18px 20px; border-bottom: 1px solid rgba(255, 255, 255, .13); }
.sidebar-brand .title { font-size: 14.5px; font-weight: 600; line-height: 1.3; }
.sidebar-brand .sub { font-size: 11px; opacity: .68; letter-spacing: .05em; text-transform: uppercase; margin-top: 4px; }

.nav { padding: 12px 10px; flex: 1; }
.nav-group-title {
  font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase;
  opacity: .5; padding: 14px 10px 6px; font-weight: 600;
}
.nav a {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 11px; border-radius: var(--radius-sm);
  color: rgba(255, 255, 255, .87); font-size: 13.5px; text-decoration: none; margin-bottom: 1px;
}
.nav a:hover { background: rgba(255, 255, 255, .1); text-decoration: none; }
.nav a.active { background: rgba(255, 255, 255, .17); color: #fff; font-weight: 600; }
.nav a .icon { width: 18px; text-align: center; font-size: 14px; opacity: .95; flex: none; }
.nav a .badge {
  margin-left: auto; background: #d64545; color: #fff; border-radius: 10px;
  padding: 0 6px; font-size: 11px; font-weight: 700; min-width: 18px; text-align: center;
}
.sidebar-foot { padding: 12px 16px; border-top: 1px solid rgba(255,255,255,.13); font-size: 11px; opacity: .55; }

.main { display: flex; flex-direction: column; min-width: 0; }

.topbar {
  height: var(--header-h);
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px;
  padding: 0 20px; position: sticky; top: 0; z-index: 30;
}
.burger { display: none; background: none; border: none; font-size: 20px; cursor: pointer; color: var(--ink); }

.search-box { position: relative; flex: 1; max-width: 460px; }
.search-box input {
  width: 100%; height: 34px; border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--surface-2); padding: 0 12px 0 32px; font-size: 13.5px; color: var(--ink); font-family: inherit;
}
.search-box .mag { position: absolute; left: 10px; top: 8px; opacity: .45; font-size: 13px; pointer-events: none; }
.search-box kbd {
  position: absolute; right: 8px; top: 7px; font-size: 10.5px; color: var(--ink-faint);
  border: 1px solid var(--line); border-radius: 3px; padding: 1px 5px; background: var(--surface);
}
.search-results {
  position: absolute; top: 40px; left: 0; right: 0; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-lg);
  max-height: 460px; overflow-y: auto; z-index: 60;
}
.search-results .group-title {
  font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint);
  padding: 10px 14px 4px; font-weight: 600;
}
.search-results a { display: block; padding: 8px 14px; color: var(--ink); border-bottom: 1px solid var(--line-soft); }
.search-results a:hover { background: var(--surface-2); text-decoration: none; }
.search-results .r-title { font-weight: 500; font-size: 13.5px; }
.search-results .r-meta { font-size: 12px; color: var(--ink-faint); }

.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.icon-btn {
  width: 34px; height: 34px; border-radius: var(--radius-sm); border: 1px solid transparent;
  background: none; cursor: pointer; font-size: 15px; color: var(--ink-soft); position: relative;
  display: grid; place-items: center;
}
.icon-btn:hover { background: var(--surface-3); }
.icon-btn .dot {
  position: absolute; top: 4px; right: 4px; background: #d64545; color: #fff;
  font-size: 9.5px; font-weight: 700; border-radius: 9px; padding: 0 4px; min-width: 15px; line-height: 15px;
}
.user-chip {
  display: flex; align-items: center; gap: 9px; padding: 4px 10px 4px 5px;
  border-radius: 20px; cursor: pointer; border: 1px solid var(--line); background: var(--surface-2);
}
.user-chip:hover { background: var(--surface-3); }
.avatar {
  width: 26px; height: 26px; border-radius: 50%; background: var(--indigo); color: #fff;
  display: grid; place-items: center; font-size: 11px; font-weight: 700; flex: none;
}
.user-chip .u-name { font-size: 12.5px; font-weight: 500; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-chip .u-role { font-size: 10.5px; color: var(--ink-faint); }

.content { padding: 22px 24px 60px; flex: 1; min-width: 0; }
.page-head { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.page-head .titles { min-width: 0; flex: 1 1 260px; }
.page-head .subtitle { color: var(--ink-faint); font-size: 13px; margin-top: 3px; }
.page-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.breadcrumbs { font-size: 12.5px; color: var(--ink-faint); margin-bottom: 8px; }
.breadcrumbs a { color: var(--ink-faint); }

@media (max-width: 700px) {
  .page-head { flex-direction: column; align-items: stretch; }
  /* в колоночной раскладке flex-basis влияет на высоту — сбрасываем его */
  .page-head .titles { flex: none; }
  .page-actions { width: 100%; }
  .page-actions .btn, .page-actions a.btn { flex: 1 1 auto; justify-content: center; }
  .filters { grid-template-columns: 1fr; }
  .filters .field.wide { grid-column: span 1; }
  .modal { max-height: 100vh; border-radius: 0; }
  .modal-scrim { padding: 0; }
  .def-list { grid-template-columns: 1fr 1fr; }
  h1 { font-size: 19px; }
  .kanban-col, .kanban-col { width: 84vw; min-width: 84vw; }
  .cal-cell { min-height: 66px; font-size: 11px; }
  .notif-panel { right: 6px; left: 6px; width: auto; }
}

@media (max-width: 1000px) {
  .app { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; left: 0; top: 0; bottom: 0; width: 260px; z-index: 100;
    transform: translateX(-100%); transition: transform .2s ease; height: 100%;
  }
  .sidebar.open { transform: none; box-shadow: var(--shadow-lg); }
  .burger { display: block; }
  .content { padding: 16px 14px 60px; }
  .search-box kbd { display: none; }
  .user-chip .u-name, .user-chip .u-role { display: none; }
}

.scrim { position: fixed; inset: 0; background: rgba(10, 16, 26, .45); z-index: 90; }

/* ---------- Кнопки -------------------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 34px; padding: 0 14px; border-radius: var(--radius-sm);
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font-size: 13.5px; font-weight: 500; font-family: inherit; cursor: pointer; white-space: nowrap;
}
.btn:hover { background: var(--surface-3); text-decoration: none; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--indigo); border-color: var(--indigo); color: #fff; }
.btn-primary:hover { background: var(--indigo-deep); border-color: var(--indigo-deep); }
.btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn-danger:hover { filter: brightness(.92); }
.btn-ghost { border-color: transparent; background: none; }
.btn-ghost:hover { background: var(--surface-3); }
.btn-sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn-block { width: 100%; }
.btn-lg { height: 40px; font-size: 15px; padding: 0 20px; }

/* ---------- Карточки ------------------------------------------------------ */
.card {
  background: var(--surface); border: 1px solid var(--line-soft);
  border-radius: var(--radius); box-shadow: var(--shadow-sm); margin-bottom: 16px;
}
.card-head {
  padding: 13px 16px; border-bottom: 1px solid var(--line-soft);
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.card-head h2, .card-head h3 { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.card-head > .muted { flex: 0 1 auto; text-align: right; }
.card-body { padding: 16px; }
.card-body.tight { padding: 0; }
.card-foot { padding: 11px 16px; border-top: 1px solid var(--line-soft); background: var(--surface-2); }

.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.grid-4 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.split { display: grid; grid-template-columns: minmax(0, 2fr) minmax(310px, 1fr); gap: 16px; align-items: start; }
@media (max-width: 1100px) { .split { grid-template-columns: 1fr; } }

/* Колонка сетки: карточки внутри остаются в своей ячейке */
.col-stack { min-width: 0; }
.col-stack > .card:last-child { margin-bottom: 0; }

/* ---------- Показатели ---------------------------------------------------- */
.kpi {
  background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius);
  padding: 14px 16px; box-shadow: var(--shadow-sm); position: relative; overflow: hidden;
}
.kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--indigo); }
.kpi.gold::before { background: var(--gold); }
.kpi.ok::before { background: var(--ok); }
.kpi.warn::before { background: var(--warn); }
.kpi.danger::before { background: var(--danger); }
.kpi .label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-faint); font-weight: 600; }
.kpi .value { font-size: 25px; font-weight: 700; margin-top: 5px; letter-spacing: -.01em; }
.kpi .value.sm { font-size: 19px; }
.kpi .note { font-size: 12px; color: var(--ink-faint); margin-top: 3px; }

/* ---------- Таблицы ------------------------------------------------------- */
.table-wrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.data th {
  text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-soft); font-weight: 600; padding: 9px 12px; white-space: nowrap;
  border-bottom: 1px solid var(--line); background: var(--surface-2); position: sticky; top: 0; z-index: 2;
}
table.data th.sortable { cursor: pointer; user-select: none; }
table.data th.sortable:hover { color: var(--indigo); }
table.data th .arrow { opacity: .55; font-size: 9px; margin-left: 3px; }
table.data td { padding: 9px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
table.data.registry { min-width: 1180px; }
table.data.registry td:nth-child(2) { min-width: 300px; }
table.data tbody tr:hover { background: var(--surface-2); }
table.data tr.row-overdue td:first-child { box-shadow: inset 3px 0 0 var(--danger); }
table.data tr.row-stale td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.data .code { font-family: var(--mono); font-size: 12px; color: var(--ink-faint); white-space: nowrap; }
table.data .strong { font-weight: 500; }
.t-main { font-weight: 500; }
.t-sub { font-size: 12px; color: var(--ink-faint); margin-top: 2px; }

/* ---------- Значки и метки ------------------------------------------------ */
.tag {
  display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600;
  border-radius: 20px; padding: 2px 9px; background: var(--surface-3); color: var(--ink-soft); white-space: nowrap;
}
.tag .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.tag-ok { background: var(--ok-soft); color: var(--ok); }
.tag-warn { background: var(--warn-soft); color: var(--warn); }
.tag-danger { background: var(--danger-soft); color: var(--danger); }
.tag-indigo { background: var(--indigo-soft); color: var(--indigo); }
.tag-gold { background: var(--gold-soft); color: var(--gold); }
.tag-plain { background: transparent; border: 1px solid var(--line); }

.pill-row { display: flex; gap: 6px; flex-wrap: wrap; }

.progress { height: 5px; background: var(--surface-3); border-radius: 4px; overflow: hidden; min-width: 60px; }
.progress > span { display: block; height: 100%; background: var(--ok); border-radius: 4px; }

/* ---------- Формы --------------------------------------------------------- */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin-bottom: 5px; }
.field .req { color: var(--danger); margin-left: 2px; }
.field .help { font-size: 11.5px; color: var(--ink-faint); margin-top: 4px; }
input[type="text"], input[type="email"], input[type="password"], input[type="number"],
input[type="date"], input[type="time"], input[type="url"], input[type="search"], select, textarea {
  width: 100%; border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 8px 10px; font-size: 13.5px; font-family: inherit; color: var(--ink);
  background: var(--surface); min-height: 34px;
}
textarea { min-height: 82px; resize: vertical; line-height: 1.5; }
select { cursor: pointer; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--indigo); box-shadow: 0 0 0 3px var(--indigo-soft); }
input:disabled, select:disabled, textarea:disabled { background: var(--surface-3); color: var(--ink-faint); cursor: not-allowed; }
.checkbox { display: flex; align-items: flex-start; gap: 8px; font-size: 13.5px; cursor: pointer; margin-bottom: 8px; }
.checkbox input { width: 15px; height: 15px; min-height: 0; margin-top: 2px; flex: none; accent-color: var(--indigo); }
.form-row { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.form-section-title {
  font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint);
  font-weight: 700; margin: 22px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line-soft);
}
.form-section-title:first-child { margin-top: 0; }

.filters {
  display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  padding: 14px 16px; background: var(--surface); border: 1px solid var(--line-soft);
  border-radius: var(--radius); margin-bottom: 14px; align-items: end;
}
.filters .field { margin: 0; min-width: 0; }
.filters .field.wide { grid-column: span 2; }
.filter-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 20px;
  padding: 4px 12px; font-size: 12.5px; cursor: pointer; font-family: inherit; color: var(--ink-soft);
}
.chip:hover { border-color: var(--indigo); color: var(--indigo); }
.chip.active { background: var(--indigo); border-color: var(--indigo); color: #fff; font-weight: 600; }

/* ---------- Модальные окна ------------------------------------------------ */
.modal-scrim {
  position: fixed; inset: 0; background: rgba(11, 18, 30, .55);
  display: grid; place-items: center; z-index: 200; padding: 20px; overflow-y: auto;
}
.modal {
  background: var(--surface); border-radius: 10px; box-shadow: var(--shadow-lg);
  width: 100%; max-width: 620px; max-height: 92vh; display: flex; flex-direction: column;
}
.modal.wide { max-width: 900px; }
.modal.narrow { max-width: 440px; }
.modal-head { padding: 16px 20px; border-bottom: 1px solid var(--line-soft); display: flex; align-items: center; gap: 12px; }

function can(user, permission) {
  if (!user) return false;
  const allowed = PERMISSIONS[permission];
  if (!allowed) throw new Error('Неизвестное право доступа: ' + permission);
  return allowed.indexOf(user.role) !== -1;
}

/** Проектный менеджер меняет статус и отмечает выполнение только по своим записям. */
function isOwnRecord(user, record) {
  if (!user || !record) return false;
  return record.responsible_user_id === user.id || record.created_by === user.id;
}

/** Итог для интерфейса: разрешено ли действие с учётом принадлежности записи. */
function canOn(user, permission, record) {
  if (!can(user, permission)) return false;
  if (user.role === 'admin') return true;
  return isOwnRecord(user, record);
}

function loadDatabase() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.projects && parsed.projects.length) return parsed;
    }
  } catch (error) { /* приватный режим или очищенные данные — начинаем заново */ }
  return buildDatabase();
}

function saveDatabase() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }
  catch (error) { /* сохранение недоступно — демонстрация продолжает работать в памяти */ }
}

// ==========================================================================

function h(tag, attrs) {
  const element = document.createElement(tag);
  if (attrs) {
    for (const key in attrs) {
      const value = attrs[key];
      if (value === null || value === undefined || value === false) continue;
      if (key === 'class') element.className = value;
      else if (key === 'style' && typeof value === 'object') Object.assign(element.style, value);
      else if (key === 'dataset') Object.assign(element.dataset, value);
      else if (key.slice(0, 2) === 'on' && typeof value === 'function') element.addEventListener(key.slice(2), value);
      else if (key === 'html') element.innerHTML = value;
      else if (value === true) element.setAttribute(key, '');
      else element.setAttribute(key, value);
    }
  }
  for (let i = 2; i < arguments.length; i++) append(element, arguments[i]);
  return element;
}

function append(parent, child) {
  if (child === null || child === undefined || child === false || child === '') return;
  if (Array.isArray(child)) { child.forEach((c) => append(parent, c)); return; }
  parent.append(child instanceof Node ? child : document.createTextNode(String(child)));
}

const frag = function () {
  const f = document.createDocumentFragment();
  for (let i = 0; i < arguments.length; i++) append(f, arguments[i]);
  return f;
};

const column = function () {
  const args = [].slice.call(arguments);
  return h.apply(null, ['div', { class: 'col-stack' }].concat(args));
};

function setChildren(node) {
  while (node.firstChild) node.firstChild.remove();
  for (let i = 1; i < arguments.length; i++) append(node, arguments[i]);
  return node;
}

const SVG_NS = 'http://www.w3.org/2000/svg';
function svg(tag, attrs) {
  const element = document.createElementNS(SVG_NS, tag);
  for (const key in attrs || {}) {
    const value = attrs[key];
    if (value === null || value === undefined || value === false) continue;
    if (key.slice(0, 2) === 'on' && typeof value === 'function') element.addEventListener(key.slice(2), value);
    else element.setAttribute(key, value);
  }
  for (let i = 2; i < arguments.length; i++) {
    const child = arguments[i];
    if (child === null || child === undefined || child === false) continue;
    element.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return element;
}

function formatDate(value, options) {
  if (!value) return '—';
  const date = new Date(String(value).replace(' ', 'T'));
  if (isNaN(date)) return '—';
  const day = date.getDate();
  if (options && options.long) return day + ' ' + MONTHS_GEN[date.getMonth()] + ' ' + date.getFullYear() + ' г.';
  return String(day).padStart(2, '0') + '.' + String(date.getMonth() + 1).padStart(2, '0') + '.' + date.getFullYear();
}

function formatDateShort(value) {
  if (!value) return '—';
  const date = new Date(String(value).replace(' ', 'T'));
  return date.getDate() + ' ' + MONTHS_GEN[date.getMonth()].slice(0, 3) + '.';
}

function formatDateTime(value) {
  if (!value) return '—';
  const date = new Date(String(value).replace(' ', 'T'));
  if (isNaN(date)) return '—';
  return formatDate(value) + ', ' + String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0');
}

function plural(n, one, few, many) {
  const abs = Math.abs(n) % 100;
  const last = abs % 10;
  if (abs > 10 && abs < 20) return many;
  if (last > 1 && last < 5) return few;
  if (last === 1) return one;
  return many;
}

function daysUntil(dateString) {
  if (!dateString) return 0;
  const target = new Date(dateString + 'T00:00:00');
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return Math.round((target - today) / DAY);
}

const todayIso = () => new Date().toISOString().slice(0, 10);
const NUMBER_FORMAT = new Intl.NumberFormat('ru-RU');
const formatNumber = (value) => (value === null || value === undefined || value === '' ? '—' : NUMBER_FORMAT.format(Math.round(Number(value))));

function formatMoney(amount, currency, options) {
  if (amount === null || amount === undefined || amount === '') return '—';
  const value = Number(amount);
  const compact = options && options.compact;
  if (compact && Math.abs(value) >= 1000000) return (value / 1000000).toFixed(value >= 10000000 ? 0 : 1).replace('.', ',') + ' млн ' + (currency || '');
  if (compact && Math.abs(value) >= 1000) return Math.round(value / 1000) + ' тыс. ' + (currency || '');
  return NUMBER_FORMAT.format(Math.round(value)) + (currency ? ' ' + currency : '');
}

// --- Модальные окна ---
function openModal(options) {
  const scrim = h('div', { class: 'modal-scrim' });
  const close = () => { scrim.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (event) => { if (event.key === 'Escape') close(); };
  const modal = h('div', { class: 'modal ' + (options.size || ''), role: 'dialog', 'aria-modal': 'true' },
    h('div', { class: 'modal-head' },
      h('h2', {}, options.title),
      h('button', { class: 'icon-btn', 'aria-label': 'Закрыть', onclick: close }, '✕')
    ),
    h('div', { class: 'modal-body' }, options.body),
    options.footer ? h('div', { class: 'modal-foot' }, options.footer(close)) : null
  );
  scrim.addEventListener('mousedown', (event) => { if (event.target === scrim) close(); });
  scrim.append(modal);
  document.body.append(scrim);
  document.addEventListener('keydown', onKey);
  const firstControl = modal.querySelector('input, select, textarea, button.btn-primary');
  if (firstControl) firstControl.focus();
  return close;
}

function confirmDialog(options) {
  return new Promise((resolve) => {
    let settled = false;
    const finish = (value, close) => { settled = true; close(); resolve(value); };
    openModal({
      title: options.title || 'Подтверждение',
      size: 'narrow',
      body: h('p', { class: 'mb-0' }, options.message),
      footer: (close) => [
        h('button', { class: 'btn', onclick: () => finish(false, close) }, 'Отмена'),
        h('button', {
          class: 'btn ' + (options.danger ? 'btn-danger' : 'btn-primary'),
          onclick: () => finish(true, close),
        }, options.confirmLabel || 'Подтвердить'),
      ],
      onClose: () => { if (!settled) resolve(false); },
    });
  });
}

const debounce = (fn, delay) => {

    const args = arguments;
    clearTimeout(timer);
    timer = setTimeout(() => fn.apply(null, args), delay || 260);
  };
};

const PALETTE = ['#1f4e9e', '#0f8a6a', '#a5791f', '#6f45c9', '#c2582e', '#2f8bbf', '#8a3d6b', '#4e7a2f', '#a53f3f'];

function donutChart(items, options) {
  const opts = options || {};
  const size = opts.size || 190;
  const thickness = opts.thickness || 30;
  const total = items.reduce((sum, item) => sum + item.count, 0);
  const radius = (size - thickness) / 2;
  const center = size / 2;
  const root = svg('svg', { viewBox: '0 0 ' + size + ' ' + size, width: size, height: size, role: 'img', 'aria-label': 'Распределение по статусам' });

  if (!total) {
    root.append(svg('circle', { cx: center, cy: center, r: radius, fill: 'none', stroke: 'var(--surface-3)', 'stroke-width': thickness }));
  } else {
    let angle = -Math.PI / 2;
    items.forEach((item, index) => {
      if (!item.count) return;
      const sweep = (item.count / total) * Math.PI * 2;
      const end = angle + sweep;
      const large = sweep > Math.PI ? 1 : 0;
      const x1 = center + radius * Math.cos(angle);
      const y1 = center + radius * Math.sin(angle);
      const x2 = center + radius * Math.cos(end);
      const y2 = center + radius * Math.sin(end);
      const d = sweep >= Math.PI * 2 - 0.0001
        ? 'M ' + center + ' ' + (center - radius) + ' A ' + radius + ' ' + radius + ' 0 1 1 ' + (center - 0.01) + ' ' + (center - radius)
        : 'M ' + x1 + ' ' + y1 + ' A ' + radius + ' ' + radius + ' 0 ' + large + ' 1 ' + x2 + ' ' + y2;
      root.append(svg('path', { d: d, fill: 'none', stroke: item.color || PALETTE[index % PALETTE.length], 'stroke-width': thickness },
        svg('title', {}, item.label + ': ' + item.count)));
      angle = end;
    });
  }
  if (opts.centerValue !== undefined) {
    root.append(svg('text', { x: center, y: center - 2, 'text-anchor': 'middle', 'font-size': 26, 'font-weight': 700, fill: 'var(--ink)' }, opts.centerValue));
    root.append(svg('text', { x: center, y: center + 17, 'text-anchor': 'middle', 'font-size': 11, fill: 'var(--ink-faint)' }, opts.centerLabel || ''));
  }
  return root;
}

/** Ленточная диаграмма дорожной карты. */
function gantt(steps) {
  const dated = steps.filter((s) => s.due_date);
  if (!dated.length) return null;
  const times = dated.map((s) => new Date(s.due_date + 'T00:00:00').getTime());
  const now = Date.now();
  let min = Math.min.apply(null, times.concat([now]));
  let max = Math.max.apply(null, times.concat([now]));
  if (max === min) max = min + DAY;
  const pad = (max - min) * 0.06;
  min -= pad; max += pad;
  const pos = (time) => ((time - min) / (max - min)) * 100;

  return h('div', {},
    h('div', { class: 'gantt' },
      dated.map((step, index) => {
        const end = new Date(step.due_date + 'T00:00:00').getTime();
        const start = index === 0 ? min + pad * 0.4 : new Date(dated[index - 1].due_date + 'T00:00:00').getTime();
        const left = pos(Math.min(start, end));
        const width = Math.max(1.5, pos(end) - left);
        const overdue = step.state !== 'done' && daysUntil(step.due_date) < 0;
        const color = step.state === 'done' ? 'var(--ok)' : overdue ? 'var(--danger)' : step.state === 'in_progress' ? 'var(--indigo)' : 'var(--ink-faint)';
        return h('div', { class: 'gantt-row' },
          h('span', { class: 'nowrap', style: { overflow: 'hidden', textOverflow: 'ellipsis' }, title: step.title }, step.title),
          h('div', { class: 'gantt-track' },
            h('div', { class: 'gantt-bar', style: { left: left + '%', width: width + '%', background: color } , title: formatDate(step.due_date) }),
            h('div', { class: 'gantt-today', style: { left: pos(now) + '%' } })
          )
        );
      })
    ),
    h('div', { class: 'gantt-axis' },
      h('span', {}, formatDate(new Date(min).toISOString().slice(0, 10))),
      h('span', {}, 'сегодня — ' + formatDate(todayIso())),
      h('span', {}, formatDate(new Date(max).toISOString().slice(0, 10)))
    )
  );
}

function toCsv(headers, rows) {
  const cell = (value) => {
    const text = value === null || value === undefined ? '' : String(value);
    return /[";\n]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
  };
  const lines = [headers.map(cell).join(';')];
  rows.forEach((row) => lines.push(row.map(cell).join(';')));
  return '﻿' + lines.join('\r\n');
}

async function saveCsv(filename, headers, rows, label) {
  if (!state.downloads) {
    toastError('Выгрузка файлов в этом просмотре недоступна. Откройте демонстрацию в claude.ai, чтобы сохранить CSV.');
    return;
  }
  try {
    await state.downloads.save({ filename: filename, data: toCsv(headers, rows) });
    audit('export', 'report', null, 'Выгружен файл ' + filename + ' — ' + label + ' (строк: ' + rows.length + ')', []);
    toastOk('Файл ' + filename + ' сформирован: строк — ' + rows.length + '.');
  } catch (error) {
    if (error && error.code === 'rejected') toast('Сохранение файла отменено.', { title: 'Отменено' });
    else toastError('Файл не сохранён: ' + ((error && error.message) || 'неизвестная ошибка') + '.');
  }
}

/** Кнопка выгрузки: заметна, но честно показывает, когда сохранение недоступно. */
function exportButton(label, filename, headers, rowsFn, small) {
  const button = h('button', {
    class: 'btn ' + (small ? 'btn-sm' : ''),
    onclick: () => saveCsv(filename, headers, rowsFn(), label),
  }, '⇩ ', label);
  if (state.downloadsReady && !state.downloads) {
    button.disabled = true;
    button.title = 'Выгрузка доступна при просмотре в claude.ai';
  }
  return button;
}

function signOut() {
  state.user = null;
  render();
}

async function resetDemo() {
  const ok = await confirmDialog({
    title: 'Сбросить демонстрационные данные',
    message: 'Все изменения, сделанные в демонстрации, будут удалены, и данные вернутся к исходному состоянию. Продолжить?',
    confirmLabel: 'Сбросить',
    danger: true,
  });
  if (!ok) return;
  db = buildDatabase();
  saveDatabase();
  if (state.user) state.user = userById(state.user.id);
  toastOk('Демонстрационные данные восстановлены.');
  render();
}

const pendingCorrectionsCount = () => db.corrections.filter((c) =>
  c.status === 'pending' && (state.user.role === 'admin' || c.requested_by === state.user.id)).length;

function runSearch(term, container) {
  const query = term.trim().toLowerCase();
  if (query.length < 2) { container.classList.add('hidden'); return; }
  const groups = [
    ['Проекты и соглашения', db.projects.filter((p) => (p.title + ' ' + p.code).toLowerCase().indexOf(query) !== -1).slice(0, 5),
      (p) => ({ href: '#/projects/' + p.id, title: p.title, meta: p.code + ' · ' + companyById(p.company_id).name + ' · ' + countryName(p.iso2) })],
    ['Компании', db.companies.filter((c) => c.name.toLowerCase().indexOf(query) !== -1).slice(0, 5),
      (c) => ({ href: '#/companies/' + c.id, title: c.name, meta: countryName(c.iso2) + ', ' + c.city + ' · проектов: ' + projectsOfCompany(c.id).length })],
    ['Визиты', db.visits.filter((v) => (v.cities + ' ' + v.goal + ' ' + v.code).toLowerCase().indexOf(query) !== -1).slice(0, 5),
      (v) => ({ href: '#/visits/' + v.id, title: countryName(v.iso2) + ', ' + v.cities, meta: v.code + ' · ' + v.goal.slice(0, 70) })],
  ];
  setChildren(container);
  let found = 0;
  groups.forEach((group) => {
    if (!group[1].length) return;
    found += group[1].length;
    container.append(h('div', { class: 'group-title' }, group[0]));
    group[1].forEach((row) => {
      const item = group[2](row);
      container.append(h('a', { href: item.href, onclick: () => container.classList.add('hidden') },
        h('div', { class: 'r-title' }, item.title),
        h('div', { class: 'r-meta' }, item.meta)
      ));
    });
  });
  if (!found) container.append(h('div', { class: 'group-title' }, 'Ничего не найдено'));
  container.classList.remove('hidden');
}

function scopedProjects(scope) {
  if (scope === 'mine') return db.projects.filter((p) => p.responsible_user_id === state.user.id);
  if (scope === 'my_region') {
    if (!state.user.region) return db.projects.slice();
    return db.projects.filter((p) => countryRegion(p.iso2) === state.user.region);
  }
  return db.projects.slice();
}

function kpiCard(label, value, note, tone) {
  return h('div', { class: 'kpi ' + (tone || '') },
    h('div', { class: 'label' }, label),
    h('div', { class: 'value' + (String(value).length > 9 ? ' sm' : '') }, value),
    h('div', { class: 'note' }, note)

function filterProjects(query) {
  let rows = db.projects.slice();
  if (query.search) {
    const term = query.search.toLowerCase();
    rows = rows.filter((p) => (p.title + ' ' + p.code + ' ' + companyById(p.company_id).name).toLowerCase().indexOf(term) !== -1);
  }
  if (query.sector) rows = rows.filter((p) => p.sector_code === query.sector);
  if (query.area) rows = rows.filter((p) => p.area === query.area);
  if (query.status) rows = rows.filter((p) => p.status_code === query.status);
  if (query.type) rows = rows.filter((p) => p.record_type === query.type);
  if (query.region) rows = rows.filter((p) => countryRegion(p.iso2) === query.region);
  if (query.country) rows = rows.filter((p) => p.iso2 === query.country);
  if (query.responsible) rows = rows.filter((p) => String(p.responsible_user_id) === String(query.responsible));
  if (query.mine === '1') rows = rows.filter((p) => p.responsible_user_id === state.user.id);
  if (query.overdue === '1') rows = rows.filter((p) => stepsOf(p.id).some((s) => s.state !== 'done' && daysUntil(s.due_date) < 0));

  const sort = query.sort || 'updated';
  const dir = query.dir === 'asc' ? 1 : -1;
  const value = (p) => ({
    code: p.code, title: p.title, amount: toUsd(p.amount, p.currency),
    status: p.status_code, updated: p.last_activity_at, country: countryName(p.iso2),
    company: companyById(p.company_id).name, responsible: userName(p.responsible_user_id),
  }[sort]);
  rows.sort((a, b) => {
    const va = value(a); const vb = value(b);
    if (va === vb) return 0;
    return (va > vb ? 1 : -1) * dir;
  });
  return rows;
}

function projectProgress(projectId) {
  const steps = stepsOf(projectId);
  if (!steps.length) return { done: 0, total: 0, percent: 0 };
  const done = steps.filter((s) => s.state === 'done').length;
  return { done: done, total: steps.length, percent: Math.round((done / steps.length) * 100) };
}

    field('Статус', select(PROJECT_STATUSES.map((s) => ({ value: s.code, label: s.name })), { value: query.status || '', placeholder: 'Все статусы', onchange: set('status') })),

    field('Регион', select(REGIONS.map((r) => ({ value: r.code, label: r.name })), { value: query.region || '', placeholder: 'Все регионы', onchange: set('region') })),
    field('Ответственный', select(db.users.filter((u) => u.role !== 'viewer').map((u) => ({ value: u.id, label: u.full_name })), { value: query.responsible || '', placeholder: 'Все сотрудники', onchange: set('responsible') }))
  );

  const chips = h('div', { class: 'filter-chips' },
    h('button', { class: 'chip ' + (!query.mine && !query.overdue ? 'active' : ''), onclick: () => go('/projects', {}) }, 'Все записи'),
    h('button', { class: 'chip ' + (query.mine === '1' ? 'active' : ''), onclick: () => go('/projects', Object.assign({}, query, { mine: query.mine === '1' ? undefined : '1' })) }, 'Мои проекты'),
    h('button', { class: 'chip ' + (query.overdue === '1' ? 'active' : ''), onclick: () => go('/projects', Object.assign({}, query, { overdue: query.overdue === '1' ? undefined : '1' })) }, 'С просроченными этапами')
  );

  const sortHead = (key, label, extraClass) => {
    const active = (query.sort || 'updated') === key;
    return h('th', {
      class: 'sortable ' + (extraClass || ''),
      onclick: () => go('/projects', Object.assign({}, query, { sort: key, dir: active && query.dir !== 'asc' ? 'asc' : 'desc' })),
    }, label, active ? h('span', { class: 'arrow' }, query.dir === 'asc' ? '▲' : '▼') : null);
  };

  const table = h('div', { class: 'table-wrap' },
    h('table', { class: 'data registry' },
      h('thead', {}, h('tr', {},
        sortHead('code', 'Код'), sortHead('title', 'Наименование'), sortHead('company', 'Компания'),
        sortHead('country', 'Страна'), h('th', {}, 'Тип и отрасль'), sortHead('status', 'Статус'),
        sortHead('amount', 'Сумма', 'num'), h('th', {}, 'Дорожная карта'),
        sortHead('responsible', 'Ответственный'), sortHead('updated', 'Активность')
      )),
      h('tbody', {}, rows.map((project) => {
        const progress = projectProgress(project.id);
        const overdue = stepsOf(project.id).some((s) => s.state !== 'done' && daysUntil(s.due_date) < 0);
        const staleDays = Math.round((Date.now() - new Date(project.last_activity_at.replace(' ', 'T')).getTime()) / DAY);
        return h('tr', { class: overdue ? 'row-overdue' : staleDays > STALE_DAYS ? 'row-stale' : '' },
          h('td', {}, h('a', { href: '#/projects/' + project.id, class: 'code' }, project.code)),
          h('td', {},
            h('a', { href: '#/projects/' + project.id, class: 't-main' }, project.title),
            h('div', { class: 't-sub' }, project.description.slice(0, 96) + (project.description.length > 96 ? '…' : ''))
          ),
          h('td', {}, h('a', { href: '#/companies/' + project.company_id }, companyById(project.company_id).name)),
          h('td', {}, countryName(project.iso2), h('div', { class: 't-sub' }, regionName(countryRegion(project.iso2)))),
          h('td', {},
            dictName(RECORD_TYPES, project.record_type),
            h('div', { class: 't-sub' }, dictName(SECTORS, project.sector_code) + ' · ' + AREA_LABELS[project.area])
          ),
          h('td', {}, statusTag(dictName(PROJECT_STATUSES, project.status_code), dictColor(PROJECT_STATUSES, project.status_code))),
          h('td', { class: 'num' }, formatMoney(project.amount, project.currency)),
          h('td', {},
            h('div', { class: 'progress' }, h('span', { style: { width: progress.percent + '%', background: overdue ? 'var(--danger)' : 'var(--ok)' } })),
            h('div', { class: 't-sub' }, progress.done + ' из ' + progress.total + (overdue ? ' · есть просрочка' : ''))
          ),
          h('td', {}, userName(project.responsible_user_id)),
          h('td', { class: 'nowrap' }, formatDate(project.last_activity_at), h('div', { class: 't-sub' }, staleDays + ' ' + plural(staleDays, 'день', 'дня', 'дней') + ' назад'))
        );
      }))
    )
  );

  return frag(
    h('div', { class: 'page-head' },
      h('div', { class: 'titles' },
        h('h1', {}, 'Проекты и соглашения'),
        h('div', { class: 'subtitle' }, 'Найдено записей: ' + rows.length + ' из ' + db.projects.length)
      ),
      h('div', { class: 'page-actions' },
        exportButton('Выгрузить в CSV', 'projects.csv',
          ['Код', 'Наименование', 'Тип', 'Отрасль', 'Направление', 'Компания', 'Страна', 'Регион', 'Статус', 'Сумма', 'Валюта', 'Сумма USD', 'Ответственный', 'Этапов выполнено', 'Этапов всего', 'Последняя активность'],
          () => rows.map((p) => {
            const progress = projectProgress(p.id);
            return [p.code, p.title, dictName(RECORD_TYPES, p.record_type), dictName(SECTORS, p.sector_code),
              AREA_LABELS[p.area], companyById(p.company_id).name, countryName(p.iso2), regionName(countryRegion(p.iso2)),
              dictName(PROJECT_STATUSES, p.status_code), p.amount, p.currency, Math.round(toUsd(p.amount, p.currency)),
              userName(p.responsible_user_id), progress.done, progress.total, p.last_activity_at];
          }), 'реестр проектов'),
        can(state.user, 'project.create')
          ? h('button', { class: 'btn btn-primary', onclick: openProjectCreate }, '+ Новая запись')
          : permNote('Создание записей доступно администратору и проектным менеджерам')
      )
    ),
    filters,
    chips,
    h('div', { class: 'card' },
      rows.length
        ? h('div', { class: 'card-body tight' }, table)
        : h('div', { class: 'card-body' }, empty('Записей не найдено', 'Измените условия фильтрации.', '▦'))
    ),
    h('div', { class: 'legend-inline' },
      h('span', {}, h('span', { class: 'sw', style: { background: 'var(--danger)' } }), 'красная отметка — есть просроченный этап'),
      h('span', {}, h('span', { class: 'sw', style: { background: 'var(--warn)' } }), 'жёлтая — нет активности более ' + STALE_DAYS + ' дней')
    )
  );
}

function renderProject(id) {
  const project = projectById(id);
  if (!project) return notFound('Запись не найдена');

  const company = companyById(project.company_id);
  const steps = stepsOf(project.id);
  const progress = projectProgress(project.id);
  const mayEdit = can(state.user, 'project.edit');
  const mayStatus = canOn(state.user, 'project.status_change', project);
  const mayRequest = can(state.user, 'correction.request');
  const relatedMeetings = db.meetings.filter((m) => m.project_id === project.id);
  const history = db.statusHistory.filter((s) => s.project_id === project.id).sort((a, b) => (a.created_at < b.created_at ? 1 : -1));
  const requests = correctionsOf('project', project.id);

  // --- Действия в шапке: набор зависит от роли ---
  const actions = [];
  if (mayEdit) actions.push(h('button', { class: 'btn btn-primary', onclick: () => openProjectEdit(project) }, '✎ Изменить'));
  else if (mayRequest) actions.push(h('button', { class: 'btn btn-primary', onclick: () => openCorrectionForm('project', project.id, project.title, project) }, '✎ Запросить исправление'));
  if (mayStatus) actions.push(h('button', { class: 'btn', onclick: () => openStatusChange(project) }, '⇄ Сменить статус'));
  if (can(state.user, 'project.delete')) actions.push(h('button', { class: 'btn btn-danger', onclick: () => deleteProject(project) }, 'Удалить'));
  actions.push(exportButton('Дорожная карта в CSV', 'roadmap-' + project.code + '.csv',
    ['№', 'Этап', 'Срок', 'Состояние', 'Ответственный', 'Отметка о выполнении'],
    () => steps.map((s) => [s.seq, s.title, s.due_date, STEP_STATE_LABELS[s.state], userName(s.responsible_user_id), s.done_at || '']),
    'дорожная карта ' + project.code));

  // Пояснение для ролей без права изменения
  const permissionCallout = mayEdit ? null

      ? h('div', { class: 'callout' },

          'Данные фиксируются в момент создания. Чтобы исправить ошибку, отправьте заявку — администратор внесёт изменение, и оно будет записано в журнал аудита.')
      : h('div', { class: 'callout info' },
          h('b', {}, 'Режим просмотра. '),
          'Роль «Наблюдатель» даёт доступ ко всем данным и выгрузкам, но не позволяет изменять записи или комментировать.');

  const details = h('div', { class: 'card' },
    h('div', { class: 'card-head' }, h('h2', {}, 'Сведения о записи'), h('span', { class: 'mono muted' }, project.code)),
    h('div', { class: 'card-body' },
      h('dl', { class: 'def-list' },
        defItem('Тип записи', dictName(RECORD_TYPES, project.record_type)),
        defItem('Отрасль', dictName(SECTORS, project.sector_code)),
        defItem('Направление', AREA_LABELS[project.area]),
        defItem('Сумма', formatMoney(project.amount, project.currency)),
        defItem('Компания', h('a', { href: '#/companies/' + company.id }, company.name)),
        defItem('Страна', countryName(project.iso2) + ' · ' + regionName(countryRegion(project.iso2))),
        defItem('Ответственный', userName(project.responsible_user_id)),
        defItem('Создана', formatDate(project.created_at) + ' — ' + userName(project.created_by)),
        defItem('Последняя активность', formatDate(project.last_activity_at))
      ),
      h('div', { class: 'hr' }),
      h('div', { class: 'form-section-title' }, 'Описание'),
      h('p', { class: 'mb-0' }, project.description),
      contactsOf('project', project.id).length ? frag(
        h('div', { class: 'form-section-title' }, 'Контактные лица'),
        contactsOf('project', project.id).map((contact) =>
          h('div', { class: 'file-row' },
            h('span', { class: 'file-icon' }, initials(contact.full_name)),

              h('div', { class: 'file-name' }, contact.full_name),
              h('div', { class: 'file-meta' }, contact.position + ' · ' + contact.phone + ' · ' + contact.email)
            )
          )
        )
      ) : null
    )
  );

  // --- Дорожная карта ---
  const mayComplete = canOn(state.user, 'step.complete', project);
  const roadmap = h('div', { class: 'card' },
    h('div', { class: 'card-head' },
      h('h2', {}, 'Дорожная карта'),
      h('span', { class: 'muted small' }, 'выполнено ' + progress.done + ' из ' + progress.total + ' — ' + progress.percent + '%'),
      can(state.user, 'step.create') ? h('button', { class: 'btn btn-sm', onclick: () => openStepCreate(project) }, '+ Этап') : null

    h('div', { class: 'card-body' },

            h('button', {

              title: mayComplete

                : (can(state.user, 'step.complete')
                    ? 'Этапы можно отмечать только по своим записям'
                    : 'Роль «Наблюдатель» не изменяет записи'),
              onclick: () => toggleStep(project, step),
            }, '✓'),
            h('div', { class: 'step-main' },
              h('div', { class: 'step-title ' + (step.state === 'done' ? 'done' : '') }, step.title),
              h('div', { class: 'step-meta' },
                h('span', {}, 'срок: ' + formatDate(step.due_date)),
                h('span', { style: overdue ? { color: 'var(--danger)', fontWeight: '600' } : null },
                  step.state === 'done'
                    ? 'выполнен ' + formatDate(step.done_at)

                      ? 'просрочен на ' + Math.abs(days) + ' ' + plural(Math.abs(days), 'день', 'дня', 'дней')
                      : 'осталось ' + days + ' ' + plural(days, 'день', 'дня', 'дней')),
                h('span', {}, userName(step.responsible_user_id))
              )
            ),
            statusTag(STEP_STATE_LABELS[step.state],
              step.state === 'done' ? '#2e7d4f' : step.state === 'in_progress' ? '#1f4e9e' : '#6b7ba3')
          );
        }),
        h('div', { class: 'form-section-title' }, 'Сроки на шкале времени'),
        gantt(steps)
      ) : empty('Этапов пока нет', 'Добавьте этапы, чтобы отслеживать сроки.', '▤')
    )

  // --- Лента комментариев ---
  const commentInput = h('textarea', { placeholder: 'Комментарий по проекту…', rows: 3 });
  const comments = h('div', { class: 'card' },
    h('div', { class: 'card-head' }, h('h2', {}, 'Лента комментариев')),
    h('div', { class: 'card-body' },
      can(state.user, 'project.comment')
        ? frag(commentInput, h('div', { class: 'flex mt-1' },
            h('button', { class: 'btn btn-primary btn-sm', onclick: () => addComment(project, commentInput) }, 'Отправить'),
            h('span', { class: 'muted small' }, 'Комментарии доступны всем сотрудникам офиса.')))
        : h('div', { class: 'callout info' }, 'Роль «Наблюдатель» не оставляет комментарии.'),
      h('div', { class: 'mt-2' },
        commentsOf('project', project.id).length
          ? commentsOf('project', project.id).map((comment) =>
              h('div', { class: 'feed-item' },
                h('span', { class: 'avatar' }, initials(userName(comment.user_id))),
                h('div', { class: 'feed-body' },
                  h('div', { class: 'feed-head' },
                    h('span', { class: 'feed-author' }, userName(comment.user_id)),
                    h('span', { class: 'feed-time' }, formatDateTime(comment.created_at))
                  ),
                  h('div', { class: 'feed-text' }, comment.body)
                )
              )
            )
          : h('p', { class: 'muted mb-0' }, 'Комментариев пока нет.')
      )
    )
  );

  const meetingsCard = h('div', { class: 'card' },
    h('div', { class: 'card-head' }, h('h2', {}, 'Встречи по этому проекту')),
    relatedMeetings.length
      ? h('div', { class: 'card-body tight' },
          h('div', { class: 'table-wrap' },
            h('table', { class: 'data' },
              h('thead', {}, h('tr', {}, h('th', {}, 'Дата'), h('th', {}, 'Визит'), h('th', {}, 'Место'), h('th', {}, 'Статус'))),
              h('tbody', {}, relatedMeetings.map((meeting) =>
                h('tr', {},
                  h('td', { class: 'nowrap' }, formatDate(meeting.meet_date), h('div', { class: 't-sub' }, meeting.meet_time)),
                  h('td', {}, h('a', { href: '#/visits/' + meeting.visit_id }, visitById(meeting.visit_id).code), h('div', { class: 't-sub' }, countryName(visitById(meeting.visit_id).iso2))),
                  h('td', {}, meeting.venue),
                  h('td', {}, statusTag(dictName(MEETING_STATUSES, meeting.status_code), dictColor(MEETING_STATUSES, meeting.status_code)))
                )
              ))
            )
          )
        )
      : h('div', { class: 'card-body' }, h('p', { class: 'muted mb-0' }, 'Встречи по проекту не запланированы.'))
  );

  const historyCard = h('div', { class: 'card' },
    h('div', { class: 'card-head' }, h('h2', {}, 'История статусов')),
    h('div', { class: 'card-body' },
      history.map((entry) =>
        h('div', { class: 'attention-item' },
          h('span', { class: 'marker', style: { background: dictColor(PROJECT_STATUSES, entry.to_status) } }),
          h('span', { style: { minWidth: '0' } },
            h('div', { class: 'a-title' },
              entry.from_status ? dictName(PROJECT_STATUSES, entry.from_status) + ' → ' + dictName(PROJECT_STATUSES, entry.to_status) : dictName(PROJECT_STATUSES, entry.to_status)),
            h('div', { class: 'a-meta' }, entry.comment + ' · ' + userName(entry.user_id))
          ),
          h('span', { class: 'a-right' }, formatDate(entry.created_at))
        )

  );

  const requestsCard = requests.length ? h('div', { class: 'card' },
    h('div', { class: 'card-head' }, h('h2', {}, 'Заявки на исправление')),
    h('div', { class: 'card-body' },
      requests.map((request) =>
        h('div', { class: 'attention-item' },
          h('span', { class: 'marker', style: { background: request.status === 'pending' ? 'var(--warn)' : request.status === 'approved' ? 'var(--ok)' : 'var(--danger)' } }),
          h('span', { style: { minWidth: '0' } },
            h('div', { class: 'a-title' }, CORRECTION_STATUS[request.status]),
            h('div', { class: 'a-meta' }, request.reason)
          ),
          h('span', { class: 'a-right' }, userName(request.requested_by), h('div', {}, formatDate(request.created_at)))
        )
      ),
      h('div', { class: 'mt-1' }, h('a', { href: '#/corrections' }, 'Все заявки →'))
    )

  return frag(
    h('div', { class: 'breadcrumbs' }, h('a', { href: '#/projects' }, 'Проекты и соглашения'), ' / ', project.code),
    h('div', { class: 'page-head' },
      h('div', { class: 'titles' },
        h('h1', {}, project.title),
        h('div', { class: 'subtitle' },
          dictName(RECORD_TYPES, project.record_type) + ' · ' + company.name + ' · ' + countryName(project.iso2) + ' · ' + formatMoney(project.amount, project.currency))
      ),
      h('div', { class: 'page-actions' }, actions)
    ),
    h('div', { class: 'pill-row mb-2' },
      statusTag(dictName(PROJECT_STATUSES, project.status_code), dictColor(PROJECT_STATUSES, project.status_code)),
      h('span', { class: 'tag tag-plain' }, dictName(SECTORS, project.sector_code)),
      h('span', { class: 'tag tag-plain' }, AREA_LABELS[project.area]),
      h('span', { class: 'tag tag-plain' }, 'Ответственный: ' + userName(project.responsible_user_id))
    ),
    permissionCallout,
    h('div', { class: 'split' },
      column(details, roadmap, comments),
      column(historyCard, meetingsCard, requestsCard)
    )
  );
}

);

// --- Действия над проектом ---

function touchProject(project) {
  project.last_activity_at = new Date().toISOString().slice(0, 19).replace('T', ' ');
  project.updated_at = project.last_activity_at;
}

function toggleStep(project, step) {
  if (!canOn(state.user, 'step.complete', project)) {
    toastError(can(state.user, 'step.complete')
      ? 'Действие доступно только по записям, за которые вы отвечаете.'
      : 'Роль «Наблюдатель» не изменяет записи.');
    return;
  }
  const wasDone = step.state === 'done';
  step.state = wasDone ? 'in_progress' : 'done';
  step.done_at = wasDone ? null : new Date().toISOString().slice(0, 19).replace('T', ' ');
  step.done_by = wasDone ? null : state.user.id;
  touchProject(project);
  audit('update', 'step', step.id,
    (wasDone ? 'Снята отметка о выполнении этапа «' : 'Отмечено выполнение этапа «') + step.title + '» — ' + project.code,
    [{ label: 'Состояние', from: wasDone ? 'Выполнен' : 'В работе', to: STEP_STATE_LABELS[step.state] }]);
  toastOk(wasDone ? 'Отметка о выполнении снята.' : 'Этап отмечен выполненным.');
  render();
}

function addComment(project, textarea) {
  const body = textarea.value.trim();
  if (!body) { toastError('Комментарий пуст.'); return; }
  db.comments.push({
    id: ++db.seq.comment, entity_type: 'project', entity_id: project.id, user_id: state.user.id,
    created_at: new Date().toISOString().slice(0, 19).replace('T', ' '), body: body,
  });
  touchProject(project);
  audit('create', 'comment', project.id, 'Добавлен комментарий к записи ' + project.code, []);
  toastOk('Комментарий добавлен.');
  render();
}

function openStatusChange(project) {
  const statusSelect = select(PROJECT_STATUSES.map((s) => ({ value: s.code, label: s.name })), { value: project.status_code });
  const noteInput = h('textarea', { placeholder: 'Основание для смены статуса', rows: 3 });
  openModal({
    title: 'Смена статуса — ' + project.code,
    size: 'narrow',
    body: frag(
      field('Новый статус', statusSelect, { required: true }),
      field('Комментарий', noteInput, { help: 'Попадёт в историю статусов и журнал аудита.' })
    ),
    footer: (close) => [
      h('button', { class: 'btn', onclick: close }, 'Отмена'),
      h('button', { class: 'btn btn-primary', onclick: () => {
        const next = statusSelect.value;
        if (next === project.status_code) { toastError('Статус не изменился.'); return; }
        const from = project.status_code;
        project.status_code = next;
        touchProject(project);
        db.statusHistory.push({
          id: ++db.seq.history, project_id: project.id, from_status: from, to_status: next,
          comment: noteInput.value.trim() || 'Без комментария', user_id: state.user.id,
          created_at: new Date().toISOString().slice(0, 19).replace('T', ' '),
        });
        audit('status_change', 'project', project.id, 'Статус записи ' + project.code + ' изменён',
          [{ label: 'Статус', from: dictName(PROJECT_STATUSES, from), to: dictName(PROJECT_STATUSES, next) }]);
        close();
        toastOk('Статус изменён на «' + dictName(PROJECT_STATUSES, next) + '».');
        render();
      } }, 'Сохранить'),
    ],
  });
}

function projectFormFields(project) {
  const values = project || { title: '', description: '', amount: '', currency: 'USD', record_type: 'project', sector_code: 'textile', area: 'export', status_code: 'negotiation', company_id: db.companies[0].id, responsible_user_id: state.user.id };
  const controls = {
    title: h('input', { type: 'text', value: values.title, placeholder: 'Например: Поставка трикотажного полотна в Казахстан' }),
    description: h('textarea', { rows: 3 }, values.description),
    company: select(db.companies.map((c) => ({ value: c.id, label: c.name })), { value: values.company_id }),
    type: select(RECORD_TYPES.map((t) => ({ value: t.code, label: t.name })), { value: values.record_type }),
    sector: select(SECTORS.map((s) => ({ value: s.code, label: s.name })), { value: values.sector_code }),
    area: select([{ value: 'export', label: 'Экспорт' }, { value: 'investment', label: 'Инвестиции' }], { value: values.area }),
    status: select(PROJECT_STATUSES.map((s) => ({ value: s.code, label: s.name })), { value: values.status_code }),
    amount: h('input', { type: 'number', value: values.amount, min: '0', step: '1000' }),
    currency: select(Object.keys(RATES_TO_USD).map((c) => ({ value: c, label: c })), { value: values.currency }),

  };

    ),

function openProjectEdit(project) {
  const form = projectFormFields(project);
  const before = Object.assign({}, project);
  openModal({
    title: 'Изменение записи ' + project.code,
    body: form.body,
    footer: (close) => [
      h('button', { class: 'btn', onclick: close }, 'Отмена'),
      h('button', { class: 'btn btn-primary', onclick: () => {
        const values = form.read();
        if (!values.title) { toastError('Укажите наименование записи.'); return; }
        const labels = {
          title: 'Наименование', description: 'Описание', company_id: 'Компания', record_type: 'Тип записи',
          sector_code: 'Отрасль', area: 'Направление', status_code: 'Статус', amount: 'Сумма',
          currency: 'Валюта', responsible_user_id: 'Ответственный',
        };
        const display = (key, value) => {
          if (key === 'company_id') return companyById(value).name;
          if (key === 'record_type') return dictName(RECORD_TYPES, value);
          if (key === 'sector_code') return dictName(SECTORS, value);
          if (key === 'area') return AREA_LABELS[value];
          if (key === 'status_code') return dictName(PROJECT_STATUSES, value);
          if (key === 'responsible_user_id') return userName(value);
          if (key === 'amount') return formatNumber(value);
          return String(value);
        };
        const changes = [];
        Object.keys(values).forEach((key) => {
          if (String(before[key]) !== String(values[key])) {
            changes.push({ label: labels[key], from: display(key, before[key]), to: display(key, values[key]) });
          }
        });
        if (!changes.length) { toastError('Изменений нет.'); return; }
        Object.assign(project, values);
        project.iso2 = companyById(values.company_id).iso2;
        touchProject(project);
        if (before.status_code !== values.status_code) {
          db.statusHistory.push({
            id: ++db.seq.history, project_id: project.id, from_status: before.status_code, to_status: values.status_code,
            comment: 'Изменение записи администратором', user_id: state.user.id,
            created_at: new Date().toISOString().slice(0, 19).replace('T', ' '),
          });
        }
        audit('update', 'project', project.id, 'Изменена запись ' + project.code, changes);
        close();
        toastOk('Запись обновлена: изменено полей — ' + changes.length + '.');
        render();
      } }, 'Сохранить'),
    ],
  });
}

function openStepCreate(project) {

  const titleInput = h('input', { type: 'text', placeholder: 'Например: Отправка образцов партнёру' });

async function deleteProject(project) {
  const ok = await confirmDialog({
    title: 'Удаление записи',
    message: 'Запись ' + project.code + ' «' + project.title + '» будет удалена вместе с дорожной картой и комментариями. Продолжить?',
    confirmLabel: 'Удалить', danger: true,
  });
  if (!ok) return;
  db.projects = db.projects.filter((p) => p.id !== project.id);
  db.steps = db.steps.filter((s) => s.project_id !== project.id);
  db.comments = db.comments.filter((c) => !(c.entity_type === 'project' && c.entity_id === project.id));
  db.statusHistory = db.statusHistory.filter((s) => s.project_id !== project.id);
  audit('delete', 'project', project.id, 'Удалена запись ' + project.code + ' «' + project.title + '»', []);
  toastOk('Запись удалена.');
  location.hash = '#/projects';
}

//  13. Заявки на исправление (п. 2.3 ТЗ)
// ==========================================================================

const CORRECTION_STATUS = { pending: 'На рассмотрении', approved: 'Одобрена', rejected: 'Отклонена' };
const ENTITY_LABELS = { project: 'Проект', company: 'Компания', visit: 'Визит', meeting: 'Встреча', step: 'Этап' };
const ENTITY_ROUTES = { project: 'projects', company: 'companies', visit: 'visits', meeting: 'visits', step: 'projects' };

/** Поля, исправление которых можно предложить в заявке. */
const CORRECTABLE = {
  project: [
    { key: 'title', label: 'Наименование', type: 'text' },
    { key: 'amount', label: 'Сумма', type: 'number' },
    { key: 'currency', label: 'Валюта', type: 'select', options: () => Object.keys(RATES_TO_USD).map((c) => ({ value: c, label: c })) },
    { key: 'description', label: 'Описание', type: 'textarea' },
    { key: 'sector_code', label: 'Отрасль', type: 'select', options: () => SECTORS.map((s) => ({ value: s.code, label: s.name })) },
    { key: 'area', label: 'Направление', type: 'select', options: () => [{ value: 'export', label: 'Экспорт' }, { value: 'investment', label: 'Инвестиции' }] },
  ],
  company: [
    { key: 'name', label: 'Наименование', type: 'text' },
    { key: 'city', label: 'Город', type: 'text' },
    { key: 'industry', label: 'Отрасль деятельности', type: 'text' },
    { key: 'website', label: 'Сайт', type: 'text' },
    { key: 'profile', label: 'Профиль компании', type: 'textarea' },
  ],
  visit: [
    { key: 'cities', label: 'Города', type: 'text' },
    { key: 'goal', label: 'Цель визита', type: 'textarea' },
    { key: 'date_from', label: 'Дата начала', type: 'date' },
    { key: 'date_to', label: 'Дата окончания', type: 'date' },
  ],
};

function openCorrectionForm(entityType, entityId, entityLabel, record) {
  if (!can(state.user, 'correction.request')) {
    toastError('Заявки на исправление подают проектные менеджеры.');
    return;
  }
  const fields = CORRECTABLE[entityType];
  const fieldSelect = select(fields.map((f) => ({ value: f.key, label: f.label })), { value: fields[0].key });
  const valueSlot = h('div', {});
  const reasonInput = h('textarea', { rows: 3, placeholder: 'Например: при создании записи ошибочно указана сумма — опечатка в порядке цифр.' });
  let currentControl = null;

  const buildControl = () => {
    const definition = fields.find((f) => f.key === fieldSelect.value);
    const current = record[definition.key];
    if (definition.type === 'select') currentControl = select(definition.options(), { value: current });
    else if (definition.type === 'textarea') currentControl = h('textarea', { rows: 3 }, String(current || ''));
    else currentControl = h('input', { type: definition.type === 'number' ? 'number' : definition.type === 'date' ? 'date' : 'text', value: current === null || current === undefined ? '' : String(current) });
    setChildren(valueSlot,
      h('div', { class: 'callout info' }, h('b', {}, 'Текущее значение: '), String(current === '' || current === null ? '(пусто)' : current)),
      field('Предлагаемое значение', currentControl, { required: true })
    );
  };
  fieldSelect.addEventListener('change', buildControl);
  buildControl();

  openModal({
    title: 'Заявка на исправление',
    body: frag(
      h('div', { class: 'callout' },
        'Проектный менеджер не изменяет записи напрямую. Опишите ошибку — администратор рассмотрит заявку, ',
        'внесёт исправление и оно будет зафиксировано в журнале аудита.'),
      h('div', { class: 'def-list mb-2' }, defItem('Запись', entityLabel), defItem('Тип', ENTITY_LABELS[entityType])),
      field('Какое поле исправить', fieldSelect, { required: true }),
      valueSlot,
      field('Причина исправления', reasonInput, { required: true })
    ),
    footer: (close) => [
      h('button', { class: 'btn', onclick: close }, 'Отмена'),
      h('button', { class: 'btn btn-primary', onclick: () => {
        const reason = reasonInput.value.trim();
        if (!reason) { toastError('Опишите причину исправления.'); return; }
        const definition = fields.find((f) => f.key === fieldSelect.value);
        let value = currentControl.value;
        if (definition.type === 'number') value = Number(value) || 0;
        if (String(value) === String(record[definition.key])) { toastError('Предлагаемое значение совпадает с текущим.'); return; }
        const proposed = {};
        proposed[definition.key] = value;
        const request = {
          id: ++db.seq.correction, entity_type: entityType, entity_id: entityId, entity_label: entityLabel,
          requested_by: state.user.id, reason: reason, proposed: proposed, status: 'pending',
          created_at: new Date().toISOString().slice(0, 19).replace('T', ' '),
          decided_by: null, decided_at: null, decision_note: '',
        };
        db.corrections.push(request);
        audit('create', 'correction', request.id, 'Создана заявка на исправление: ' + entityLabel + ' — поле «' + definition.label + '»', []);
        close();
        toastOk('Заявка отправлена администратору. Следить за ней можно в разделе «Заявки на исправление».');
        render();
      } }, 'Отправить заявку'),
    ],
  });
}

function fieldLabelFor(entityType, key) {
  const definition = (CORRECTABLE[entityType] || []).find((f) => f.key === key);
  return definition ? definition.label : key;
}

function correctionTarget(request) {
  if (request.entity_type === 'project') return projectById(request.entity_id);
  if (request.entity_type === 'company') return companyById(request.entity_id);
  if (request.entity_type === 'visit') return visitById(request.entity_id);
  return null;
}

function decideCorrection(request, approve) {
  const target = correctionTarget(request);
  if (approve && !target) { toastError('Запись, к которой относится заявка, больше не существует.'); return; }
  const noteInput = h('textarea', { rows: 2, placeholder: approve ? 'Комментарий к решению (необязательно)' : 'Причина отказа' });
  const changes = approve && target
    ? Object.keys(request.proposed).map((key) => ({
        label: fieldLabelFor(request.entity_type, key),
        from: String(target[key]), to: String(request.proposed[key]),
      }))
    : [];

  openModal({
    title: approve ? 'Одобрить заявку' : 'Отклонить заявку',
    size: 'narrow',
    body: frag(
      h('div', { class: 'def-list mb-2' },
        defItem('Запись', request.entity_label),
        defItem('Автор заявки', userName(request.requested_by))
      ),
      h('div', { class: 'callout' }, h('b', {}, 'Причина: '), request.reason),
      approve
        ? h('div', { class: 'callout ok' },
            h('b', {}, 'Будет применено: '),
            changes.map((change) => h('div', { class: 'audit-change' },
              h('b', {}, change.label + ': '),
              h('span', { class: 'from' }, change.from),
              ' → ',
              h('span', { class: 'to' }, change.to)))
          )
        : null,
      field(approve ? 'Комментарий' : 'Причина отказа', noteInput, { required: !approve })
    ),
    footer: (close) => [
      h('button', { class: 'btn', onclick: close }, 'Отмена'),
      h('button', { class: 'btn ' + (approve ? 'btn-primary' : 'btn-danger'), onclick: () => {
        if (!approve && !noteInput.value.trim()) { toastError('Укажите причину отказа.'); return; }
        request.status = approve ? 'approved' : 'rejected';
        request.decided_by = state.user.id;
        request.decided_at = new Date().toISOString().slice(0, 19).replace('T', ' ');
        request.decision_note = noteInput.value.trim();
        if (approve) {
          Object.assign(target, request.proposed);
          if (request.entity_type === 'project') touchProject(target);
          audit('update', request.entity_type, request.entity_id,
            'Исправление по заявке №' + request.id + ' — ' + request.entity_label, changes);
        }
        audit(approve ? 'update' : 'update', 'correction', request.id,
          'Заявка №' + request.id + ' ' + (approve ? 'одобрена' : 'отклонена'), []);
        close();
        toastOk(approve ? 'Заявка одобрена, изменение внесено и записано в журнал аудита.' : 'Заявка отклонена.');
        render();
      } }, approve ? 'Одобрить и применить' : 'Отклонить'),
    ],
  });
}

function renderCorrections(query) {
  let rows = db.corrections.slice().sort((a, b) => (a.created_at < b.created_at ? 1 : -1));
  if (state.user.role === 'team') rows = rows.filter((r) => r.requested_by === state.user.id);
  if (query.status) rows = rows.filter((r) => r.status === query.status);

  const chips = h('div', { class: 'filter-chips' },
    [{ key: '', label: 'Все заявки' }, { key: 'pending', label: 'На рассмотрении' }, { key: 'approved', label: 'Одобренные' }, { key: 'rejected', label: 'Отклонённые' }].map((item) =>
      h('button', { class: 'chip ' + ((query.status || '') === item.key ? 'active' : ''), onclick: () => go('/corrections', item.key ? { status: item.key } : {}) }, item.label)
    )
  );

  const table = h('div', { class: 'table-wrap' },
    h('table', { class: 'data' },
      h('thead', {}, h('tr', {},
        h('th', {}, 'Статус'), h('th', {}, 'Запись'), h('th', {}, 'Что исправить'),
        h('th', {}, 'Предложено'), h('th', {}, 'Автор'), h('th', {}, 'Решение'),
        can(state.user, 'correction.decide') ? h('th', {}, '') : null
      )),
      h('tbody', {}, rows.map((request) =>
        h('tr', {},
          h('td', {},
            h('span', { class: 'tag ' + (request.status === 'pending' ? 'tag-warn' : request.status === 'approved' ? 'tag-ok' : 'tag-danger') }, CORRECTION_STATUS[request.status]),
            h('div', { class: 't-sub' }, formatDateTime(request.created_at))
          ),
          h('td', {},
            h('a', { href: '#/' + ENTITY_ROUTES[request.entity_type] + '/' + request.entity_id }, request.entity_label),
            h('div', { class: 't-sub' }, ENTITY_LABELS[request.entity_type])
          ),
          h('td', { style: { maxWidth: '320px' } }, request.reason),
          h('td', {}, Object.keys(request.proposed).map((key) =>
            h('div', { class: 'audit-change' }, h('b', {}, fieldLabelFor(request.entity_type, key) + ': '), h('span', { class: 'to' }, String(request.proposed[key]))))),
          h('td', {}, userName(request.requested_by)),
          h('td', {},
            request.status === 'pending'
              ? h('span', { class: 'muted' }, '—')
              : frag(userName(request.decided_by),
                  h('div', { class: 't-sub' }, formatDateTime(request.decided_at)),
                  request.decision_note ? h('div', { class: 'small' }, request.decision_note) : null)
          ),
          can(state.user, 'correction.decide')
            ? h('td', { class: 'nowrap' },
                request.status === 'pending'
                  ? frag(
                      h('button', { class: 'btn btn-sm btn-primary', onclick: () => decideCorrection(request, true) }, 'Одобрить'),
                      ' ',
                      h('button', { class: 'btn btn-sm', onclick: () => decideCorrection(request, false) }, 'Отклонить')
                    )
                  : h('span', { class: 'muted small' }, 'рассмотрена')
              )
            : null
        )
      ))
    )
  );

  return frag(
    h('div', { class: 'page-head' },
      h('div', { class: 'titles' },
        h('h1', {}, 'Заявки на исправление'),
        h('div', { class: 'subtitle' },
          state.user.role === 'admin'
            ? 'Запросы проектных менеджеров на изменение созданных записей'
            : 'Ваши запросы на исправление записей')
      ),
      h('div', { class: 'page-actions' },
        exportButton('Выгрузить в CSV', 'corrections.csv',
          ['№', 'Статус', 'Тип записи', 'Запись', 'Причина', 'Автор', 'Создана', 'Решение принял', 'Дата решения', 'Комментарий'],
          () => rows.map((r) => [r.id, CORRECTION_STATUS[r.status], ENTITY_LABELS[r.entity_type], r.entity_label,
            r.reason, userName(r.requested_by), r.created_at, r.decided_by ? userName(r.decided_by) : '', r.decided_at || '', r.decision_note]),
          'заявки на исправление')
      )
    ),
    h('div', { class: 'callout info' },
      'Проектные менеджеры не могут изменять записи после создания — это гарантирует достоверность данных. ',
      'Ошибки исправляются через заявку: администратор вносит изменение, и оно фиксируется в журнале аудита.'),
    chips,
    h('div', { class: 'card' },
      rows.length
        ? h('div', { class: 'card-body tight' }, table)
        : h('div', { class: 'card-body' }, empty('Заявок нет', 'Запросы на исправление появятся здесь.', '✎'))
    )
  );
}

function renderCompanies(query) {
  let rows = db.companies.slice();
  if (query.search) {
    const term = query.search.toLowerCase();
    rows = rows.filter((c) => (c.name + ' ' + c.city + ' ' + c.industry).toLowerCase().indexOf(term) !== -1);
  }
  if (query.region) rows = rows.filter((c) => countryRegion(c.iso2) === query.region);
  if (query.country) rows = rows.filter((c) => c.iso2 === query.country);

  const searchInput = h('input', { type: 'search', value: query.search || '', placeholder: 'Наименование, город, отрасль' });
  searchInput.addEventListener('input', debounce(() => go('/companies', Object.assign({}, query, { search: searchInput.value || undefined })), 350));

  return frag(
    h('div', { class: 'page-head' },
      h('div', { class: 'titles' },
        h('h1', {}, 'Компании и партнёры'),
        h('div', { class: 'subtitle' }, 'Найдено: ' + rows.length + ' из ' + db.companies.length)
      ),
      h('div', { class: 'page-actions' },
        exportButton('Выгрузить в CSV', 'companies.csv',
          ['Код', 'Наименование', 'Страна', 'Регион', 'Город', 'Отрасль', 'Сайт', 'Ответственный', 'Проектов', 'Сумма проектов USD'],
          () => rows.map((c) => {
