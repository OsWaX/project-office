}

function renderVisit(id) {
  const visit = visitById(id);
  if (!visit) return notFound('Визит не найден');
  const meetings = meetingsOfVisit(visit.id).sort((a, b) =>
    a.meet_date === b.meet_date ? (a.meet_time < b.meet_time ? -1 : 1) : (a.meet_date < b.meet_date ? -1 : 1));
  const members = membersOfVisit(visit.id);
  const mayEditMeetings = canOn(ui.user, 'meeting.status_change', visit);

  const actions = [];
  if (can(ui.user, 'visit.edit')) actions.push(h('button', { class: 'btn btn-primary', onclick: () => openVisitEdit(visit) }, '✎ Изменить'));
  else if (can(ui.user, 'correction.request')) actions.push(h('button', { class: 'btn btn-primary', onclick: () => openCorrectionForm('visit', visit.id, countryName(visit.iso2) + ' — ' + visit.cities, visit) }, '✎ Запросить исправление'));
  if (canOn(ui.user, 'meeting.create', visit)) actions.push(h('button', { class: 'btn', onclick: () => openMeetingCreate(visit) }, '+ Встреча'));
  if (can(ui.user, 'visit.delete')) actions.push(h('button', { class: 'btn btn-danger', onclick: async () => {
    const ok = await confirmDialog({
      title: 'Удаление визита',
      message: 'Визит ' + visit.code + ' вместе с программой встреч будет перемещён в корзину. Продолжить?',
      confirmLabel: 'Удалить', danger: true,
    });
    if (!ok) return;
    trashVisit(visit);
    audit('delete', 'visit', visit.id, 'Удалён визит ' + visit.code, []);
    nav('#/visits');
    await persist('Визит перемещён в корзину.');
  } }, 'Удалить'));
  actions.push(exportButton('Программа в CSV', 'agenda-' + visit.code + '.csv',
    ['Дата', 'Время', 'Собеседник', 'Место', 'Статус', 'Участники', 'Примечания'],
    () => meetings.map((m) => [m.meet_date, m.meet_time, m.company_name, m.venue, dictName(MEETING_STATUSES, m.status_code), m.participants, m.notes]),
    'программа визита ' + visit.code));

  // Программа встреч, сгруппированная по дням
  const byDay = {};
  meetings.forEach((meeting) => {
    if (!byDay[meeting.meet_date]) byDay[meeting.meet_date] = [];
    byDay[meeting.meet_date].push(meeting);
  });
  const days = Object.keys(byDay).sort();

  const agenda = h('div', { class: 'card' },
    h('div', { class: 'card-head' },
      h('h2', {}, 'Программа встреч'),
      h('span', { class: 'muted small' }, 'встреч: ' + meetings.length + ' · дней: ' + days.length)
    ),
    h('div', { class: 'card-body' },
      days.length
        ? days.map((date) =>
            h('div', { class: 'agenda-day' },
              h('div', { class: 'agenda-date' }, formatDate(date, { long: true }) + ' — ' + WEEKDAYS_SHORT[(new Date(date + 'T00:00:00').getDay() + 6) % 7]),
              byDay[date].map((meeting) =>
                h('div', { class: 'agenda-item' },
                  h('div', { class: 'agenda-time' }, meeting.meet_time || '—'),
                  h('div', { class: 'agenda-body' },
                    h('div', { class: 'agenda-title' },
                      meeting.company_id ? h('a', { href: '#/companies/' + meeting.company_id }, meeting.company_name) : meeting.company_name),
                    h('div', { class: 'agenda-meta' },
                      h('span', {}, meeting.venue || 'место уточняется'),
                      meeting.participants ? h('span', {}, 'участники: ' + meeting.participants) : null,
                      meeting.project_id ? h('a', { href: '#/projects/' + meeting.project_id }, projectById(meeting.project_id) ? projectById(meeting.project_id).code : '') : null,
                      statusTag(dictName(MEETING_STATUSES, meeting.status_code), dictColor(MEETING_STATUSES, meeting.status_code)),
                      mayEditMeetings
                        ? h('button', { class: 'btn btn-sm btn-ghost', onclick: () => openMeetingStatus(visit, meeting) }, 'Статус')
                        : null
                    ),
                    meeting.notes ? h('div', { class: 'small muted mt-1' }, meeting.notes) : null
                  )
                )
              )
            )
          )
        : empty('Программа пуста', 'Добавьте встречи, чтобы составить программу визита.', '✈')
    )
  );

  return frag(
    h('div', { class: 'breadcrumbs' }, h('a', { href: '#/visits' }, 'Визиты и встречи'), ' / ', visit.code),
    h('div', { class: 'page-head' },
      h('div', { class: 'titles' },
        h('h1', {}, countryName(visit.iso2) + ' — ' + visit.cities),
        h('div', { class: 'subtitle' }, DIRECTION_LABELS[visit.direction] + ' · ' + formatDate(visit.date_from) + ' — ' + formatDate(visit.date_to) + ' · ' + userName(visit.responsible_user_id))
      ),
      h('div', { class: 'page-actions' }, actions)
    ),
    h('div', { class: 'pill-row mb-2' },
      statusTag(dictName(VISIT_STATUSES, visit.status_code), dictColor(VISIT_STATUSES, visit.status_code)),
      h('span', { class: 'tag tag-plain mono' }, visit.code),
      h('span', { class: 'tag tag-plain' }, regionName(countryRegion(visit.iso2)))
    ),
    h('div', { class: 'split' },
      column(agenda),
      column(
        customFieldsCard('visit', visit),
        h('div', { class: 'card' },
          h('div', { class: 'card-head' }, h('h2', {}, 'Цель визита')),
          h('div', { class: 'card-body' },
            h('p', { class: visit.outcome ? '' : 'mb-0' }, visit.goal),
            visit.outcome ? frag(h('div', { class: 'form-section-title' }, 'Итоги'), h('p', { class: 'mb-0' }, visit.outcome)) : null
          )
        ),
        h('div', { class: 'card' },
          h('div', { class: 'card-head' }, h('h2', {}, 'Состав делегации'), h('span', { class: 'muted small' }, 'человек: ' + members.length)),
          h('div', { class: 'card-body' },
            members.map((member) =>
              h('div', { class: 'file-row' },
                h('span', { class: 'file-icon' }, initials(member.full_name)),
                h('span', { style: { minWidth: '0' } },
                  h('div', { class: 'file-name' }, member.full_name),
                  h('div', { class: 'file-meta' }, member.position),
                  h('div', { class: 'file-meta' }, member.organization)
                )
              )
            )
          )
        ),
        h('div', { class: 'card' },
          h('div', { class: 'card-head' }, h('h2', {}, 'Сводка по встречам')),
          h('div', { class: 'card-body' },
            barList(MEETING_STATUSES.map((status) => ({
              key: status.code, label: status.name, color: status.color,
              count: meetings.filter((m) => m.status_code === status.code).length,
            })).filter((row) => row.count), { showAmount: false })
          )
        )
      )
    )
  );
}

function visitFormFields(visit) {
  const customVisit = customFieldControls('visit', (visit && visit.customValues) || {});
  const values = visit || { direction: 'outbound', iso2: 'DE', cities: '', date_from: iso(21), date_to: iso(25), status_code: 'planned', goal: '', outcome: '', responsible_user_id: ui.user.id };
  const controls = {
    direction: select([{ value: 'outbound', label: 'Выездной визит' }, { value: 'inbound', label: 'Приём делегации' }], { value: values.direction }),
    country: select(countryOptions(), { value: values.iso2 }),
    cities: h('input', { type: 'text', value: values.cities, placeholder: 'Например: Гамбург, Дюссельдорф' }),
    from: h('input', { type: 'date', value: values.date_from }),
    to: h('input', { type: 'date', value: values.date_to }),
    status: select(dictActive(VISIT_STATUSES).map((s) => ({ value: s.code, label: s.name })), { value: values.status_code }),
    goal: h('textarea', { rows: 3 }, values.goal),
    outcome: h('textarea', { rows: 3 }, values.outcome),
    responsible: select(state.users.filter((u) => u.role !== 'viewer').map((u) => ({ value: u.id, label: u.full_name })), { value: values.responsible_user_id }),
  };
  return {
    body: frag(
      h('div', { class: 'form-row' }, field('Тип визита', controls.direction, { required: true }), field('Страна', controls.country, { required: true })),
      field('Города', controls.cities, { required: true }),
      h('div', { class: 'form-row' }, field('Дата начала', controls.from, { required: true }), field('Дата окончания', controls.to, { required: true })),
      h('div', { class: 'form-row' }, field('Статус', controls.status), field('Ответственный', controls.responsible)),
      field('Цель визита', controls.goal, { required: true }),
      visit ? field('Итоги визита', controls.outcome, { help: 'Заполняется после завершения визита.' }) : null,
      customVisit.body
    ),
    read: () => ({
      direction: controls.direction.value, iso2: controls.country.value, cities: controls.cities.value.trim(),
      date_from: controls.from.value, date_to: controls.to.value, status_code: controls.status.value,
      goal: controls.goal.value.trim(), outcome: controls.outcome.value.trim(),
      responsible_user_id: Number(controls.responsible.value),
      customValues: customVisit.read(),
    }),
  };
}

function openVisitCreate() {
  const form = visitFormFields(null);
  openModal({
    title: 'Новый визит',
    body: form.body,
    footer: (close) => [
      h('button', { class: 'btn', onclick: close }, 'Отмена'),
      h('button', { class: 'btn btn-primary', onclick: async () => {
        const values = form.read();
        if (!values.cities || !values.goal) { toastError('Укажите города и цель визита.'); return; }
        if (values.date_to < values.date_from) { toastError('Дата окончания раньше даты начала.'); return; }
        const id = ++state.seq.visit;
        state.visits.push(Object.assign({
          id: id, code: 'VIS-' + String(id).padStart(4, '0'), created_by: ui.user.id,
          created_at: new Date().toISOString().slice(0, 19).replace('T', ' '),
        }, values));
        state.members.push({
          id: ++state.seq.member, visit_id: id, user_id: values.responsible_user_id,
          full_name: userName(values.responsible_user_id), organization: 'Проектный офис', position: 'Руководитель делегации',
        });
        audit('create', 'visit', id, 'Создан визит VIS-' + String(id).padStart(4, '0') + ' «' + values.cities + '»', []);
        close();
        nav('#/visits/' + id);
        await persist('Визит создан.');
      } }, 'Создать визит'),
    ],
  });
}

function openVisitEdit(visit) {
  const form = visitFormFields(visit);
  const before = Object.assign({}, visit);
  openModal({
    title: 'Изменение визита ' + visit.code,
    body: form.body,
    footer: (close) => [
      h('button', { class: 'btn', onclick: close }, 'Отмена'),
      h('button', { class: 'btn btn-primary', onclick: async () => {
        const values = form.read();
        if (!values.cities || !values.goal) { toastError('Укажите города и цель визита.'); return; }
        const labels = { direction: 'Тип визита', iso2: 'Страна', cities: 'Города', date_from: 'Дата начала', date_to: 'Дата окончания', status_code: 'Статус', goal: 'Цель', outcome: 'Итоги', responsible_user_id: 'Ответственный' };
        const changes = [];
        Object.keys(values).forEach((key) => {
          if (key === 'customValues') return;
          if (String(before[key] || '') !== String(values[key] || '')) {
            changes.push({ label: labels[key], from: String(before[key] || '(пусто)'), to: String(values[key] || '(пусто)') });
          }
        });
        diffCustom('visit', before.customValues || {}, values.customValues || {}).forEach((c) => changes.push(c));
        if (!changes.length) { toastError('Изменений нет.'); return; }
        Object.assign(visit, values);
        audit('update', 'visit', visit.id, 'Изменён визит ' + visit.code, changes);
        close();
        await persist('Визит обновлён.');
      } }, 'Сохранить'),
    ],
  });
}

function openMeetingCreate(visit) {
  const nameInput = h('input', { type: 'text', placeholder: 'Компания или организация' });
  const companySelect = select(state.companies.map((c) => ({ value: c.id, label: c.name })), { value: '', placeholder: 'Не из справочника' });

  const venueInput = h('input', { type: 'text', placeholder: 'Место проведения' });

  const statusSelect = select(MEETING_STATUSES.map((s) => ({ value: s.code, label: s.name })), { value: 'tbc' });

  openModal({
    title: 'Новая встреча в программе визита',
    body: frag(
      field('Компания из справочника', companySelect, { help: 'Если встреча с партнёром из реестра — выберите его, чтобы связать встречу с проектом.' }),
      field('Собеседник', nameInput, { required: true }),
      h('div', { class: 'form-row' }, field('Дата', dateInput, { required: true }), field('Время', timeInput)),
      field('Место проведения', venueInput),
      field('Участники', participantsInput),
      field('Статус встречи', statusSelect),
      field('Примечания', notesInput)
    ),
    footer: (close) => [
      h('button', { class: 'btn', onclick: close }, 'Отмена'),

        const name = nameInput.value.trim() || (companySelect.value ? companyById(companySelect.value).name : '');
        if (!name) { toastError('Укажите, с кем встреча.'); return; }

        const linked = companyId ? projectsOfCompany(companyId)[0] : null;
        const meeting = {
          id: ++state.seq.meeting, visit_id: visit.id, company_id: companyId, company_name: name,

function renderKanban(query) {
  let projects = state.projects.slice();
  if (query.mine === '1') projects = projects.filter((p) => p.responsible_user_id === ui.user.id);
  if (query.sector) projects = projects.filter((p) => p.sector_code === query.sector);

  const columns = PROJECT_STATUSES.map((status) => ({
    status: status,
    items: projects.filter((p) => p.status_code === status.code),
  }));

  const mayMove = can(ui.user, 'project.status_change');
  let dragged = null;

  const board = h('div', { class: 'kanban' },
    columns.map((columnData) => {
      const cards = h('div', { class: 'kanban-cards' },
        columnData.items.map((project) => {
          const movable = canOn(ui.user, 'project.status_change', project);
          const progress = projectProgress(project.id);
          const overdue = stepsOf(project.id).some((s) => s.state !== 'done' && daysUntil(s.due_date) < 0);
          const card = h('div', {
            class: 'kanban-card',
            draggable: movable ? 'true' : null,
            style: movable ? null : { cursor: 'default' },
            title: movable ? 'Перетащите, чтобы изменить статус' : 'Статус меняет ответственный за запись или администратор',
          },
            h('div', { class: 'kc-code' }, project.code, movable ? null : ' 🔒'),
            h('div', { class: 'kc-title' }, h('a', { href: '#/projects/' + project.id, style: { color: 'inherit' } }, project.title)),
            h('div', { class: 'kc-meta' },
              h('span', {}, companyName(project.company_id)),
              h('span', {}, formatMoney(project.amount, project.currency, { compact: true }))
            ),
            h('div', { class: 'progress mt-1' }, h('span', { style: { width: progress.percent + '%', background: overdue ? 'var(--danger)' : 'var(--ok)' } })),
            h('div', { class: 'kc-meta mt-1' },
              h('span', {}, userName(project.responsible_user_id)),
              overdue ? h('span', { style: { color: 'var(--danger)', fontWeight: '600' } }, 'просрочка') : null
            )
          );
          if (movable) {
            card.addEventListener('dragstart', (event) => {
              dragged = project;
              card.classList.add('dragging');
              if (event.dataTransfer) {
                event.dataTransfer.effectAllowed = 'move';
                try { event.dataTransfer.setData('text/plain', project.code); } catch (e) { /* старые браузеры */ }
              }
            });
            card.addEventListener('dragend', () => { dragged = null; card.classList.remove('dragging'); });
          }
          return card;
        })
      );

      const column = h('div', { class: 'kanban-col' },
        h('div', { class: 'kanban-col-head' },
          h('span', { class: 'dot', style: { width: '8px', height: '8px', borderRadius: '50%', background: columnData.status.color, display: 'inline-block' } }),
          h('span', {}, columnData.status.name),
          h('span', { class: 'count' }, String(columnData.items.length))
        ),
        cards
      );

      column.addEventListener('dragover', (event) => {
        if (!dragged) return;
        event.preventDefault();
        event.dataTransfer.dropEffect = 'move';
        column.classList.add('drag-over');
      });
      column.addEventListener('dragleave', () => column.classList.remove('drag-over'));
      column.addEventListener('drop', async (event) => {
        event.preventDefault();
        column.classList.remove('drag-over');
        if (!dragged) return;
        const project = dragged;
        dragged = null;
        if (project.status_code === columnData.status.code) return;
        if (!canOn(ui.user, 'project.status_change', project)) {
          toastError('Статус можно менять только по своим записям.');
          return;
        }
        const from = project.status_code;
        project.status_code = columnData.status.code;
        touchProject(project);
        state.statusHistory.push({
          id: ++state.seq.history, project_id: project.id, from_status: from, to_status: columnData.status.code,
          comment: 'Перенос на доске проектов', user_id: ui.user.id,
          created_at: new Date().toISOString().slice(0, 19).replace('T', ' '),
        });
        audit('status_change', 'project', project.id, 'Статус записи ' + project.code + ' изменён на доске проектов',
          [{ label: 'Статус', from: dictName(PROJECT_STATUSES, from), to: columnData.status.name }]);
        await persist(project.code + ': статус — «' + columnData.status.name + '».');
      });
      return column;
    })
  );

  return frag(
    h('div', { class: 'page-head' },
      h('div', { class: 'titles' },
        h('h1', {}, 'Доска проектов'),
        h('div', { class: 'subtitle' }, mayMove
          ? 'Перетащите карточку в другую колонку, чтобы изменить статус записи'
          : 'Роль «Наблюдатель» видит доску, но не переносит карточки')
      )
    ),
    h('div', { class: 'filter-chips' },
      h('button', { class: 'chip ' + (!query.mine && !query.sector ? 'active' : ''), onclick: () => go('/kanban', {}) }, 'Все записи'),
      h('button', { class: 'chip ' + (query.mine === '1' ? 'active' : ''), onclick: () => go('/kanban', Object.assign({}, query, { mine: query.mine === '1' ? undefined : '1' })) }, 'Мои проекты'),
      SECTORS.map((sector) =>
        h('button', { class: 'chip ' + (query.sector === sector.code ? 'active' : ''), onclick: () => go('/kanban', Object.assign({}, query, { sector: query.sector === sector.code ? undefined : sector.code })) }, sector.name))
    ),
    ui.user.role === 'team'
      ? h('div', { class: 'callout' }, 'Замок на карточке означает, что запись закреплена за другим сотрудником: её статус вы изменить не можете.')
      : null,
    board
  );
}

function calendarEvents() {
  const events = [];
  state.steps.forEach((step) => {
    const project = projectById(step.project_id);
    if (!project) return;
    const overdue = step.state !== 'done' && daysUntil(step.due_date) < 0;
    events.push({
      date: step.due_date, kind: 'step',
      title: step.title,
      color: step.state === 'done' ? '#2e7d4f' : overdue ? '#a33a3a' : '#1f4e9e',
      href: '#/projects/' + project.id,
      meta: project.code + ' — срок этапа',
    });
  });
  state.visits.forEach((visit) => {
    let cursor = new Date(visit.date_from + 'T00:00:00');
    const end = new Date(visit.date_to + 'T00:00:00');
    while (cursor <= end) {
      events.push({
        date: cursor.toISOString().slice(0, 10), kind: 'visit',
        title: countryName(visit.iso2) + ', ' + visit.cities,
        color: '#6f45c9', href: '#/visits/' + visit.id,
        meta: visit.code + ' — ' + DIRECTION_LABELS[visit.direction],
      });
      cursor = new Date(cursor.getTime() + DAY);
    }
  });
  state.meetings.forEach((meeting) => {
    events.push({
      date: meeting.meet_date, kind: 'meeting',
      title: (meeting.meet_time ? meeting.meet_time + ' ' : '') + meeting.company_name,
      color: dictColor(MEETING_STATUSES, meeting.status_code),
      href: '#/visits/' + meeting.visit_id,
      meta: 'встреча · ' + dictName(MEETING_STATUSES, meeting.status_code),
    });
  });
  return events;
}

function renderCalendar(query) {
  const today = new Date();
  const month = query.month !== undefined ? Number(query.month) : today.getMonth();
  const year = query.year !== undefined ? Number(query.year) : today.getFullYear();
  const kinds = query.kind ? query.kind.split(',') : ['step', 'visit', 'meeting'];

  const events = calendarEvents().filter((event) => kinds.indexOf(event.kind) !== -1);
  const first = new Date(year, month, 1);
  const startOffset = (first.getDay() + 6) % 7;
  const gridStart = new Date(year, month, 1 - startOffset);
  const todayKey = new Date().toISOString().slice(0, 10);

  const cells = [];
  for (let i = 0; i < 42; i++) {
    const date = new Date(gridStart.getTime() + i * DAY);
    const key = date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
    const dayEvents = events.filter((event) => event.date === key);
    cells.push(h('div', { class: 'cal-cell ' + (date.getMonth() !== month ? 'other' : '') + (key === todayKey ? ' today' : '') },
      h('div', { class: 'cal-daynum' }, String(date.getDate())),
      dayEvents.slice(0, 4).map((event) =>
        h('a', { class: 'cal-event', href: event.href, style: { background: event.color }, title: event.title + ' — ' + event.meta }, event.title)),
      dayEvents.length > 4 ? h('div', { class: 'small muted' }, 'ещё ' + (dayEvents.length - 4)) : null
    ));
  }

  const shift = (delta) => {
    const date = new Date(year, month + delta, 1);
    go('/calendar', Object.assign({}, query, { month: date.getMonth(), year: date.getFullYear() }));
  };

  const toggleKind = (kind) => {
    const next = kinds.indexOf(kind) !== -1 ? kinds.filter((k) => k !== kind) : kinds.concat([kind]);
    go('/calendar', Object.assign({}, query, { kind: next.length ? next.join(',') : 'none' }));
  };

  const monthEvents = events.filter((event) => {
    const date = new Date(event.date + 'T00:00:00');
    return date.getMonth() === month && date.getFullYear() === year;
  }).sort((a, b) => (a.date < b.date ? -1 : 1));

  return frag(
    h('div', { class: 'page-head' },
      h('div', { class: 'titles' },
        h('h1', {}, 'Календарь'),
        h('div', { class: 'subtitle' }, 'Сроки дорожных карт, визиты делегаций и встречи в одном представлении')
      ),
      h('div', { class: 'page-actions' },
        h('button', { class: 'btn', onclick: () => shift(-1) }, '← ' + MONTHS_NOM[(month + 11) % 12]),
        h('button', { class: 'btn', onclick: () => go('/calendar', { kind: query.kind }) }, 'Сегодня'),
        h('button', { class: 'btn', onclick: () => shift(1) }, MONTHS_NOM[(month + 1) % 12] + ' →'),
        exportButton('События месяца в CSV', 'calendar.csv',
          ['Дата', 'Тип', 'Событие', 'Пояснение'],
          () => monthEvents.map((event) => [event.date, { step: 'Срок этапа', visit: 'Визит', meeting: 'Встреча' }[event.kind], event.title, event.meta]),
          'календарь событий')
      )
    ),
    h('h2', { class: 'mb-1' }, MONTHS_NOM[month] + ' ' + year),
    h('div', { class: 'cal-legend' },
      [{ kind: 'step', label: 'Сроки этапов', color: '#1f4e9e' },
       { kind: 'visit', label: 'Визиты', color: '#6f45c9' },
       { kind: 'meeting', label: 'Встречи', color: '#2e7d4f' }].map((item) =>
        h('button', { class: 'chip ' + (kinds.indexOf(item.kind) !== -1 ? 'active' : ''), onclick: () => toggleKind(item.kind) },
          h('span', { class: 'sw', style: { background: item.color } }), item.label))
    ),
    h('div', { class: 'cal-grid' },
      WEEKDAYS_SHORT.map((day) => h('div', { class: 'cal-dow' }, day)),
      cells
    ),
    h('div', { class: 'card mt-2' },
      h('div', { class: 'card-head' }, h('h2', {}, 'События месяца'), h('span', { class: 'muted small' }, 'всего: ' + monthEvents.length)),
      h('div', { class: 'card-body' },
        monthEvents.length
          ? monthEvents.slice(0, 12).map((event) =>
              h('a', { class: 'attention-item', href: event.href, style: { color: 'inherit', textDecoration: 'none' } },
                h('span', { class: 'marker', style: { background: event.color } }),
                h('span', { style: { minWidth: '0' } },
                  h('div', { class: 'a-title' }, event.title),
                  h('div', { class: 'a-meta' }, event.meta)
                ),
                h('span', { class: 'a-right' }, formatDateShort(event.date))
              )
            )
          : h('p', { class: 'muted mb-0' }, 'В этом месяце событий нет.')
      )
    )
  );
}

/** Складывает запись со всеми связанными данными в корзину. */
function trashPut(kind, label, payload) {
  state.trash.unshift({
    id: ++state.seq.trash, kind: kind, label: label, payload: payload,
    deleted_at: nowStamp(), deleted_by: ui.user.id,
  });
}

function trashProject(project) {
  const id = project.id;
  const payload = {
    project: project,
    steps: state.steps.filter((s) => String(s.project_id) === String(id)),
    comments: state.comments.filter((c) => c.entity_type === 'project' && String(c.entity_id) === String(id)),
    contacts: state.contacts.filter((c) => c.entity_type === 'project' && String(c.entity_id) === String(id)),
    history: state.statusHistory.filter((s) => String(s.project_id) === String(id)),
    votes: state.votes.filter((v) => v.entity_type === 'project' && String(v.entity_id) === String(id)),
  };
  state.projects = state.projects.filter((p) => String(p.id) !== String(id));
  state.steps = state.steps.filter((s) => String(s.project_id) !== String(id));
  state.comments = state.comments.filter((c) => !(c.entity_type === 'project' && String(c.entity_id) === String(id)));
  state.contacts = state.contacts.filter((c) => !(c.entity_type === 'project' && String(c.entity_id) === String(id)));
  state.statusHistory = state.statusHistory.filter((s) => String(s.project_id) !== String(id));
  state.votes = state.votes.filter((v) => !(v.entity_type === 'project' && String(v.entity_id) === String(id)));
  state.meetings.forEach((m) => { if (String(m.project_id) === String(id)) m.project_id = null; });
  trashPut('project', project.code + ' — ' + project.title, payload);
}

function trashCompany(company) {
  const id = company.id;
  const payload = {
    company: company,
    contacts: state.contacts.filter((c) => c.entity_type === 'company' && String(c.entity_id) === String(id)),
  };
  state.companies = state.companies.filter((c) => String(c.id) !== String(id));
  state.contacts = state.contacts.filter((c) => !(c.entity_type === 'company' && String(c.entity_id) === String(id)));
  state.meetings.forEach((m) => { if (String(m.company_id) === String(id)) m.company_id = null; });
  trashPut('company', company.name, payload);
}

function trashVisit(visit) {
  const id = visit.id;
  const payload = {
    visit: visit,
    meetings: state.meetings.filter((m) => String(m.visit_id) === String(id)),
    members: state.members.filter((m) => String(m.visit_id) === String(id)),
  };
  state.visits = state.visits.filter((v) => String(v.id) !== String(id));
  state.meetings = state.meetings.filter((m) => String(m.visit_id) !== String(id));
  state.members = state.members.filter((m) => String(m.visit_id) !== String(id));
  trashPut('visit', visit.code + ' — ' + countryName(visit.iso2) + ', ' + visit.cities, payload);
}

function trashRestore(entry) {
  const p = entry.payload;
  if (entry.kind === 'project') {
    state.projects.push(p.project);
    state.steps = state.steps.concat(p.steps || []);
    state.comments = state.comments.concat(p.comments || []);
    state.contacts = state.contacts.concat(p.contacts || []);
    state.statusHistory = state.statusHistory.concat(p.history || []);
    state.votes = state.votes.concat(p.votes || []);
  } else if (entry.kind === 'company') {
    state.companies.push(p.company);
    state.contacts = state.contacts.concat(p.contacts || []);
  } else if (entry.kind === 'visit') {
    state.visits.push(p.visit);
    state.meetings = state.meetings.concat(p.meetings || []);
    state.members = state.members.concat(p.members || []);
  }
  state.trash = state.trash.filter((t) => t.id !== entry.id);
}

const TRASH_KINDS = { project: 'Проект', company: 'Компания', visit: 'Визит' };

      )
    ),
    h('div', { class: 'callout info' },
      'Удаление из системы двухшаговое: запись сначала попадает сюда вместе со всеми связанными данными — ',
      'этапами, комментариями, встречами — и возвращается в исходном виде.'),
    h('div', { class: 'card' },

                    h('td', { class: 'nowrap' },

                          confirmLabel: 'Удалить навсегда', danger: true,
                        });
                        if (!ok) return;
                        state.trash = state.trash.filter((t) => t.id !== entry.id);
                        audit('delete', entry.kind, null, 'Окончательно удалена запись: ' + entry.label, []);
                        await persist('Запись удалена окончательно.');
                      } }, 'Удалить навсегда')
                    )
                  );
                }))
              )
            )
          )
        : h('div', { class: 'card-body' }, empty('Корзина пуста', 'Удалённые записи будут появляться здесь.', '🗑'))
    )
  );
}

function renderUsers() {
  if (!can(ui.user, 'admin.users')) return denied('Пользователи');

      body: frag(
        field('Ф. И. О.', controls.name, { required: true }),
        h('div', { class: 'form-row' }, field('Должность', controls.position), field('Электронная почта', controls.email)),
        h('div', { class: 'form-row' },
          field('Роль', controls.role, { required: true, help: 'Менеджер ведёт свои записи, наблюдатель только смотрит.' }),
          field('Регион ответственности', controls.region)),
        h('p', { class: 'small muted mb-0' }, 'Код доступа сотрудник задаёт сам при первом входе.')
      ),
      read: () => ({
        full_name: controls.name.value.trim(), position: controls.position.value.trim(),
        email: controls.email.value.trim(), role: controls.role.value, region: controls.region.value,
      }),
    };
  };

  const openCreate = () => {
    const form = userForm(null);
    openModal({
      title: 'Новый сотрудник',
      body: form.body,
      footer: (close) => [
        h('button', { class: 'btn', onclick: close }, 'Отмена'),
        h('button', { class: 'btn btn-primary', onclick: async () => {
          const values = form.read();
          if (!values.full_name) { toastError('Укажите фамилию, имя и отчество.'); return; }
          const id = ++state.seq.user;
          state.users.push(Object.assign({ id: id, pinHash: null, pinSalt: null, active: true, created_at: nowStamp() }, values));
          audit('create', 'user', id, 'Добавлен сотрудник ' + values.full_name + ' (' + ROLE_LABELS[values.role] + ')', []);
          close();
          await persist('Сотрудник добавлен. Код доступа он задаст при первом входе.');
        } }, 'Добавить'),
      ],
    });
  };

  const openEdit = (user) => {
    const form = userForm(user);
    const before = Object.assign({}, user);
    openModal({
      title: 'Изменение учётной записи',
      body: form.body,
      footer: (close) => [
        h('button', { class: 'btn', onclick: close }, 'Отмена'),
        h('button', { class: 'btn btn-primary', onclick: async () => {
          const values = form.read();
          if (!values.full_name) { toastError('Укажите фамилию, имя и отчество.'); return; }
          if (before.role === 'admin' && values.role !== 'admin'
              && state.users.filter((u) => u.role === 'admin' && u.active !== false).length < 2) {
            toastError('Это единственный администратор — сначала назначьте другого.');
            return;
          }
          const labels = { full_name: 'Ф. И. О.', position: 'Должность', email: 'Почта', role: 'Роль', region: 'Регион' };
          const changes = [];
          Object.keys(values).forEach((key) => {
            if (String(before[key] || '') !== String(values[key] || '')) {
              changes.push({
                label: labels[key],
                from: key === 'role' ? ROLE_LABELS[before[key]] : key === 'region' ? (before[key] ? regionName(before[key]) : '(нет)') : (before[key] || '(пусто)'),
                to: key === 'role' ? ROLE_LABELS[values[key]] : key === 'region' ? (values[key] ? regionName(values[key]) : '(нет)') : (values[key] || '(пусто)'),
              });
            }
          });
          if (!changes.length) { toastError('Изменений нет.'); return; }
          Object.assign(user, values);
          audit('update', 'user', user.id, 'Изменена учётная запись ' + user.full_name, changes);
          close();
          await persist('Учётная запись обновлена.');
        } }, 'Сохранить'),
      ],
    });
  };

  return frag(
    h('div', { class: 'page-head' },
      h('div', { class: 'titles' },
        h('h1', {}, 'Пользователи'),
        h('div', { class: 'subtitle' }, 'Сотрудников заводит администратор; код доступа каждый задаёт себе сам при первом входе')
      ),
      h('div', { class: 'page-actions' },
        exportButton('Выгрузить в CSV', 'users.csv',
          ['Ф. И. О.', 'Должность', 'Роль', 'Регион', 'Почта', 'Код задан', 'Состояние'],
          () => state.users.map((u) => [u.full_name, u.position || '', ROLE_LABELS[u.role],
            u.region ? regionName(u.region) : '', u.email || '', u.pinHash ? 'да' : 'нет',
            u.active === false ? 'отключён' : 'активен']),
          'список сотрудников'),
        h('button', { class: 'btn btn-primary', onclick: openCreate }, '+ Новый сотрудник')
      )
    ),
    h('div', { class: 'card' },
      h('div', { class: 'card-body tight' },
        h('div', { class: 'table-wrap' },
          h('table', { class: 'data' },
            h('thead', {}, h('tr', {},
              h('th', {}, 'Сотрудник'), h('th', {}, 'Роль'), h('th', {}, 'Регион'),
              h('th', {}, 'Код доступа'), h('th', {}, 'Состояние'), h('th', { class: 'num' }, 'Записей'), h('th', {}, '')
            )),
            h('tbody', {}, state.users.map((user) => {
              const own = state.projects.filter((p) => String(p.responsible_user_id) === String(user.id)).length;
              const isSelf = String(user.id) === String(ui.user.id);
              return h('tr', {},
                h('td', {},
                  h('span', { class: 't-main' }, user.full_name),
                  h('div', { class: 't-sub' }, user.position || '—'),
                  user.email ? h('div', { class: 't-sub' }, user.email) : null
                ),
                h('td', {}, ROLE_LABELS[user.role]),
                h('td', {}, user.region ? regionName(user.region) : '—'),
                h('td', {}, user.pinHash
                  ? h('span', { class: 'tag tag-ok' }, 'задан')
                  : h('span', { class: 'tag tag-warn' }, 'не задан')),
                h('td', {}, user.active === false
                  ? h('span', { class: 'tag tag-danger' }, 'отключён')
                  : h('span', { class: 'tag tag-ok' }, 'активен')),
                h('td', { class: 'num' }, String(own)),
                h('td', { class: 'nowrap' },
                  h('button', { class: 'btn btn-sm', onclick: () => openEdit(user) }, 'Изменить'),
                  ' ',
                  h('button', { class: 'btn btn-sm', onclick: async () => {
                    const ok = await confirmDialog({
                      title: 'Сбросить код доступа',
                      message: 'Код доступа сотрудника «' + user.full_name + '» будет сброшен. Новый он задаст при следующем входе. Продолжить?',
                      confirmLabel: 'Сбросить',
                    });
                    if (!ok) return;
                    user.pinHash = null;
                    user.pinSalt = null;
                    audit('update', 'user', user.id, 'Сброшен код доступа сотрудника ' + user.full_name, []);
                    await persist('Код доступа сброшен.');
                  } }, 'Сбросить код'),
                  ' ',
                  isSelf ? null : h('button', { class: 'btn btn-sm', onclick: async () => {
                    if (user.active !== false && user.role === 'admin'
                        && state.users.filter((u) => u.role === 'admin' && u.active !== false).length < 2) {
                      toastError('Это единственный администратор — отключать его нельзя.');
                      return;
                    }
                    user.active = user.active === false;
                    audit('update', 'user', user.id, (user.active ? 'Включён' : 'Отключён') + ' сотрудник ' + user.full_name, []);
                    await persist(user.active ? 'Сотрудник включён.' : 'Сотрудник отключён.');
                  } }, user.active === false ? 'Включить' : 'Отключить')
                )
              );
            }))
          )
        )
      )
    )
  );
}

const DICT_KINDS = [
  { key: 'sectors',         title: 'Отрасли',          color: true },
  { key: 'recordTypes',     title: 'Типы записей',     color: false },
  { key: 'projectStatuses', title: 'Статусы проектов', color: true },
  { key: 'visitStatuses',   title: 'Статусы визитов',  color: true },
  { key: 'meetingStatuses', title: 'Статусы встреч',   color: true },
];

const slugify = (text) => text.toLowerCase().replace(/[^a-zа-я0-9]+/gi, '_').replace(/^_|_$/g, '').slice(0, 24) || ('code_' + Date.now().toString(36));

function renderDictionaries(query) {
  if (!can(ui.user, 'admin.dictionaries')) return denied('Справочники');
  const tab = query.tab || 'sectors';

  const tabs = h('div', { class: 'tabs' },
    DICT_KINDS.map((kind) =>
      h('button', { class: tab === kind.key ? 'active' : '', onclick: () => go('/dictionaries', { tab: kind.key }) }, kind.title)),
    h('button', { class: tab === 'countries' ? 'active' : '', onclick: () => go('/dictionaries', { tab: 'countries' }) }, 'Страны'),
    h('button', { class: tab === 'rates' ? 'active' : '', onclick: () => go('/dictionaries', { tab: 'rates' }) }, 'Валюты и курсы')
  );

  const body = tab === 'countries' ? countriesTab()
    : tab === 'rates' ? ratesTab()
    : listTab(DICT_KINDS.find((k) => k.key === tab) || DICT_KINDS[0]);

  return frag(
    h('div', { class: 'page-head' },
      h('div', { class: 'titles' },
        h('h1', {}, 'Справочники'),
        h('div', { class: 'subtitle' }, 'Значения выпадающих списков. Отключённое значение не предлагается в новых записях, но остаётся в старых.')
      )
    ),
    tabs,
    body
  );
}

function listTab(kind) {
  const list = state.dict[kind.key];

  const openEntry = (entry) => {
    const nameInput = h('input', { type: 'text', value: entry ? entry.name : '' });
    const colorInput = h('input', { type: 'color', value: entry ? (entry.color || '#1f4e9e') : '#1f4e9e' });
    openModal({
      title: entry ? 'Изменение значения' : 'Новое значение',
      size: 'narrow',
      body: frag(
        field('Название', nameInput, { required: true }),
        kind.color ? field('Цвет отметки', colorInput, { help: 'Используется в таблицах, на доске и в диаграммах.' }) : null,
        entry ? h('p', { class: 'small muted mb-0' }, 'Код значения: ' + entry.code + ' — он не меняется, чтобы не разорвать связь с записями.') : null
      ),
      footer: (close) => [
        h('button', { class: 'btn', onclick: close }, 'Отмена'),
        h('button', { class: 'btn btn-primary', onclick: async () => {
          const name = nameInput.value.trim();
          if (!name) { toastError('Укажите название.'); return; }
          if (entry) {
            const before = entry.name;
            entry.name = name;
            if (kind.color) entry.color = colorInput.value;
            audit('update', 'dictionary', null, 'Изменён справочник «' + kind.title + '»',
              before === name ? [] : [{ label: 'Название', from: before, to: name }]);
          } else {
            let code = slugify(name);
            while (list.some((i) => i.code === code)) code += '_1';
            const item = { code: code, name: name, active: true };
            if (kind.color) item.color = colorInput.value;
            list.push(item);
            audit('create', 'dictionary', null, 'Добавлено значение «' + name + '» в справочник «' + kind.title + '»', []);
          }
          close();
          await persist('Справочник обновлён.');
        } }, 'Сохранить'),
      ],
    });
  };

  const usageCount = (code) => {
    if (kind.key === 'sectors') return state.projects.filter((p) => p.sector_code === code).length;
    if (kind.key === 'recordTypes') return state.projects.filter((p) => p.record_type === code).length;
    if (kind.key === 'projectStatuses') return state.projects.filter((p) => p.status_code === code).length;
    if (kind.key === 'visitStatuses') return state.visits.filter((v) => v.status_code === code).length;
    if (kind.key === 'meetingStatuses') return state.meetings.filter((m) => m.status_code === code).length;
    return 0;
  };

  const move = async (index, delta) => {
    const target = index + delta;
    if (target < 0 || target >= list.length) return;
    const tmp = list[index];
    list[index] = list[target];
    list[target] = tmp;
    await persist('Порядок изменён.');
  };

  return h('div', { class: 'card' },
    h('div', { class: 'card-head' },
      h('h2', {}, kind.title),
      h('button', { class: 'btn btn-sm btn-primary', onclick: () => openEntry(null) }, '+ Добавить')
    ),
    h('div', { class: 'card-body tight' },
      h('div', { class: 'table-wrap' },
        h('table', { class: 'data' },
          h('thead', {}, h('tr', {},
            h('th', {}, 'Название'), h('th', {}, 'Код'), h('th', { class: 'num' }, 'Записей'),
            h('th', {}, 'Состояние'), h('th', {}, 'Порядок'), h('th', {}, '')
          )),
          h('tbody', {}, list.map((entry, index) =>
            h('tr', {},
              h('td', {}, kind.color
                ? statusTag(entry.name, entry.color)
                : h('span', { class: 't-main' }, entry.name)),
              h('td', { class: 'code' }, entry.code),
              h('td', { class: 'num' }, String(usageCount(entry.code))),
              h('td', {}, entry.active === false
                ? h('span', { class: 'tag tag-danger' }, 'отключено')
                : h('span', { class: 'tag tag-ok' }, 'активно')),
              h('td', { class: 'nowrap' },
                h('button', { class: 'btn btn-sm btn-ghost', title: 'Выше', onclick: () => move(index, -1) }, '↑'),
                h('button', { class: 'btn btn-sm btn-ghost', title: 'Ниже', onclick: () => move(index, 1) }, '↓')
              ),
              h('td', { class: 'nowrap' },
                h('button', { class: 'btn btn-sm', onclick: () => openEntry(entry) }, 'Изменить'),
                ' ',
                h('button', { class: 'btn btn-sm', onclick: async () => {
                  if (entry.active !== false && usageCount(entry.code) === 0 && list.filter((i) => i.active !== false).length < 2) {
                    toastError('В справочнике должно остаться хотя бы одно активное значение.');
                    return;
                  }
                  entry.active = entry.active === false;
                  audit('update', 'dictionary', null,
                    (entry.active ? 'Включено' : 'Отключено') + ' значение «' + entry.name + '» в справочнике «' + kind.title + '»', []);
                  await persist('Справочник обновлён.');
                } }, entry.active === false ? 'Включить' : 'Отключить')
              )
            )
          ))
        )
      )
    )
  );
}

function countriesTab() {

const FIELD_FORMS = { project: 'Проект или соглашение', company: 'Компания', visit: 'Визит' };
const FIELD_TYPES = {
  text: 'Строка', textarea: 'Многострочный текст', number: 'Число',
  date: 'Дата', select: 'Выбор из списка', poll: 'Голосование сотрудников',
};

const fieldsFor = (form) => state.customFields
  .filter((f) => f.form === form && f.active !== false)
  .sort((a, b) => a.position - b.position);

/** Кто может заполнять поле: администратор всегда, менеджер — если разрешено. */
const canFillField = (fieldDef) => ui.user.role === 'admin' || (ui.user.role === 'team' && fieldDef.teamCanFill !== false);

/** Строит элементы управления произвольными полями для формы записи. */
function customFieldControls(form, values) {
  const defs = fieldsFor(form).filter((f) => f.type !== 'poll' && canFillField(f));
  if (!defs.length) return { body: null, read: () => (values ? Object.assign({}, values) : {}) };
  const controls = {};
  const body = frag(
    h('div', { class: 'form-section-title' }, 'Дополнительные сведения'),
    defs.map((definition) => {
      const current = values && values[definition.key] !== undefined ? values[definition.key] : '';
      if (definition.type === 'select') {
        controls[definition.key] = select((definition.options || []).map((o) => ({ value: o, label: o })),
          { value: current, placeholder: 'Не выбрано' });
      } else if (definition.type === 'textarea') {
        controls[definition.key] = h('textarea', { rows: 3 }, String(current || ''));
      } else {
        controls[definition.key] = h('input', {
          type: definition.type === 'number' ? 'number' : definition.type === 'date' ? 'date' : 'text',
          value: current === null || current === undefined ? '' : String(current),
        });
      }
      return field(definition.label, controls[definition.key], { required: definition.required, help: definition.help || '' });
    })
  );
  return {
    body: body,
    read: () => {
      const result = values ? Object.assign({}, values) : {};
      defs.forEach((definition) => {
        const raw = controls[definition.key].value;
        result[definition.key] = definition.type === 'number' ? (raw === '' ? '' : Number(raw)) : raw;
      });
      return result;
    },
  };
}

/** Проверяет обязательные произвольные поля. */
function customFieldsMissing(form, values) {
  return fieldsFor(form)
    .filter((f) => f.type !== 'poll' && f.required && canFillField(f))
    .filter((f) => values[f.key] === '' || values[f.key] === undefined || values[f.key] === null)
    .map((f) => f.label);
}


/** Сравнивает произвольные поля до и после правки — для журнала аудита. */
function diffCustom(form, before, after) {
  const changes = [];
  const show = (value) => (value === '' || value === undefined || value === null) ? '(пусто)' : String(value);
  fieldsFor(form).filter((f) => f.type !== 'poll').forEach((definition) => {
    const from = before[definition.key];
    const to = after[definition.key];
    if (show(from) !== show(to)) changes.push({ label: definition.label, from: show(from), to: show(to) });
  });
  return changes;
}

const votesFor = (fieldKey, entityType, entityId) => state.votes.filter((v) =>
  v.field_key === fieldKey && v.entity_type === entityType && String(v.entity_id) === String(entityId));

/** Карточка с произвольными полями и голосованиями на странице записи. */
function customFieldsCard(form, entity) {
  const defs = fieldsFor(form);
  if (!defs.length) return null;
  const values = entity.customValues || {};
  const plain = defs.filter((f) => f.type !== 'poll');
  const polls = defs.filter((f) => f.type === 'poll');

  return h('div', { class: 'card' },
    h('div', { class: 'card-head' }, h('h2', {}, 'Дополнительные сведения')),
    h('div', { class: 'card-body' },
      plain.length
        ? h('dl', { class: 'def-list' }, plain.map((definition) => {
            const value = values[definition.key];
            const shown = value === '' || value === undefined || value === null ? '—'
              : definition.type === 'date' ? formatDate(value)
              : definition.type === 'number' ? formatNumber(value)
              : String(value);
            return defItem(definition.label, shown);
          }))
        : null,
      polls.map((definition) => {
        const votes = votesFor(definition.key, form, entity.id);
        const mine = votes.find((v) => String(v.user_id) === String(ui.user.id));
        const mayVote = canWrite() && canFillField(definition);
        return frag(
          h('div', { class: 'form-section-title' }, definition.label),
          definition.help ? h('p', { class: 'small muted' }, definition.help) : null,
          h('div', { class: 'bar-list' },
            (definition.options || []).map((option, index) => {
              const count = votes.filter((v) => v.option === option).length;
              const share = votes.length ? Math.round((count / votes.length) * 100) : 0;
              return h('div', { class: 'bar-row' },
                h('span', { class: 'nowrap' }, option),
                h('div', { class: 'bar-track' },
                  h('div', { class: 'bar-fill', style: { width: Math.max(2, share) + '%', background: PALETTE[index % PALETTE.length] } })),
                h('span', { class: 'bar-value' }, count + ' · ' + share + '%')
              );
            })
          ),
          h('div', { class: 'flex flex-wrap mt-1' },
            mayVote
              ? (definition.options || []).map((option) =>
                  h('button', {
                    class: 'chip ' + (mine && mine.option === option ? 'active' : ''),
                    onclick: async () => {
                      if (mine && mine.option === option) {
                        state.votes = state.votes.filter((v) => v !== mine);
                        audit('update', form, entity.id, 'Отозван голос в голосовании «' + definition.label + '»', []);
                        await persist('Голос отозван.');
                        return;
                      }
                      if (mine) mine.option = option;
                      else state.votes.push({
                        field_key: definition.key, entity_type: form, entity_id: entity.id,
                        user_id: ui.user.id, option: option, created_at: nowStamp(),
                      });
                      audit('update', form, entity.id, 'Голос в голосовании «' + definition.label + '»: ' + option, []);
                      await persist('Голос учтён.');
                    },
                  }, option))
              : h('span', { class: 'small muted' }, 'Голосование доступно сотрудникам офиса.'),
            votes.length ? h('span', { class: 'small muted' }, 'проголосовало: ' + votes.length) : null
          )
        );
      })
    )
  );
}

function renderFields(query) {
  if (!can(ui.user, 'admin.custom_fields')) return denied('Конструктор форм');
  const form = query.form || 'project';

  const openField = (definition) => {
    const values = definition || { form: form, label: '', type: 'text', required: false, help: '', options: [], teamCanFill: true };
    const labelInput = h('input', { type: 'text', value: values.label });
    const formSelect = select(Object.keys(FIELD_FORMS).map((k) => ({ value: k, label: FIELD_FORMS[k] })), { value: values.form });
    const typeSelect = select(Object.keys(FIELD_TYPES).map((k) => ({ value: k, label: FIELD_TYPES[k] })), { value: values.type });
    const helpInput = h('input', { type: 'text', value: values.help || '' });
    const optionsInput = h('textarea', { rows: 3, placeholder: 'По одному варианту в строке' }, (values.options || []).join('\n'));
    const requiredInput = h('input', { type: 'checkbox', checked: values.required });
    const teamInput = h('input', { type: 'checkbox', checked: values.teamCanFill !== false });
    const optionsField = field('Варианты', optionsInput, { help: 'Каждый вариант с новой строки.' });

    const syncOptions = () => {
      const needs = typeSelect.value === 'select' || typeSelect.value === 'poll';
      optionsField.classList.toggle('hidden', !needs);
    };
    typeSelect.addEventListener('change', syncOptions);
    syncOptions();

    openModal({
      title: definition ? 'Изменение поля' : 'Новое поле',
      body: frag(
        field('Название поля', labelInput, { required: true }),
        h('div', { class: 'form-row' },
          field('В какой форме', formSelect, { required: true }),
          field('Тип поля', typeSelect, { required: true })),
        optionsField,
        field('Пояснение для сотрудника', helpInput),
        h('label', { class: 'checkbox' }, requiredInput, h('span', {}, 'Обязательное поле')),
        h('label', { class: 'checkbox' }, teamInput, h('span', {}, 'Проектные менеджеры могут заполнять')),
        definition ? h('p', { class: 'small muted mb-0' }, 'Ключ поля: ' + definition.key) : null
      ),
      footer: (close) => [
        h('button', { class: 'btn', onclick: close }, 'Отмена'),
        h('button', { class: 'btn btn-primary', onclick: async () => {
          const label = labelInput.value.trim();
          if (!label) { toastError('Укажите название поля.'); return; }
          const type = typeSelect.value;
          const options = optionsInput.value.split('\n').map((s) => s.trim()).filter(Boolean);
          if ((type === 'select' || type === 'poll') && options.length < 2) {
            toastError('Для выбора и голосования нужно не меньше двух вариантов.');
            return;
          }
          if (definition) {
            definition.label = label;
            definition.form = formSelect.value;
            definition.type = type;
            definition.help = helpInput.value.trim();
            definition.options = options;
            definition.required = requiredInput.checked;
            definition.teamCanFill = teamInput.checked;
            audit('update', 'custom_field', definition.id, 'Изменено произвольное поле «' + label + '»', []);
          } else {
            let key = slugify(label);
            while (state.customFields.some((f) => f.key === key)) key += '_1';
            state.customFields.push({
              id: ++state.seq.field, form: formSelect.value, key: key, label: label, type: type,
              help: helpInput.value.trim(), options: options, required: requiredInput.checked,
              teamCanFill: teamInput.checked, active: true,
              position: state.customFields.filter((f) => f.form === formSelect.value).length + 1,
            });
            audit('create', 'custom_field', null, 'Добавлено произвольное поле «' + label + '»', []);
          }
          close();
          await persist('Поле сохранено.');
        } }, 'Сохранить'),
      ],
    });
  };

  const rows = state.customFields.filter((f) => f.form === form).sort((a, b) => a.position - b.position);

  return frag(
    h('div', { class: 'page-head' },
      h('div', { class: 'titles' },
        h('h1', {}, 'Конструктор форм'),
        h('div', { class: 'subtitle' }, 'Дополнительные поля появляются в формах и карточках записей, а также в выгрузках')
      ),
      h('div', { class: 'page-actions' },
        h('button', { class: 'btn btn-primary', onclick: () => openField(null) }, '+ Новое поле')
      )
    ),
    h('div', { class: 'tabs' },
      Object.keys(FIELD_FORMS).map((key) =>
        h('button', { class: form === key ? 'active' : '', onclick: () => go('/fields', { form: key }) }, FIELD_FORMS[key]))
    ),
    h('div', { class: 'callout info' },
      'Голосование — особый тип поля: сотрудники офиса отмечают свой вариант в карточке записи, ',
      'а портал показывает распределение голосов. Так собирают, например, оценку приоритетности проекта.'),
    h('div', { class: 'card' },
      rows.length
        ? h('div', { class: 'card-body tight' },
            h('div', { class: 'table-wrap' },
              h('table', { class: 'data' },
                h('thead', {}, h('tr', {},
                  h('th', {}, 'Поле'), h('th', {}, 'Тип'), h('th', {}, 'Ключ'),
                  h('th', {}, 'Обязательное'), h('th', {}, 'Менеджеры'), h('th', {}, 'Состояние'), h('th', {}, '')
                )),
                h('tbody', {}, rows.map((definition) =>
                  h('tr', {},
                    h('td', {},
                      h('span', { class: 't-main' }, definition.label),
                      definition.help ? h('div', { class: 't-sub' }, definition.help) : null,
                      (definition.options || []).length ? h('div', { class: 't-sub' }, definition.options.join(' · ')) : null
                    ),
                    h('td', {}, FIELD_TYPES[definition.type]),
                    h('td', { class: 'code' }, definition.key),
                    h('td', {}, definition.required ? 'да' : 'нет'),
                    h('td', {}, definition.teamCanFill !== false ? 'заполняют' : 'только админ'),
                    h('td', {}, definition.active === false
                      ? h('span', { class: 'tag tag-danger' }, 'отключено')
                      : h('span', { class: 'tag tag-ok' }, 'активно')),
                    h('td', { class: 'nowrap' },
                      h('button', { class: 'btn btn-sm', onclick: () => openField(definition) }, 'Изменить'),
                      ' ',
                      h('button', { class: 'btn btn-sm', onclick: async () => {
                        definition.active = definition.active === false;
                        audit('update', 'custom_field', definition.id,
                          (definition.active ? 'Включено' : 'Отключено') + ' поле «' + definition.label + '»', []);
                        await persist('Поле обновлено.');
                      } }, definition.active === false ? 'Включить' : 'Отключить')
                    )
                  )
                ))
              )
            )
          )
        : h('div', { class: 'card-body' }, empty('Полей пока нет', 'Добавьте поле, если стандартных сведений не хватает.', '⊞'))
    )
  );
}


// ==========================================================================
//  25. Маршрутизация и запуск
// ==========================================================================

function parseHash() {
  let raw = '/dashboard';
  try { raw = location.hash.replace(/^#/, '') || '/dashboard'; } catch (error) { /* нет доступа */ }
  const parts = raw.split('?');
  const query = {};
  if (parts[1]) {
    parts[1].split('&').forEach((pair) => {
      if (!pair) return;
      const kv = pair.split('=');
      query[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
    });
  }
  return { path: parts[0] || '/dashboard', query: query };
}

function nav(hash) {
  try { location.hash = hash; } catch (error) { /* нет доступа */ }
}

function go(path, query) {
  const pairs = [];
  Object.keys(query || {}).forEach((key) => {
    const value = query[key];
    if (value === undefined || value === null || value === '') return;
    pairs.push(encodeURIComponent(key) + '=' + encodeURIComponent(value));
  });
  nav('#' + path + (pairs.length ? '?' + pairs.join('&') : ''));
}

function routeView(route) {
  const segments = route.path.split('/').filter(Boolean);
  const section = segments[0] || 'dashboard';
  const id = segments[1];

  if (section === 'dashboard') return renderDashboard(route.query);
  if (section === 'projects') return id ? renderProject(id) : renderProjects(route.query);
  if (section === 'companies') return id ? renderCompany(id) : renderCompanies(route.query);
  if (section === 'visits') return id ? renderVisit(id) : renderVisits(route.query);
  if (section === 'kanban') return renderKanban(route.query);
  if (section === 'calendar') return renderCalendar(route.query);
  if (section === 'reports') return renderReports(route.query);
  if (section === 'profile') return renderProfile();
  if (section === 'corrections') {
    if (!can(ui.user, 'correction.request') && !can(ui.user, 'correction.decide')) {
      return frag(
        h('div', { class: 'page-head' }, h('div', { class: 'titles' }, h('h1', {}, 'Заявки на исправление'))),
        h('div', { class: 'card' }, h('div', { class: 'card-body' },
          empty('Раздел недоступен', 'Заявки подают проектные менеджеры, рассматривает администратор.', '🔒')))
      );
    }
    return renderCorrections(route.query);
  }
  if (section === 'users') return renderUsers();
  if (section === 'fields') return renderFields(route.query);
  if (section === 'dictionaries') return renderDictionaries(route.query);
  if (section === 'settings') return renderSettings();
  if (section === 'audit') return renderAudit(route.query);
  if (section === 'bin') return renderBin();
  return notFound('Раздел не найден');
}

function render() {
  const root = document.getElementById('root');
  if (!root) return;
  if (!ui.user) {
    setChildren(root, renderLogin());
    return;
  }
  ui.route = parseHash();
  let content;
  try {
    content = routeView(ui.route);
  } catch (error) {
    content = frag(
      h('div', { class: 'card' }, h('div', { class: 'card-body' },
        empty('Не удалось построить экран', String(error && error.message ? error.message : error), '⚠')))
    );
  }
  setChildren(root, renderShell(content));
}

// --- Запуск ---
function boot() {
  document.documentElement.lang = 'ru';
  document.head.append(h('style', {}, CSS));
  document.body.append(h('div', { id: 'root' }));
  document.body.append(h('div', { class: 'toast-stack', id: 'toasts' }));

  // После публикации страница перезагружается: возвращаем экран и сообщение
  let flash = '';
  try {
    const route = sessionStorage.getItem('po_route');
    if (route) {
      sessionStorage.removeItem('po_route');
      if (location.hash !== route) location.hash = route;
    }
    flash = sessionStorage.getItem('po_flash') || '';
    if (flash) sessionStorage.removeItem('po_flash');
  } catch (error) { /* приватный режим */ }

  restoreSession();

  // Первый запуск: в системе нет ни одного сотрудника — заводим администратора
  if (!state.users.length) {
    state.users.push({
      id: ++state.seq.user, full_name: 'Администратор', position: 'Руководитель Проектного офиса',
      email: '', role: 'admin', region: '', pinHash: null, pinSalt: null, active: true, created_at: nowStamp(),
    });
  }

  render();
  if (flash) toastOk(flash);

  window.addEventListener('hashchange', () => {
    const previous = ui.route.path;
    render();
    if (parseHash().path !== previous) window.scrollTo(0, 0);
  });

  // Возможность выгрузки появляется не сразу
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('downloads').then((downloads) => {
      ui.downloads = downloads;
      ui.downloadsReady = true;
      render();
    }).catch(() => { ui.downloadsReady = true; render(); });
  } else {
    ui.downloadsReady = true;
  }

  // Когда сохранять некуда, портал честно предупреждает об этом сразу
  ARTIFACT.then((artifact) => {
    if (!artifact) { ui.noSave = true; render(); }
  });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot, { once: true });
else boot();


})();
</script>
