{% load i18n %}{% get_current_language as LANG %}
<form action="{% url 'set_language' %}" method="post" class="lang-switch" aria-label="{% translate 'Language' %}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button type="submit" name="language" value="uz" {% if LANG == "uz" %}aria-current="true"{% endif %} title="O'zbekcha">UZ</button>
  <button type="submit" name="language" value="ru" {% if LANG == "ru" %}aria-current="true"{% endif %} title="Русский">RU</button>
  <button type="submit" name="language" value="en" {% if LANG == "en" %}aria-current="true"{% endif %} title="English">EN</button>
</form>
