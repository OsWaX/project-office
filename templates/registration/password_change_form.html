{% extends "base.html" %}{% load i18n %}
{% block title %}{% translate "Change password" %}{% endblock %}
{% block content %}
<div class="page-head"><h1>{% translate "Change password" %}</h1></div>
<div class="card" style="max-width:520px"><div class="card-body">
  <form method="post">{% csrf_token %}
    <div class="stack" style="gap:14px">
      {% for field in form %}{% include "includes/field.html" %}{% endfor %}
    </div>
    <div class="form-actions"><button class="btn btn-primary">{% translate "Save" %}</button></div>
  </form>
</div></div>
{% endblock %}
