 * оказываются общими для всех сотрудников, а не у каждого в браузере.
 */
const EMPTY_STATE = {
  users: [], companies: [], contacts: [], projects: [], steps: [], statusHistory: [],
  visits: [], members: [], meetings: [], comments: [], corrections: [], audit: [],
  customFields: [], votes: [], savedFilters: [], trash: [],
  seq: { user: 0, company: 0, project: 0, visit: 0, meeting: 0, step: 0, comment: 0,
         correction: 0, audit: 0, contact: 0, member: 0, history: 0, field: 0, filter: 0, trash: 0 },
  meta: { staleDays: 30, tbcDays: 7, retentionDays: 30,

          agency: 'Агентство по развитию лёгкой промышленности при Кабинете Министров Республики Узбекистан',
          // Дополнение № 1, решение Р-3: регионы реализации — только у инвестиционных

          locationsForExport: false },

let state;
try {
  state = JSON.parse(document.getElementById('app-state').textContent);
} catch (error) {
  state = null;

if (!state || typeof state !== 'object') state = {};
Object.keys(EMPTY_STATE).forEach((key) => {
  if (state[key] === undefined) state[key] = Array.isArray(EMPTY_STATE[key]) ? [] : Object.assign({}, EMPTY_STATE[key]);

  return '<!doctype html>\n<html lang="ru">\n<head>\n<meta charset="utf-8">\n'
    + '<meta name="viewport" content="width=device-width, initial-scale=1">\n'
    + '<title>' + DOC_TITLE + '</title>\n</head>\n<body>\n'
    + '<script type="application/json" id="app-state">' + json + '</scr' + 'ipt>\n'
    + '<script id="app-js">' + APP_SRC + '</scr' + 'ipt>\n</body>\n</html>';
}

function savingOverlay(on) {
  ui.saving = on;
  let node = document.getElementById('saving');
  if (on) {
    if (!node) {
      node = h('div', { class: 'saving-overlay', id: 'saving' },
        h('div', { class: 'saving-box' }, h('div', { class: 'spinner' }), h('div', {}, 'Сохранение…')));
      document.body.append(node);
    }
  } else if (node) {
    node.remove();
  }
}

/**
 * Сохраняет изменения: пересобирает документ и публикует новую версию.
 * При успехе страница сама перезагружается на неё, поэтому маршрут и
 * сообщение переносим через sessionStorage.
 */
async function persist(message) {
  render();
  const doc = buildDocument();
  if (doc.length > 13000000) {
    toastError('Объём данных близок к пределу. Удалите часть записей, прежде чем добавлять новые.');
    return false;
  }
  const artifact = await ARTIFACT;
  if (!artifact) {
    ui.noSave = true;
    render();
    toastError('Страница открыта вне claude.ai — сохранять изменения некуда. Откройте портал по ссылке артефакта.');
    return false;
  }
  savingOverlay(true);
  try {
    try {
      sessionStorage.setItem('po_route', location.hash || '#/dashboard');
      if (message) sessionStorage.setItem('po_flash', message);
    } catch (error) { /* приватный режим */ }
    await artifact.publish(doc);
    return true;   // страница перезагрузится на новую версию
  } catch (error) {
    try { sessionStorage.removeItem('po_flash'); } catch (e) { /* нет доступа */ }
    savingOverlay(false);
    const code = error && error.code;
    if (code === 'conflict') {
      toast('Коллега сохранил свои изменения раньше. Страница обновится — повторите действие.', { title: 'Данные изменились', type: 'error', timeout: 8000 });
    } else if (code === 'not_writer' || code === 'not_granted' || code === 'consent_required') {
      ui.readOnly = true;
      render();
      toastError('У вас доступ только на просмотр — изменения не сохраняются.');
    } else if (code === 'too_large') {
      toastError('Слишком большой объём данных. Удалите часть записей.');
    } else if (code === 'rate_limited') {
      toastError('Слишком частые сохранения. Подождите несколько секунд и повторите.');
    } else {
      toastError('Не удалось сохранить: ' + (code || 'нет связи') + '. Изменение показано на экране, но не записано — повторите действие.');
    }
    return false;
  }
}

function can(user, permission) {
  if (!user) return false;
  const allowed = PERMISSIONS[permission];
  if (!allowed) throw new Error('Неизвестное право доступа: ' + permission);
  if (allowed.indexOf(user.role) === -1) return false;
  // Просмотр разрешён всегда; изменять нечего, если запись невозможна
  return permission.indexOf('.view') !== -1 || permission === 'report.export' || canWrite() || user.role === 'viewer';
}

/** Проектный менеджер меняет статус и отмечает выполнение только по своим записям. */
function isOwnRecord(user, record) {
  if (!user || !record) return false;
  return String(record.responsible_user_id) === String(user.id) || String(record.created_by) === String(user.id);
}

/** Итог для интерфейса: разрешено ли действие с учётом принадлежности записи. */
function canOn(user, permission, record) {
  if (!can(user, permission)) return false;
  if (user.role === 'admin') return true;
  return isOwnRecord(user, record);
}

function h(tag, attrs) {
  const element = document.createElement(tag);
  if (attrs) {
    for (const key in attrs) {
      const value = attrs[key];
      if (value === null || value === undefined || value === false) continue;
      if (key === 'class') element.className = value;
      else if (key === 'style' && typeof value === 'object') Object.assign(element.style, value);
      else if (key === 'dataset') Object.assign(element.dataset, value);
      else if (key.slice(0, 2) === 'on' && typeof value === 'function') element.addEventListener(key.slice(2), value);
      else if (key === 'html') element.innerHTML = value;
      else if (value === true) element.setAttribute(key, '');
      else element.setAttribute(key, value);
    }
  }
  for (let i = 2; i < arguments.length; i++) append(element, arguments[i]);
  return element;
}

function append(parent, child) {
  if (child === null || child === undefined || child === false || child === '') return;
  if (Array.isArray(child)) { child.forEach((c) => append(parent, c)); return; }
  parent.append(child instanceof Node ? child : document.createTextNode(String(child)));
}

const frag = function () {
  const f = document.createDocumentFragment();
  for (let i = 0; i < arguments.length; i++) append(f, arguments[i]);
  return f;
};

const column = function () {
  const args = [].slice.call(arguments);
  return h.apply(null, ['div', { class: 'col-stack' }].concat(args));
};

function setChildren(node) {
  while (node.firstChild) node.firstChild.remove();
  for (let i = 1; i < arguments.length; i++) append(node, arguments[i]);
  return node;
}

const SVG_NS = 'http://www.w3.org/2000/svg';
function svg(tag, attrs) {
  const element = document.createElementNS(SVG_NS, tag);
  for (const key in attrs || {}) {
    const value = attrs[key];
    if (value === null || value === undefined || value === false) continue;
    if (key.slice(0, 2) === 'on' && typeof value === 'function') element.addEventListener(key.slice(2), value);
    else element.setAttribute(key, value);
  }
  for (let i = 2; i < arguments.length; i++) {
    const child = arguments[i];
    if (child === null || child === undefined || child === false) continue;
    element.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return element;
}

const MONTHS_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const MONTHS_NOM = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
const WEEKDAYS_SHORT = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];

function formatDate(value, options) {
  if (!value) return '—';
  const date = new Date(String(value).replace(' ', 'T'));
  if (isNaN(date)) return '—';
  const day = date.getDate();
  if (options && options.long) return day + ' ' + MONTHS_GEN[date.getMonth()] + ' ' + date.getFullYear() + ' г.';
  return String(day).padStart(2, '0') + '.' + String(date.getMonth() + 1).padStart(2, '0') + '.' + date.getFullYear();
}

function formatDateShort(value) {
  if (!value) return '—';
  const date = new Date(String(value).replace(' ', 'T'));
  return date.getDate() + ' ' + MONTHS_GEN[date.getMonth()].slice(0, 3) + '.';
}

function formatDateTime(value) {
  if (!value) return '—';
  const date = new Date(String(value).replace(' ', 'T'));
  if (isNaN(date)) return '—';
  return formatDate(value) + ', ' + String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0');
}

function plural(n, one, few, many) {
  const abs = Math.abs(n) % 100;
  const last = abs % 10;
  if (abs > 10 && abs < 20) return many;
  if (last > 1 && last < 5) return few;
  if (last === 1) return one;
  return many;
}

function daysUntil(dateString) {
  if (!dateString) return 0;
  const target = new Date(dateString + 'T00:00:00');
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return Math.round((target - today) / DAY);
}

const todayIso = () => new Date().toISOString().slice(0, 10);
const NUMBER_FORMAT = new Intl.NumberFormat('ru-RU');
const formatNumber = (value) => (value === null || value === undefined || value === '' ? '—' : NUMBER_FORMAT.format(Math.round(Number(value))));

function formatMoney(amount, currency, options) {
  if (amount === null || amount === undefined || amount === '') return '—';
  const value = Number(amount);
  const compact = options && options.compact;
  if (compact && Math.abs(value) >= 1000000) return (value / 1000000).toFixed(value >= 10000000 ? 0 : 1).replace('.', ',') + ' млн ' + (currency || '');
  if (compact && Math.abs(value) >= 1000) return Math.round(value / 1000) + ' тыс. ' + (currency || '');
  return NUMBER_FORMAT.format(Math.round(value)) + (currency ? ' ' + currency : '');
}

// --- Модальные окна ---
function openModal(options) {
  const scrim = h('div', { class: 'modal-scrim' });
  const close = () => { scrim.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (event) => { if (event.key === 'Escape') close(); };
  const modal = h('div', { class: 'modal ' + (options.size || ''), role: 'dialog', 'aria-modal': 'true' },
    h('div', { class: 'modal-head' },
      h('h2', {}, options.title),
      h('button', { class: 'icon-btn', 'aria-label': 'Закрыть', onclick: close }, '✕')
    ),
    h('div', { class: 'modal-body' }, options.body),
    options.footer ? h('div', { class: 'modal-foot' }, options.footer(close)) : null
  );
  scrim.addEventListener('mousedown', (event) => { if (event.target === scrim) close(); });
  scrim.append(modal);
  document.body.append(scrim);
  document.addEventListener('keydown', onKey);
  const firstControl = modal.querySelector('input, select, textarea, button.btn-primary');
  if (firstControl) firstControl.focus();
  return close;
}

function confirmDialog(options) {
  return new Promise((resolve) => {
    let settled = false;
    const finish = (value, close) => { settled = true; close(); resolve(value); };
    openModal({
      title: options.title || 'Подтверждение',
      size: 'narrow',
      body: h('p', { class: 'mb-0' }, options.message),
      footer: (close) => [
        h('button', { class: 'btn', onclick: () => finish(false, close) }, 'Отмена'),
        h('button', {
          class: 'btn ' + (options.danger ? 'btn-danger' : 'btn-primary'),
          onclick: () => finish(true, close),
        }, options.confirmLabel || 'Подтвердить'),
      ],
      onClose: () => { if (!settled) resolve(false); },
    });
  });
}

const PALETTE = ['#1f4e9e', '#0f8a6a', '#a5791f', '#6f45c9', '#c2582e', '#2f8bbf', '#8a3d6b', '#4e7a2f', '#a53f3f'];

function donutChart(items, options) {
  const opts = options || {};
  const size = opts.size || 190;
  const thickness = opts.thickness || 30;
  const total = items.reduce((sum, item) => sum + item.count, 0);
  const radius = (size - thickness) / 2;
  const center = size / 2;
  const root = svg('svg', { viewBox: '0 0 ' + size + ' ' + size, width: size, height: size, role: 'img', 'aria-label': 'Распределение по статусам' });

  if (!total) {
    root.append(svg('circle', { cx: center, cy: center, r: radius, fill: 'none', stroke: 'var(--surface-3)', 'stroke-width': thickness }));
  } else {
    let angle = -Math.PI / 2;
    items.forEach((item, index) => {
      if (!item.count) return;
      const sweep = (item.count / total) * Math.PI * 2;
      const end = angle + sweep;
      const large = sweep > Math.PI ? 1 : 0;
      const x1 = center + radius * Math.cos(angle);
      const y1 = center + radius * Math.sin(angle);
      const x2 = center + radius * Math.cos(end);
      const y2 = center + radius * Math.sin(end);
      const d = sweep >= Math.PI * 2 - 0.0001
        ? 'M ' + center + ' ' + (center - radius) + ' A ' + radius + ' ' + radius + ' 0 1 1 ' + (center - 0.01) + ' ' + (center - radius)
        : 'M ' + x1 + ' ' + y1 + ' A ' + radius + ' ' + radius + ' 0 ' + large + ' 1 ' + x2 + ' ' + y2;
      root.append(svg('path', { d: d, fill: 'none', stroke: item.color || PALETTE[index % PALETTE.length], 'stroke-width': thickness },
        svg('title', {}, item.label + ': ' + item.count)));
      angle = end;
    });
  }
  if (opts.centerValue !== undefined) {
    root.append(svg('text', { x: center, y: center - 2, 'text-anchor': 'middle', 'font-size': 26, 'font-weight': 700, fill: 'var(--ink)' }, opts.centerValue));
    root.append(svg('text', { x: center, y: center + 17, 'text-anchor': 'middle', 'font-size': 11, fill: 'var(--ink-faint)' }, opts.centerLabel || ''));
  }
  return root;
}

/** Ленточная диаграмма дорожной карты. */
function gantt(steps) {
  const dated = steps.filter((s) => s.due_date);
  if (!dated.length) return null;
  const times = dated.map((s) => new Date(s.due_date + 'T00:00:00').getTime());
  const now = Date.now();
  let min = Math.min.apply(null, times.concat([now]));
  let max = Math.max.apply(null, times.concat([now]));
  if (max === min) max = min + DAY;
  const pad = (max - min) * 0.06;
  min -= pad; max += pad;
  const pos = (time) => ((time - min) / (max - min)) * 100;

  return h('div', {},
    h('div', { class: 'gantt' },
      dated.map((step, index) => {
        const end = new Date(step.due_date + 'T00:00:00').getTime();
        const start = index === 0 ? min + pad * 0.4 : new Date(dated[index - 1].due_date + 'T00:00:00').getTime();
        const left = pos(Math.min(start, end));
        const width = Math.max(1.5, pos(end) - left);
        const overdue = step.state !== 'done' && daysUntil(step.due_date) < 0;
        const color = step.state === 'done' ? 'var(--ok)' : overdue ? 'var(--danger)' : step.state === 'in_progress' ? 'var(--indigo)' : 'var(--ink-faint)';
        return h('div', { class: 'gantt-row' },
          h('span', { class: 'nowrap', style: { overflow: 'hidden', textOverflow: 'ellipsis' }, title: step.title }, step.title),
          h('div', { class: 'gantt-track' },
            h('div', { class: 'gantt-bar', style: { left: left + '%', width: width + '%', background: color } , title: formatDate(step.due_date) }),
            h('div', { class: 'gantt-today', style: { left: pos(now) + '%' } })
          )
        );
      })
    ),
    h('div', { class: 'gantt-axis' },
      h('span', {}, formatDate(new Date(min).toISOString().slice(0, 10))),
      h('span', {}, 'сегодня — ' + formatDate(todayIso())),
      h('span', {}, formatDate(new Date(max).toISOString().slice(0, 10)))
    )
  );
}

function toCsv(headers, rows) {
  const cell = (value) => {
    const text = value === null || value === undefined ? '' : String(value);
    return /[";\n]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
  };
  const lines = [headers.map(cell).join(';')];
  rows.forEach((row) => lines.push(row.map(cell).join(';')));
  return '﻿' + lines.join('\r\n');
}

async function saveCsv(filename, headers, rows, label) {
  if (!ui.downloads) {
    toastError('Выгрузка файлов в этом просмотре недоступна. Откройте демонстрацию в claude.ai, чтобы сохранить CSV.');
    return;
  }
  try {
    await ui.downloads.save({ filename: filename, data: toCsv(headers, rows) });
    audit('export', 'report', null, 'Выгружен файл ' + filename + ' — ' + label + ' (строк: ' + rows.length + ')', []);
    toastOk('Файл ' + filename + ' сформирован: строк — ' + rows.length + '.');
  } catch (error) {
    if (error && error.code === 'rejected') toast('Сохранение файла отменено.', { title: 'Отменено' });
    else toastError('Файл не сохранён: ' + ((error && error.message) || 'неизвестная ошибка') + '.');
  }
}

/** Кнопка выгрузки: заметна, но честно показывает, когда сохранение недоступно. */
function exportButton(label, filename, headers, rowsFn, small) {
  const button = h('button', {
    class: 'btn ' + (small ? 'btn-sm' : ''),
    onclick: () => saveCsv(filename, headers, rowsFn(), label),
  }, '⇩ ', label);
  if (ui.downloadsReady && !ui.downloads) {
    button.disabled = true;
    button.title = 'Выгрузка доступна при просмотре в claude.ai';
  }
  return button;
}

/**
 * Проверяет узбекскую сторону проекта перед сохранением.
 * Возвращает { error } — сохранять нельзя, либо { warnings } — предупредить.
 */
function validateUzSide(values, foreignCompanyId) {
  const seenPartners = {};
  for (let i = 0; i < values.partners.length; i++) {
    const partner = values.partners[i];
    if (String(partner.company_id) === String(foreignCompanyId)) {
      return { error: 'Иностранный и местный партнёр не могут быть одной организацией.' };
    }
    if (seenPartners[partner.company_id]) {
      const company = companyById(partner.company_id);
      return { error: 'Организация «' + (company ? company.name : '') + '» уже указана как местный партнёр.' };
    }
    seenPartners[partner.company_id] = true;
  }

  const seenRegions = {};
  for (let i = 0; i < values.locations.length; i++) {
    const location = values.locations[i];
    if (seenRegions[location.region]) {
      return { error: 'Регион «' + uzRegionName(location.region) + '» уже добавлен.' };
    }
    seenRegions[location.region] = true;
    if (!location.locality) {
      return { error: 'Для региона «' + uzRegionName(location.region) + '» укажите город или район.' };
    }
  }

  const warnings = [];
  const allocated = values.locations.reduce((sum, l) => sum + (Number(l.amount) || 0), 0);
  if (allocated > (Number(values.amount) || 0) && allocated > 0) {
    warnings.push('Сумма по регионам превышает сумму проекта — проверьте распределение.');
  }
  return { warnings: warnings };
}

/** Сводка по регионам Узбекистана для дашборда. */
function uzSummary(projects) {
  const byRegion = {};
  const withLocation = {};
  projects.forEach((project) => {
    (project.locations || []).forEach((location) => {
      withLocation[project.id] = true;
      if (!byRegion[location.region]) {
        byRegion[location.region] = { key: location.region, label: uzRegionName(location.region), count: 0, amount_usd: 0, localities: [] };
      }
      const bucket = byRegion[location.region];
      bucket.count += 1;
      if (location.amount) bucket.amount_usd += toUsd(location.amount, project.currency);
      if (location.locality && bucket.localities.indexOf(location.locality) === -1) bucket.localities.push(location.locality);
    });
  });

  const investment = projects.filter((p) => p.area === 'investment');
  const withoutLocation = investment.filter((p) => !withLocation[p.id]);
  let unallocatedUsd = 0;
  investment.forEach((project) => {
    const allocated = (project.locations || []).reduce((sum, l) => sum + (Number(l.amount) || 0), 0);
    unallocatedUsd += toUsd(Math.max((Number(project.amount) || 0) - allocated, 0), project.currency);
  });

  const rows = Object.keys(byRegion).map((k) => byRegion[k]).sort((a, b) => b.count - a.count);
  return {
    rows: rows,
    regionsCovered: rows.length,
    regionsTotal: UZ_REGIONS.length,
    investmentTotal: investment.length,
    withoutLocation: withoutLocation.length,
    unallocatedUsd: unallocatedUsd,
  };
}

/**
 * Учётные записи создаёт администратор. Код доступа сотрудник задаёт сам при
 * первом входе; в данных хранится только результат хеширования PBKDF2 со
 * случайной солью — самого кода в системе нет.
 *
 * Ограничение, о котором важно знать: портал работает без сервера, поэтому
 * хеши лежат в исходном коде страницы. Это разграничивает работу сотрудников
 * между собой, но не защищает данные от того, у кого есть ссылка на портал.
 * Доступом к самой ссылке управляйте через доступ к артефакту.
 */
const PBKDF2_ROUNDS = 150000;

const cryptoApi = () => (window.crypto && window.crypto.subtle) ? window.crypto : null;

function randomSalt() {
  const bytes = new Uint8Array(16);
  cryptoApi().getRandomValues(bytes);
  return Array.from(bytes).map((b) => b.toString(16).padStart(2, '0')).join('');
}

async function derivePin(pin, salt) {
  const api = cryptoApi();
  if (!api) throw new Error('crypto');
  const encoder = new TextEncoder();
  const key = await api.subtle.importKey('raw', encoder.encode(pin), 'PBKDF2', false, ['deriveBits']);
  const bits = await api.subtle.deriveBits(
    { name: 'PBKDF2', salt: encoder.encode(salt), iterations: PBKDF2_ROUNDS, hash: 'SHA-256' },
    key, 256
  );
  return Array.from(new Uint8Array(bits)).map((b) => b.toString(16).padStart(2, '0')).join('');
}

const session = {
  get id() {
    try { return sessionStorage.getItem('po_user') || ui.sessionFallback || null; }
    catch (error) { return ui.sessionFallback || null; }
  },
  set id(value) {
    ui.sessionFallback = value;
    try {
      if (value) sessionStorage.setItem('po_user', value);
      else sessionStorage.removeItem('po_user');
    } catch (error) { /* приватный режим — остаётся память вкладки */ }
  },
};

function restoreSession() {
  const id = session.id;
  const user = id ? userById(id) : null;
  ui.user = (user && user.active !== false) ? user : null;
  if (id && !ui.user) session.id = null;
}

function renderLogin() {
  const active = state.users.filter((u) => u.active !== false);
  const userSelect = select(active.map((u) => ({ value: u.id, label: u.full_name + ' — ' + ROLE_LABELS[u.role] })),
    { placeholder: 'Выберите себя из списка' });
  const pinInput = h('input', { type: 'password', autocomplete: 'current-password', placeholder: '••••••', 'aria-label': 'Код доступа' });
  const errorBox = h('div', { class: 'callout danger hidden' });
  const submit = h('button', { class: 'btn btn-primary btn-block btn-lg', type: 'submit' }, 'Войти');

  const showError = (text) => { errorBox.textContent = text; errorBox.classList.remove('hidden'); };

  const pinField = field('Код доступа', pinInput, { required: true });
  const hint = h('p', { class: 'hint mb-0' });

  const refreshHint = () => {
    const user = userById(userSelect.value);
    if (user && !user.pinHash) {
      pinField.classList.add('hidden');
      hint.textContent = 'Вы входите впервые — на следующем шаге нужно будет придумать код доступа.';
      submit.textContent = 'Продолжить';
    } else {
      pinField.classList.remove('hidden');
      hint.textContent = '';
      submit.textContent = 'Войти';
    }
  };
  userSelect.addEventListener('change', refreshHint);

  const form = h('form', {
    class: 'login-form',
    onsubmit: async (event) => {
      event.preventDefault();
      errorBox.classList.add('hidden');
      const user = userById(userSelect.value);
      if (!user) { showError('Выберите свою учётную запись.'); return; }
      if (!cryptoApi()) {
        showError('Браузер не даёт доступ к шифрованию. Откройте портал по адресу https://, а не как локальный файл.');
        return;
      }
      if (!user.pinHash) { openPinSetup(user); return; }
      submit.disabled = true;
      submit.textContent = 'Проверка…';
      try {
        const hash = await derivePin(pinInput.value, user.pinSalt || '');
        if (hash !== user.pinHash) { showError('Неверный код доступа.'); return; }
        session.id = user.id;
        ui.user = user;
        nav('#/dashboard');
        audit('login', 'user', user.id, 'Вход в систему — ' + ROLE_LABELS[user.role], []);
        await persist('');
        render();
      } finally {
        submit.disabled = false;
        refreshHint();
      }
    },
  },
    h('h2', {}, 'Вход в систему'),
    h('p', { class: 'hint' }, 'Учётные записи создаёт администратор Проектного офиса. Самостоятельная регистрация не предусмотрена.'),
    errorBox,
    field('Сотрудник', userSelect, { required: true }),
    pinField,
    hint,
    h('div', { class: 'mt-2' }, submit)
  );
  refreshHint();

  return h('div', { class: 'login-page' },
    h('div', { class: 'login-hero' },
      h('div', {},
        h('div', { class: 'emblem' }, '🧵'),
        h('div', { class: 'ministry' }, state.meta.agency),
        h('h1', {}, 'Портал Проектного офиса по текстильной промышленности'),
        h('p', { class: 'lead' }, 'Единый учёт экспортных и инвестиционных проектов, компаний-партнёров, зарубежных визитов и программы встреч.'),
        h('ul', {},
          h('li', {}, 'Реестр проектов, соглашений, меморандумов и контрактов'),
          h('li', {}, 'Дорожные карты со сроками и контролем просрочек'),
          h('li', {}, 'Визиты делегаций и программа встреч по дням'),
          h('li', {}, 'Разграничение прав и полный журнал аудита')
        )
      ),
      h('div', { class: 'foot' }, state.meta.orgName)
    ),
    h('div', { class: 'login-form-wrap' }, h('div', { class: 'login-form' }, form))
  );
}

/** Первый вход: сотрудник задаёт себе код доступа. */
function openPinSetup(user) {
  const first = h('input', { type: 'password', autocomplete: 'new-password', minlength: 6, required: true });
  const again = h('input', { type: 'password', autocomplete: 'new-password', minlength: 6, required: true });
  const errorBox = h('div', { class: 'callout danger hidden' });
  openModal({
    title: 'Первый вход — задайте код доступа',
    size: 'narrow',
    body: frag(
      h('p', {}, 'Здравствуйте, ', h('b', {}, user.full_name), '. Придумайте код доступа не короче шести символов — он понадобится при каждом входе.'),
      errorBox,
      field('Код доступа', first, { required: true }),
      field('Повторите код', again, { required: true }),
      h('p', { class: 'small muted mb-0' }, 'Восстановить код нельзя: если он забудется, администратор сбросит его и вы зададите новый.')
    ),
    footer: (close) => [
      h('button', { class: 'btn', onclick: close }, 'Отмена'),
      h('button', { class: 'btn btn-primary', onclick: async () => {
        errorBox.classList.add('hidden');
        const value = first.value;
        if (value.length < 6) { errorBox.textContent = 'Код должен быть не короче шести символов.'; errorBox.classList.remove('hidden'); return; }
        if (value !== again.value) { errorBox.textContent = 'Коды не совпадают.'; errorBox.classList.remove('hidden'); return; }
        const salt = randomSalt();
        user.pinSalt = salt;
        user.pinHash = await derivePin(value, salt);
        session.id = user.id;
        ui.user = user;
        close();
        nav('#/dashboard');
        audit('login', 'user', user.id, 'Задан код доступа и выполнен первый вход', []);
        await persist('Добро пожаловать, ' + user.full_name + '!');
      } }, 'Сохранить и войти'),
    ],
  });
}

function signOut() {
  session.id = null;
  ui.user = null;
  nav('');
  render();
}

function runSearch(term, container) {
  const query = term.trim().toLowerCase();
  if (query.length < 2) { container.classList.add('hidden'); return; }
  const groups = [
    ['Проекты и соглашения', state.projects.filter((p) => (p.title + ' ' + p.code).toLowerCase().indexOf(query) !== -1).slice(0, 5),
      (p) => ({ href: '#/projects/' + p.id, title: p.title,
        meta: p.code + ' · ' + (companyById(p.company_id) ? companyById(p.company_id).name : '—') + ' · ' + countryName(p.iso2) })],
    ['Компании', state.companies.filter((c) => c.name.toLowerCase().indexOf(query) !== -1).slice(0, 5),
      (c) => ({ href: '#/companies/' + c.id, title: c.name,
        meta: countryName(c.iso2) + (c.city ? ', ' + c.city : '') + ' · проектов: ' + projectsOfCompany(c.id).length })],
    ['Визиты', state.visits.filter((v) => (v.cities + ' ' + v.goal + ' ' + v.code).toLowerCase().indexOf(query) !== -1).slice(0, 5),
      (v) => ({ href: '#/visits/' + v.id, title: countryName(v.iso2) + ', ' + v.cities, meta: v.code + ' · ' + v.goal.slice(0, 70) })],
  ];
  setChildren(container);
  let found = 0;
  groups.forEach((group) => {
    if (!group[1].length) return;
    found += group[1].length;
    container.append(h('div', { class: 'group-title' }, group[0]));
    group[1].forEach((row) => {
      const item = group[2](row);
      container.append(h('a', { href: item.href, onclick: () => container.classList.add('hidden') },
        h('div', { class: 'r-title' }, item.title),
        h('div', { class: 'r-meta' }, item.meta)
      ));
    });
  });
  if (!found) container.append(h('div', { class: 'group-title' }, 'Ничего не найдено'));
  container.classList.remove('hidden');
}

/** Личный кабинет: смена собственного кода доступа. */
function renderProfile() {
  const user = ui.user;
  const current = h('input', { type: 'password', autocomplete: 'current-password' });
  const next = h('input', { type: 'password', autocomplete: 'new-password' });
  const again = h('input', { type: 'password', autocomplete: 'new-password' });
  const errorBox = h('div', { class: 'callout danger hidden' });

  return frag(
    h('div', { class: 'page-head' },
      h('div', { class: 'titles' },
        h('h1', {}, user.full_name),
        h('div', { class: 'subtitle' }, (user.position || ROLE_LABELS[user.role]) + (user.region ? ' · ' + regionName(user.region) : ''))
      )
    ),
    h('div', { class: 'split' },
      column(
        h('div', { class: 'card' },
          h('div', { class: 'card-head' }, h('h2', {}, 'Смена кода доступа')),
          h('div', { class: 'card-body' },
            errorBox,
            field('Действующий код', current, { required: true }),
            field('Новый код', next, { required: true, help: 'Не короче шести символов.' }),
            field('Повторите новый код', again, { required: true }),
            h('button', { class: 'btn btn-primary', onclick: async () => {
              errorBox.classList.add('hidden');
              const fail = (text) => { errorBox.textContent = text; errorBox.classList.remove('hidden'); };
              if (!cryptoApi()) { fail('Шифрование недоступно в этом браузере.'); return; }
              if (await derivePin(current.value, user.pinSalt || '') !== user.pinHash) { fail('Действующий код указан неверно.'); return; }
              if (next.value.length < 6) { fail('Новый код должен быть не короче шести символов.'); return; }
              if (next.value !== again.value) { fail('Новые коды не совпадают.'); return; }
              const salt = randomSalt();
              user.pinSalt = salt;
              user.pinHash = await derivePin(next.value, salt);
              audit('update', 'user', user.id, 'Сменён собственный код доступа', []);
              await persist('Код доступа изменён.');
            } }, 'Сохранить')
          )
        )
      ),
      column(
        h('div', { class: 'card' },
          h('div', { class: 'card-head' }, h('h2', {}, 'Учётная запись')),
          h('div', { class: 'card-body' },
            h('dl', { class: 'def-list' },

              defItem('Должность', user.position || '—'),
              defItem('Регион', user.region ? regionName(user.region) : '—'),
              defItem('Электронная почта', user.email || '—')
            ),
            h('div', { class: 'hr' }),

              'Права роли назначает администратор. Ваши действия в системе фиксируются в журнале аудита.')
          )
        )
      )
    )
  );
}

function scopedProjects(scope) {
  if (scope === 'mine') return state.projects.filter((p) => p.responsible_user_id === ui.user.id);
  if (scope === 'my_region') {
    if (!ui.user.region) return state.projects.slice();
    return state.projects.filter((p) => countryRegion(p.iso2) === ui.user.region);
  }
  return state.projects.slice();
}

function kpiCard(label, value, note, tone) {
  return h('div', { class: 'kpi ' + (tone || '') },
    h('div', { class: 'label' }, label),
    h('div', { class: 'value' + (String(value).length > 9 ? ' sm' : '') }, value),
    h('div', { class: 'note' }, note)
  );
}

function filterProjects(query) {
  let rows = state.projects.slice();
  if (query.search) {
    const term = query.search.toLowerCase();
    rows = rows.filter((p) => (p.title + ' ' + p.code + ' ' + companyName(p.company_id)).toLowerCase().indexOf(term) !== -1);
  }
  if (query.sector) rows = rows.filter((p) => p.sector_code === query.sector);
  if (query.area) rows = rows.filter((p) => p.area === query.area);
  if (query.status) rows = rows.filter((p) => p.status_code === query.status);
  if (query.type) rows = rows.filter((p) => p.record_type === query.type);
  if (query.region) rows = rows.filter((p) => countryRegion(p.iso2) === query.region);
  if (query.country) rows = rows.filter((p) => p.iso2 === query.country);
  if (query.responsible) rows = rows.filter((p) => String(p.responsible_user_id) === String(query.responsible));
  if (query.mine === '1') rows = rows.filter((p) => p.responsible_user_id === ui.user.id);
  if (query.overdue === '1') rows = rows.filter((p) => stepsOf(p.id).some((s) => s.state !== 'done' && daysUntil(s.due_date) < 0));
  if (query.uz_region) rows = rows.filter((p) => (p.locations || []).some((l) => l.region === query.uz_region));
  if (query.no_uz_region === '1') rows = rows.filter((p) => p.area === 'investment' && !(p.locations || []).length);

  const sort = query.sort || 'updated';
  const dir = query.dir === 'asc' ? 1 : -1;
  const value = (p) => ({
    code: p.code, title: p.title, amount: toUsd(p.amount, p.currency),
    status: p.status_code, updated: p.last_activity_at, country: countryName(p.iso2),
    company: companyName(p.company_id), responsible: userName(p.responsible_user_id),
  }[sort]);
  rows.sort((a, b) => {
    const va = value(a); const vb = value(b);
    if (va === vb) return 0;
    return (va > vb ? 1 : -1) * dir;
  });
  return rows;
}

const companyName = (id) => { const c = companyById(id); return c ? c.name : '(компания удалена)'; };

function projectProgress(projectId) {
  const steps = stepsOf(projectId);
  if (!steps.length) return { done: 0, total: 0, percent: 0 };
  const done = steps.filter((s) => s.state === 'done').length;
  return { done: done, total: steps.length, percent: Math.round((done / steps.length) * 100) };
}

  const set = (key) => (event) => go('/projects', Object.assign({}, query, { [key]: event.target.value || undefined }));

  const filters = h('div', { class: 'filters' },
    field('Поиск', searchInput),

    field('Направление', select([{ value: 'export', label: 'Экспорт' }, { value: 'investment', label: 'Инвестиции' }], { value: query.area || '', placeholder: 'Все направления', onchange: set('area') })),
    field('Статус', select(PROJECT_STATUSES.map((s) => ({ value: s.code, label: s.name })), { value: query.status || '', placeholder: 'Все статусы', onchange: set('status') })),
    field('Тип записи', select(RECORD_TYPES.map((t) => ({ value: t.code, label: t.name })), { value: query.type || '', placeholder: 'Все типы', onchange: set('type') })),
    field('Регион', select(REGIONS.map((r) => ({ value: r.code, label: r.name })), { value: query.region || '', placeholder: 'Все регионы', onchange: set('region') })),
    field('Ответственный', select(state.users.filter((u) => u.role !== 'viewer').map((u) => ({ value: u.id, label: u.full_name })), { value: query.responsible || '', placeholder: 'Все сотрудники', onchange: set('responsible') })),
    field('Регион Узбекистана', select(UZ_REGIONS.map((r) => ({ value: r.code, label: r.name })), { value: query.uz_region || '', placeholder: 'Любой регион', onchange: set('uz_region') }))
  );

  const chips = h('div', { class: 'filter-chips' },
    h('button', { class: 'chip ' + (!query.mine && !query.overdue ? 'active' : ''), onclick: () => go('/projects', {}) }, 'Все записи'),
    h('button', { class: 'chip ' + (query.mine === '1' ? 'active' : ''), onclick: () => go('/projects', Object.assign({}, query, { mine: query.mine === '1' ? undefined : '1' })) }, 'Мои проекты'),
    h('button', { class: 'chip ' + (query.overdue === '1' ? 'active' : ''), onclick: () => go('/projects', Object.assign({}, query, { overdue: query.overdue === '1' ? undefined : '1' })) }, 'С просроченными этапами'),
    h('button', { class: 'chip ' + (query.no_uz_region === '1' ? 'active' : ''), onclick: () => go('/projects', Object.assign({}, query, { no_uz_region: query.no_uz_region === '1' ? undefined : '1' })) }, 'Без региона реализации')
  );

  const sortHead = (key, label, extraClass) => {
    const active = (query.sort || 'updated') === key;
    return h('th', {
      class: 'sortable ' + (extraClass || ''),
      onclick: () => go('/projects', Object.assign({}, query, { sort: key, dir: active && query.dir !== 'asc' ? 'asc' : 'desc' })),
    }, label, active ? h('span', { class: 'arrow' }, query.dir === 'asc' ? '▲' : '▼') : null);
  };

  const table = h('div', { class: 'table-wrap' },
    h('table', { class: 'data registry' },
      h('thead', {}, h('tr', {},
        sortHead('code', 'Код'), sortHead('title', 'Наименование'), sortHead('company', 'Компания'),
        sortHead('country', 'Страна'), h('th', {}, 'Тип и отрасль'), sortHead('status', 'Статус'),
        sortHead('amount', 'Сумма', 'num'), h('th', {}, 'Дорожная карта'),
        sortHead('responsible', 'Ответственный'), sortHead('updated', 'Активность')
      )),
      h('tbody', {}, rows.map((project) => {
        const progress = projectProgress(project.id);
        const overdue = stepsOf(project.id).some((s) => s.state !== 'done' && daysUntil(s.due_date) < 0);
        const staleDays = Math.round((Date.now() - new Date(project.last_activity_at.replace(' ', 'T')).getTime()) / DAY);
        return h('tr', { class: overdue ? 'row-overdue' : staleDays > STALE_DAYS ? 'row-stale' : '' },
          h('td', {}, h('a', { href: '#/projects/' + project.id, class: 'code' }, project.code)),
          h('td', {},
            h('a', { href: '#/projects/' + project.id, class: 't-main' }, project.title),
            h('div', { class: 't-sub' }, project.description.slice(0, 96) + (project.description.length > 96 ? '…' : ''))
          ),
          h('td', {}, h('a', { href: '#/companies/' + project.company_id }, companyName(project.company_id))),
          h('td', {}, countryName(project.iso2), h('div', { class: 't-sub' }, regionName(countryRegion(project.iso2)))),
          h('td', {},
            dictName(RECORD_TYPES, project.record_type),
            h('div', { class: 't-sub' }, dictName(SECTORS, project.sector_code) + ' · ' + AREA_LABELS[project.area])
          ),
          h('td', {}, statusTag(dictName(PROJECT_STATUSES, project.status_code), dictColor(PROJECT_STATUSES, project.status_code))),
          h('td', { class: 'num' }, formatMoney(project.amount, project.currency)),
          h('td', {},
            h('div', { class: 'progress' }, h('span', { style: { width: progress.percent + '%', background: overdue ? 'var(--danger)' : 'var(--ok)' } })),
            h('div', { class: 't-sub' }, progress.done + ' из ' + progress.total + (overdue ? ' · есть просрочка' : ''))
          ),
          h('td', {}, userName(project.responsible_user_id)),
          h('td', { class: 'nowrap' }, formatDate(project.last_activity_at), h('div', { class: 't-sub' }, staleDays + ' ' + plural(staleDays, 'день', 'дня', 'дней') + ' назад'))
        );
      }))
    )
  );

  return frag(
    h('div', { class: 'page-head' },
      h('div', { class: 'titles' },
        h('h1', {}, 'Проекты и соглашения'),
        h('div', { class: 'subtitle' }, 'Найдено записей: ' + rows.length + ' из ' + state.projects.length)
      ),
      h('div', { class: 'page-actions' },
        exportButton('Выгрузить в CSV', 'projects.csv',
          ['Код', 'Наименование', 'Тип', 'Отрасль', 'Направление', 'Компания', 'Страна', 'Регион', 'Статус', 'Сумма', 'Валюта', 'Сумма USD', 'Ответственный', 'Этапов выполнено', 'Этапов всего', 'Последняя активность']
            .concat(['Местные партнёры', 'Регионы реализации'])
            .concat(fieldsFor('project').filter((f) => f.type !== 'poll').map((f) => f.label)),
          () => rows.map((p) => {
            const progress = projectProgress(p.id);
            const company = companyById(p.company_id);
            return [p.code, p.title, dictName(RECORD_TYPES, p.record_type), dictName(SECTORS, p.sector_code),
              AREA_LABELS[p.area], company ? company.name : '—', countryName(p.iso2), regionName(countryRegion(p.iso2)),
              dictName(PROJECT_STATUSES, p.status_code), p.amount, p.currency, Math.round(toUsd(p.amount, p.currency)),
              userName(p.responsible_user_id), progress.done, progress.total, p.last_activity_at]
              .concat([
                (p.partners || []).map((x) => companyName(x.company_id) + (x.role_note ? ' (' + x.role_note + ')' : '')).join('; '),
                (p.locations || []).map((l) => uzRegionName(l.region) + ' — ' + l.locality + (l.amount ? ', ' + l.amount : '')).join('; '),
              ])
              .concat(fieldsFor('project').filter((f) => f.type !== 'poll').map((f) => (p.customValues || {})[f.key] || ''));
          }), 'реестр проектов'),
        can(ui.user, 'project.create')
          ? h('button', { class: 'btn btn-primary', onclick: openProjectCreate }, '+ Новая запись')
          : permNote('Создание записей доступно администратору и проектным менеджерам')
      )
    ),
    filters,
    chips,
    h('div', { class: 'card' },
      rows.length
        ? h('div', { class: 'card-body tight' }, table)
        : h('div', { class: 'card-body' }, empty('Записей не найдено', 'Измените условия фильтрации.', '▦'))
    ),
    h('div', { class: 'legend-inline' },
      h('span', {}, h('span', { class: 'sw', style: { background: 'var(--danger)' } }), 'красная отметка — есть просроченный этап'),
      h('span', {}, h('span', { class: 'sw', style: { background: 'var(--warn)' } }), 'жёлтая — нет активности более ' + STALE_DAYS + ' дней')
    )
  );
}

// ==========================================================================
//  12. Карточка проекта с дорожной картой
// ==========================================================================

function renderProject(id) {
  const project = projectById(id);
  if (!project) return notFound('Запись не найдена');

  const company = companyById(project.company_id) || { id: '', name: '(компания удалена)' };
  const steps = stepsOf(project.id);
  const progress = projectProgress(project.id);
  const mayEdit = can(ui.user, 'project.edit');
  const mayStatus = canOn(ui.user, 'project.status_change', project);
  const mayRequest = can(ui.user, 'correction.request');
  const relatedMeetings = state.meetings.filter((m) => m.project_id === project.id);
  const history = state.statusHistory.filter((s) => s.project_id === project.id).sort((a, b) => (a.created_at < b.created_at ? 1 : -1));
  const requests = correctionsOf('project', project.id);

  // --- Действия в шапке: набор зависит от роли ---
  const actions = [];
  if (mayEdit) actions.push(h('button', { class: 'btn btn-primary', onclick: () => openProjectEdit(project) }, '✎ Изменить'));
  else if (mayRequest) actions.push(h('button', { class: 'btn btn-primary', onclick: () => openCorrectionForm('project', project.id, project.title, project) }, '✎ Запросить исправление'));
  if (mayStatus) actions.push(h('button', { class: 'btn', onclick: () => openStatusChange(project) }, '⇄ Сменить статус'));
  if (can(ui.user, 'project.delete')) actions.push(h('button', { class: 'btn btn-danger', onclick: () => deleteProject(project) }, 'Удалить'));
  actions.push(exportButton('Дорожная карта в CSV', 'roadmap-' + project.code + '.csv',
    ['№', 'Этап', 'Срок', 'Состояние', 'Ответственный', 'Отметка о выполнении'],
    () => steps.map((s) => [s.seq, s.title, s.due_date, STEP_STATE_LABELS[s.state], userName(s.responsible_user_id), s.done_at || '']),
    'дорожная карта ' + project.code));

  // Пояснение для ролей без права изменения
  const permissionCallout = mayEdit ? null
    : mayRequest
      ? h('div', { class: 'callout' },
          h('b', {}, 'Изменение записей закрыто для проектных менеджеров. '),
          'Данные фиксируются в момент создания. Чтобы исправить ошибку, отправьте заявку — администратор внесёт изменение, и оно будет записано в журнал аудита.')
      : h('div', { class: 'callout info' },
          h('b', {}, 'Режим просмотра. '),
          'Роль «Наблюдатель» даёт доступ ко всем данным и выгрузкам, но не позволяет изменять записи или комментировать.');

  const details = h('div', { class: 'card' },
    h('div', { class: 'card-head' }, h('h2', {}, 'Сведения о записи'), h('span', { class: 'mono muted' }, project.code)),
    h('div', { class: 'card-body' },
      h('dl', { class: 'def-list' },
        defItem('Тип записи', dictName(RECORD_TYPES, project.record_type)),
        defItem('Отрасль', dictName(SECTORS, project.sector_code)),
        defItem('Направление', AREA_LABELS[project.area]),
        defItem('Сумма', formatMoney(project.amount, project.currency)),
        defItem('Иностранный партнёр', company.id ? h('a', { href: '#/companies/' + company.id }, company.name) : company.name),
        defItem('Местные партнёры', (project.partners || []).length
          ? h('div', {}, project.partners.map((partner, index) =>
              h('div', { style: index ? { marginTop: '3px' } : null },
                h('a', { href: '#/companies/' + partner.company_id }, companyName(partner.company_id)),
                partner.role_note ? h('span', { class: 'muted small' }, ' — ' + partner.role_note) : null)))
          : h('span', { class: 'muted' }, 'не указаны')),
        defItem('Страна', countryName(project.iso2) + ' · ' + regionName(countryRegion(project.iso2))),
        defItem('Ответственный', userName(project.responsible_user_id)),
        defItem('Создана', formatDate(project.created_at) + ' — ' + userName(project.created_by)),
        defItem('Последняя активность', formatDate(project.last_activity_at))
      ),
      h('div', { class: 'hr' }),
      h('div', { class: 'form-section-title' }, 'Описание'),
      h('p', { class: 'mb-0' }, project.description),
      (project.locations || []).length ? frag(
        h('div', { class: 'form-section-title' }, 'Регионы реализации в Узбекистане'),
        !locationsAllowed(project.area)
          ? h('p', { class: 'small muted' }, 'Заполнено, когда запись относилась к инвестиционным проектам.')
          : null,
        h('div', { class: 'table-wrap' },
          h('table', { class: 'data' },
            h('thead', {}, h('tr', {}, h('th', {}, 'Регион'), h('th', {}, 'Город или район'), h('th', { class: 'num' }, 'Объём в регионе'))),
            h('tbody', {}, project.locations.map((location) =>
              h('tr', {},
                h('td', { class: 'strong' }, uzRegionName(location.region)),
                h('td', {}, location.locality),
                h('td', { class: 'num' }, location.amount
                  ? formatMoney(location.amount, project.currency)
                  : h('span', { class: 'muted' }, 'не распределён')))))))
      ) : null,
      contactsOf('project', project.id).length ? frag(
        h('div', { class: 'form-section-title' }, 'Контактные лица'),
        contactsOf('project', project.id).map((contact) =>
          h('div', { class: 'file-row' },
            h('span', { class: 'file-icon' }, initials(contact.full_name)),
            h('span', { style: { minWidth: '0' } },
              h('div', { class: 'file-name' }, contact.full_name),
              h('div', { class: 'file-meta' }, contact.position + ' · ' + contact.phone + ' · ' + contact.email)
            )
          )
        )
      ) : null
    )
  );

  // --- Дорожная карта ---
  const mayComplete = canOn(ui.user, 'step.complete', project);
  const roadmap = h('div', { class: 'card' },
    h('div', { class: 'card-head' },
      h('h2', {}, 'Дорожная карта'),
      h('span', { class: 'muted small' }, 'выполнено ' + progress.done + ' из ' + progress.total + ' — ' + progress.percent + '%'),
      can(ui.user, 'step.create') ? h('button', { class: 'btn btn-sm', onclick: () => openStepCreate(project) }, '+ Этап') : null
    ),
    h('div', { class: 'card-body' },
      steps.length ? frag(
        steps.map((step) => {
          const overdue = step.state !== 'done' && daysUntil(step.due_date) < 0;
          const days = daysUntil(step.due_date);
          return h('div', { class: 'step-row' },
            h('button', {
              class: 'step-check ' + (step.state === 'done' ? 'done' : ''),
              disabled: !mayComplete,
              title: mayComplete
                ? (step.state === 'done' ? 'Снять отметку о выполнении' : 'Отметить этап выполненным')
                : (can(ui.user, 'step.complete')
                    ? 'Этапы можно отмечать только по своим записям'
                    : 'Роль «Наблюдатель» не изменяет записи'),
              onclick: () => toggleStep(project, step),
            }, '✓'),
            h('div', { class: 'step-main' },
              h('div', { class: 'step-title ' + (step.state === 'done' ? 'done' : '') }, step.title),
              h('div', { class: 'step-meta' },
                h('span', {}, 'срок: ' + formatDate(step.due_date)),
                h('span', { style: overdue ? { color: 'var(--danger)', fontWeight: '600' } : null },
                  step.state === 'done'
                    ? 'выполнен ' + formatDate(step.done_at)
                    : overdue
                      ? 'просрочен на ' + Math.abs(days) + ' ' + plural(Math.abs(days), 'день', 'дня', 'дней')
                      : 'осталось ' + days + ' ' + plural(days, 'день', 'дня', 'дней')),
                h('span', {}, userName(step.responsible_user_id))
              )
            ),
            statusTag(STEP_STATE_LABELS[step.state],
              step.state === 'done' ? '#2e7d4f' : step.state === 'in_progress' ? '#1f4e9e' : '#6b7ba3')
          );
        }),
        h('div', { class: 'form-section-title' }, 'Сроки на шкале времени'),
        gantt(steps)
      ) : empty('Этапов пока нет', 'Добавьте этапы, чтобы отслеживать сроки.', '▤')
    )
  );

  // --- Лента комментариев ---
  const commentInput = h('textarea', { placeholder: 'Комментарий по проекту…', rows: 3 });
  const comments = h('div', { class: 'card' },
    h('div', { class: 'card-head' }, h('h2', {}, 'Лента комментариев')),
    h('div', { class: 'card-body' },
      can(ui.user, 'project.comment')
        ? frag(commentInput, h('div', { class: 'flex mt-1' },
            h('button', { class: 'btn btn-primary btn-sm', onclick: () => addComment(project, commentInput) }, 'Отправить'),
            h('span', { class: 'muted small' }, 'Комментарии доступны всем сотрудникам офиса.')))
        : h('div', { class: 'callout info' }, 'Роль «Наблюдатель» не оставляет комментарии.'),
      h('div', { class: 'mt-2' },
        commentsOf('project', project.id).length
          ? commentsOf('project', project.id).map((comment) =>
              h('div', { class: 'feed-item' },
                h('span', { class: 'avatar' }, initials(userName(comment.user_id))),
                h('div', { class: 'feed-body' },
                  h('div', { class: 'feed-head' },
                    h('span', { class: 'feed-author' }, userName(comment.user_id)),
                    h('span', { class: 'feed-time' }, formatDateTime(comment.created_at))
                  ),
                  h('div', { class: 'feed-text' }, comment.body)
                )
              )
            )
          : h('p', { class: 'muted mb-0' }, 'Комментариев пока нет.')
      )
    )
  );

  const meetingsCard = h('div', { class: 'card' },
    h('div', { class: 'card-head' }, h('h2', {}, 'Встречи по этому проекту')),
    relatedMeetings.length
      ? h('div', { class: 'card-body tight' },
          h('div', { class: 'table-wrap' },
            h('table', { class: 'data' },
              h('thead', {}, h('tr', {}, h('th', {}, 'Дата'), h('th', {}, 'Визит'), h('th', {}, 'Место'), h('th', {}, 'Статус'))),
              h('tbody', {}, relatedMeetings.map((meeting) =>
                h('tr', {},
                  h('td', { class: 'nowrap' }, formatDate(meeting.meet_date), h('div', { class: 't-sub' }, meeting.meet_time)),
                  h('td', {}, h('a', { href: '#/visits/' + meeting.visit_id }, visitById(meeting.visit_id).code), h('div', { class: 't-sub' }, countryName(visitById(meeting.visit_id).iso2))),
                  h('td', {}, meeting.venue),
                  h('td', {}, statusTag(dictName(MEETING_STATUSES, meeting.status_code), dictColor(MEETING_STATUSES, meeting.status_code)))
                )
              ))
            )
          )
        )
      : h('div', { class: 'card-body' }, h('p', { class: 'muted mb-0' }, 'Встречи по проекту не запланированы.'))
  );

  const historyCard = h('div', { class: 'card' },
    h('div', { class: 'card-head' }, h('h2', {}, 'История статусов')),
    h('div', { class: 'card-body' },
      history.map((entry) =>
        h('div', { class: 'attention-item' },
          h('span', { class: 'marker', style: { background: dictColor(PROJECT_STATUSES, entry.to_status) } }),
          h('span', { style: { minWidth: '0' } },
            h('div', { class: 'a-title' },
              entry.from_status ? dictName(PROJECT_STATUSES, entry.from_status) + ' → ' + dictName(PROJECT_STATUSES, entry.to_status) : dictName(PROJECT_STATUSES, entry.to_status)),
            h('div', { class: 'a-meta' }, entry.comment + ' · ' + userName(entry.user_id))
          ),
          h('span', { class: 'a-right' }, formatDate(entry.created_at))
        )
      )
    )
  );

  const requestsCard = requests.length ? h('div', { class: 'card' },
    h('div', { class: 'card-head' }, h('h2', {}, 'Заявки на исправление')),
    h('div', { class: 'card-body' },
      requests.map((request) =>
        h('div', { class: 'attention-item' },
          h('span', { class: 'marker', style: { background: request.status === 'pending' ? 'var(--warn)' : request.status === 'approved' ? 'var(--ok)' : 'var(--danger)' } }),
          h('span', { style: { minWidth: '0' } },
            h('div', { class: 'a-title' }, CORRECTION_STATUS[request.status]),
            h('div', { class: 'a-meta' }, request.reason)
          ),
          h('span', { class: 'a-right' }, userName(request.requested_by), h('div', {}, formatDate(request.created_at)))
        )
      ),
      h('div', { class: 'mt-1' }, h('a', { href: '#/corrections' }, 'Все заявки →'))
    )
  ) : null;

  return frag(
    h('div', { class: 'breadcrumbs' }, h('a', { href: '#/projects' }, 'Проекты и соглашения'), ' / ', project.code),
    h('div', { class: 'page-head' },
      h('div', { class: 'titles' },
        h('h1', {}, project.title),
        h('div', { class: 'subtitle' },
          dictName(RECORD_TYPES, project.record_type) + ' · ' + company.name + ' · ' + countryName(project.iso2) + ' · ' + formatMoney(project.amount, project.currency))
      ),
      h('div', { class: 'page-actions' }, actions)
    ),
    h('div', { class: 'pill-row mb-2' },
      statusTag(dictName(PROJECT_STATUSES, project.status_code), dictColor(PROJECT_STATUSES, project.status_code)),
      h('span', { class: 'tag tag-plain' }, dictName(SECTORS, project.sector_code)),
      h('span', { class: 'tag tag-plain' }, AREA_LABELS[project.area]),
      h('span', { class: 'tag tag-plain' }, 'Ответственный: ' + userName(project.responsible_user_id))
    ),
    permissionCallout,
    h('div', { class: 'split' },
      column(details, customFieldsCard('project', project), roadmap, comments),
      column(historyCard, meetingsCard, requestsCard)
    )
  );
}

const defItem = (label, value) => h('div', {}, h('dt', {}, label), h('dd', {}, value));

const notFound = (title) => frag(
  h('div', { class: 'card' }, h('div', { class: 'card-body' },
    empty(title, 'Возможно, запись была удалена.', '⧉'),

);

// --- Действия над проектом ---

function touchProject(project) {
  project.last_activity_at = new Date().toISOString().slice(0, 19).replace('T', ' ');
  project.updated_at = project.last_activity_at;
}

async function toggleStep(project, step) {
  if (!canOn(ui.user, 'step.complete', project)) {
    toastError(can(ui.user, 'step.complete')
      ? 'Действие доступно только по записям, за которые вы отвечаете.'
      : 'Роль «Наблюдатель» не изменяет записи.');
    return;
  }
  const wasDone = step.state === 'done';
  step.state = wasDone ? 'in_progress' : 'done';
  step.done_at = wasDone ? null : new Date().toISOString().slice(0, 19).replace('T', ' ');
  step.done_by = wasDone ? null : ui.user.id;
  touchProject(project);
  audit('update', 'step', step.id,
    (wasDone ? 'Снята отметка о выполнении этапа «' : 'Отмечено выполнение этапа «') + step.title + '» — ' + project.code,

}

function openProjectEdit(project) {
  const form = projectFormFields(project);
  const before = Object.assign({}, project);
  openModal({
    title: 'Изменение записи ' + project.code,
    body: form.body,
    footer: (close) => [
      h('button', { class: 'btn', onclick: close }, 'Отмена'),
      h('button', { class: 'btn btn-primary', onclick: async () => {
        const values = form.read();
        if (!values.title) { toastError('Укажите наименование записи.'); return; }
        const uzCheck = validateUzSide(values, values.company_id);
        if (uzCheck.error) { toastError(uzCheck.error); return; }
        const labels = {
          title: 'Наименование', description: 'Описание', company_id: 'Компания', record_type: 'Тип записи',
          sector_code: 'Отрасль', area: 'Направление', status_code: 'Статус', amount: 'Сумма',
          currency: 'Валюта', responsible_user_id: 'Ответственный',
        };
        const display = (key, value) => {
          if (key === 'company_id') return companyName(value);
          if (key === 'record_type') return dictName(RECORD_TYPES, value);
          if (key === 'sector_code') return dictName(SECTORS, value);
          if (key === 'area') return AREA_LABELS[value];
          if (key === 'status_code') return dictName(PROJECT_STATUSES, value);
          if (key === 'responsible_user_id') return userName(value);
          if (key === 'amount') return formatNumber(value);
          return String(value);
        };
        const changes = [];
        Object.keys(values).forEach((key) => {
          if (key === 'customValues') return;
          if (String(before[key]) !== String(values[key])) {
            changes.push({ label: labels[key], from: display(key, before[key]), to: display(key, values[key]) });
          }
        });
        diffCustom('project', before.customValues || {}, values.customValues || {}).forEach((c) => changes.push(c));
        const partnersText = (list) => (list || []).map((p) => companyName(p.company_id) + (p.role_note ? ' (' + p.role_note + ')' : '')).join('; ') || '(нет)';
        const locationsText = (list) => (list || []).map((l) => uzRegionName(l.region) + ' — ' + l.locality + (l.amount ? ', ' + formatNumber(l.amount) : '')).join('; ') || '(нет)';
        if (partnersText(before.partners) !== partnersText(values.partners)) {
          changes.push({ label: 'Местные партнёры', from: partnersText(before.partners), to: partnersText(values.partners) });
        }
        if (locationsText(before.locations) !== locationsText(values.locations)) {
          changes.push({ label: 'Регионы реализации', from: locationsText(before.locations), to: locationsText(values.locations) });
        }
        if (!changes.length) { toastError('Изменений нет.'); return; }
        Object.assign(project, values);
        const picked = companyById(values.company_id);
        if (picked) project.iso2 = picked.iso2;
        touchProject(project);
        if (before.status_code !== values.status_code) {
          state.statusHistory.push({
            id: ++state.seq.history, project_id: project.id, from_status: before.status_code, to_status: values.status_code,
            comment: 'Изменение записи администратором', user_id: ui.user.id,
            created_at: new Date().toISOString().slice(0, 19).replace('T', ' '),
          });
        }
        audit('update', 'project', project.id, 'Изменена запись ' + project.code, changes);
        close();
        (uzCheck.warnings || []).forEach((w) => toast(w, { type: 'error', title: 'Обратите внимание', timeout: 8000 }));
        await persist('Запись обновлена: изменено полей — ' + changes.length + '.');
      } }, 'Сохранить'),
    ],
  });
}

// ==========================================================================
//  13. Заявки на исправление (п. 2.3 ТЗ)
// ==========================================================================

const CORRECTION_STATUS = { pending: 'На рассмотрении', approved: 'Одобрена', rejected: 'Отклонена' };
const ENTITY_LABELS = { project: 'Проект', company: 'Компания', visit: 'Визит', meeting: 'Встреча', step: 'Этап' };
const ENTITY_ROUTES = { project: 'projects', company: 'companies', visit: 'visits', meeting: 'visits', step: 'projects' };

/** Поля, исправление которых можно предложить в заявке. */
const CORRECTABLE = {
  project: [
    { key: 'title', label: 'Наименование', type: 'text' },
    { key: 'amount', label: 'Сумма', type: 'number' },
    { key: 'currency', label: 'Валюта', type: 'select', options: () => currencyOptions() },
    { key: 'description', label: 'Описание', type: 'textarea' },
    { key: 'sector_code', label: 'Отрасль', type: 'select', options: () => SECTORS.map((s) => ({ value: s.code, label: s.name })) },
    { key: 'area', label: 'Направление', type: 'select', options: () => [{ value: 'export', label: 'Экспорт' }, { value: 'investment', label: 'Инвестиции' }] },
  ],
  company: [
    { key: 'name', label: 'Наименование', type: 'text' },
    { key: 'city', label: 'Город', type: 'text' },
    { key: 'industry', label: 'Отрасль деятельности', type: 'text' },
    { key: 'website', label: 'Сайт', type: 'text' },
    { key: 'profile', label: 'Профиль компании', type: 'textarea' },
  ],
  visit: [
    { key: 'cities', label: 'Города', type: 'text' },
    { key: 'goal', label: 'Цель визита', type: 'textarea' },
    { key: 'date_from', label: 'Дата начала', type: 'date' },
    { key: 'date_to', label: 'Дата окончания', type: 'date' },
  ],
};

function openCorrectionForm(entityType, entityId, entityLabel, record) {
  if (!can(ui.user, 'correction.request')) {
    toastError('Заявки на исправление подают проектные менеджеры.');
    return;
  }
  const fields = CORRECTABLE[entityType];
  const fieldSelect = select(fields.map((f) => ({ value: f.key, label: f.label })), { value: fields[0].key });
  const valueSlot = h('div', {});
  const reasonInput = h('textarea', { rows: 3, placeholder: 'Например: при создании записи ошибочно указана сумма — опечатка в порядке цифр.' });
  let currentControl = null;

  const buildControl = () => {
    const definition = fields.find((f) => f.key === fieldSelect.value);
    const current = record[definition.key];
    if (definition.type === 'select') currentControl = select(definition.options(), { value: current });
    else if (definition.type === 'textarea') currentControl = h('textarea', { rows: 3 }, String(current || ''));
    else currentControl = h('input', { type: definition.type === 'number' ? 'number' : definition.type === 'date' ? 'date' : 'text', value: current === null || current === undefined ? '' : String(current) });
    setChildren(valueSlot,
      h('div', { class: 'callout info' }, h('b', {}, 'Текущее значение: '), String(current === '' || current === null ? '(пусто)' : current)),
      field('Предлагаемое значение', currentControl, { required: true })
    );
  };
  fieldSelect.addEventListener('change', buildControl);
  buildControl();

  openModal({
    title: 'Заявка на исправление',
    body: frag(
      h('div', { class: 'callout' },
        'Проектный менеджер не изменяет записи напрямую. Опишите ошибку — администратор рассмотрит заявку, ',
        'внесёт исправление и оно будет зафиксировано в журнале аудита.'),
      h('div', { class: 'def-list mb-2' }, defItem('Запись', entityLabel), defItem('Тип', ENTITY_LABELS[entityType])),
      field('Какое поле исправить', fieldSelect, { required: true }),
      valueSlot,
      field('Причина исправления', reasonInput, { required: true })
    ),
    footer: (close) => [
      h('button', { class: 'btn', onclick: close }, 'Отмена'),
      h('button', { class: 'btn btn-primary', onclick: async () => {
        const reason = reasonInput.value.trim();
        if (!reason) { toastError('Опишите причину исправления.'); return; }
        const definition = fields.find((f) => f.key === fieldSelect.value);
        let value = currentControl.value;
        if (definition.type === 'number') value = Number(value) || 0;
        if (String(value) === String(record[definition.key])) { toastError('Предлагаемое значение совпадает с текущим.'); return; }
        const proposed = {};
        proposed[definition.key] = value;
        const request = {
          id: ++state.seq.correction, entity_type: entityType, entity_id: entityId, entity_label: entityLabel,
          requested_by: ui.user.id, reason: reason, proposed: proposed, status: 'pending',
          created_at: new Date().toISOString().slice(0, 19).replace('T', ' '),
          decided_by: null, decided_at: null, decision_note: '',
        };
        state.corrections.push(request);
        audit('create', 'correction', request.id, 'Создана заявка на исправление: ' + entityLabel + ' — поле «' + definition.label + '»', []);
        close();
        await persist('Заявка отправлена администратору. Следить за ней можно в разделе «Заявки на исправление».');
      } }, 'Отправить заявку'),
    ],
  });
}

function fieldLabelFor(entityType, key) {
  const definition = (CORRECTABLE[entityType] || []).find((f) => f.key === key);
  return definition ? definition.label : key;
}

function correctionTarget(request) {
  if (request.entity_type === 'project') return projectById(request.entity_id);
  if (request.entity_type === 'company') return companyById(request.entity_id);
  if (request.entity_type === 'visit') return visitById(request.entity_id);
  return null;
}

function decideCorrection(request, approve) {
  const target = correctionTarget(request);
  if (approve && !target) { toastError('Запись, к которой относится заявка, больше не существует.'); return; }
  const noteInput = h('textarea', { rows: 2, placeholder: approve ? 'Комментарий к решению (необязательно)' : 'Причина отказа' });
  const changes = approve && target
    ? Object.keys(request.proposed).map((key) => ({
        label: fieldLabelFor(request.entity_type, key),
        from: String(target[key]), to: String(request.proposed[key]),
      }))
    : [];

  openModal({
    title: approve ? 'Одобрить заявку' : 'Отклонить заявку',
    size: 'narrow',
    body: frag(
      h('div', { class: 'def-list mb-2' },
        defItem('Запись', request.entity_label),
        defItem('Автор заявки', userName(request.requested_by))
      ),
      h('div', { class: 'callout' }, h('b', {}, 'Причина: '), request.reason),
      approve
        ? h('div', { class: 'callout ok' },
            h('b', {}, 'Будет применено: '),
            changes.map((change) => h('div', { class: 'audit-change' },
              h('b', {}, change.label + ': '),
              h('span', { class: 'from' }, change.from),
              ' → ',
              h('span', { class: 'to' }, change.to)))
          )
        : null,
      field(approve ? 'Комментарий' : 'Причина отказа', noteInput, { required: !approve })
    ),
    footer: (close) => [
      h('button', { class: 'btn', onclick: close }, 'Отмена'),
      h('button', { class: 'btn ' + (approve ? 'btn-primary' : 'btn-danger'), onclick: async () => {
        if (!approve && !noteInput.value.trim()) { toastError('Укажите причину отказа.'); return; }
        request.status = approve ? 'approved' : 'rejected';
        request.decided_by = ui.user.id;
        request.decided_at = new Date().toISOString().slice(0, 19).replace('T', ' ');
        request.decision_note = noteInput.value.trim();
        if (approve) {
          Object.assign(target, request.proposed);
          if (request.entity_type === 'project') touchProject(target);
          audit('update', request.entity_type, request.entity_id,
            'Исправление по заявке №' + request.id + ' — ' + request.entity_label, changes);
        }
        audit(approve ? 'update' : 'update', 'correction', request.id,
          'Заявка №' + request.id + ' ' + (approve ? 'одобрена' : 'отклонена'), []);
        close();
        await persist(approve ? 'Заявка одобрена, изменение внесено и записано в журнал аудита.' : 'Заявка отклонена.');
      } }, approve ? 'Одобрить и применить' : 'Отклонить'),
    ],
  });
}

function renderCorrections(query) {
  let rows = state.corrections.slice().sort((a, b) => (a.created_at < b.created_at ? 1 : -1));
  if (ui.user.role === 'team') rows = rows.filter((r) => r.requested_by === ui.user.id);
  if (query.status) rows = rows.filter((r) => r.status === query.status);

  const chips = h('div', { class: 'filter-chips' },

function companyFormFields(company) {
  const customCompany = customFieldControls('company', (company && company.customValues) || {});
  const values = company || { name: '', iso2: 'DE', city: '', industry: '', website: '', profile: '', responsible_user_id: ui.user.id };
  const controls = {
    name: h('input', { type: 'text', value: values.name }),
    country: select(countryOptions(), { value: values.iso2 }),
    city: h('input', { type: 'text', value: values.city }),
    industry: h('input', { type: 'text', value: values.industry }),
    website: h('input', { type: 'url', value: values.website, placeholder: 'https://' }),
    profile: h('textarea', { rows: 3 }, values.profile),
    responsible: select(state.users.filter((u) => u.role !== 'viewer').map((u) => ({ value: u.id, label: u.full_name })), { value: values.responsible_user_id }),
  };
  return {
    body: frag(
      field('Наименование компании', controls.name, { required: true }),
      h('div', { class: 'form-row' }, field('Страна', controls.country, { required: true }), field('Город', controls.city)),
      h('div', { class: 'form-row' }, field('Отрасль деятельности', controls.industry), field('Сайт', controls.website)),
      field('Профиль компании', controls.profile),
      field('Ответственный', controls.responsible, { required: true }),
      customCompany.body
    ),
    read: () => ({
      name: controls.name.value.trim(), iso2: controls.country.value, city: controls.city.value.trim(),
      industry: controls.industry.value.trim(), website: controls.website.value.trim(),
      profile: controls.profile.value.trim(), responsible_user_id: Number(controls.responsible.value),
      customValues: customCompany.read(),
    }),
  };
}

function openCompanyCreate() {
  const form = companyFormFields(null);
  openModal({
    title: 'Новая компания',
    body: form.body,
    footer: (close) => [
      h('button', { class: 'btn', onclick: close }, 'Отмена'),
      h('button', { class: 'btn btn-primary', onclick: async () => {
        const values = form.read();
        if (!values.name) { toastError('Укажите наименование компании.'); return; }
        const id = ++state.seq.company;
        const now = new Date().toISOString().slice(0, 19).replace('T', ' ');
        state.companies.push(Object.assign({ id: id, code: 'CMP-' + String(id).padStart(4, '0'), created_by: ui.user.id, created_at: now, updated_at: now }, values));
        audit('create', 'company', id, 'Создана компания «' + values.name + '»', []);
        close();
        nav('#/companies/' + id);
        await persist('Компания добавлена в справочник.');
      } }, 'Создать'),
    ],
  });
}

function openCompanyEdit(company) {
  const form = companyFormFields(company);
  const before = Object.assign({}, company);
  openModal({
    title: 'Изменение компании',
    body: form.body,
    footer: (close) => [
      h('button', { class: 'btn', onclick: close }, 'Отмена'),
      h('button', { class: 'btn btn-primary', onclick: async () => {
        const values = form.read();
        if (!values.name) { toastError('Укажите наименование компании.'); return; }
        const labels = { name: 'Наименование', iso2: 'Страна', city: 'Город', industry: 'Отрасль', website: 'Сайт', profile: 'Профиль', responsible_user_id: 'Ответственный' };
        const changes = [];
        Object.keys(values).forEach((key) => {
          if (key === 'customValues') return;
          if (String(before[key]) !== String(values[key])) {
            changes.push({ label: labels[key], from: key === 'responsible_user_id' ? userName(before[key]) : String(before[key] || '(пусто)'), to: key === 'responsible_user_id' ? userName(values[key]) : String(values[key] || '(пусто)') });
          }
        });
        diffCustom('company', before.customValues || {}, values.customValues || {}).forEach((c) => changes.push(c));
        if (!changes.length) { toastError('Изменений нет.'); return; }
        Object.assign(company, values);
        company.updated_at = new Date().toISOString().slice(0, 19).replace('T', ' ');
        audit('update', 'company', company.id, 'Изменена компания «' + company.name + '»', changes);
        close();
        await persist('Данные компании обновлены.');
      } }, 'Сохранить'),
    ],
  });
}

function renderVisits(query) {
  let rows = state.visits.slice().sort((a, b) => (a.date_from < b.date_from ? 1 : -1));
  if (query.status) rows = rows.filter((v) => v.status_code === query.status);
  if (query.direction) rows = rows.filter((v) => v.direction === query.direction);
  if (query.mine === '1') rows = rows.filter((v) => v.responsible_user_id === ui.user.id);

  const chips = h('div', { class: 'filter-chips' },
    h('button', { class: 'chip ' + (!query.status && !query.direction && !query.mine ? 'active' : ''), onclick: () => go('/visits', {}) }, 'Все визиты'),
    h('button', { class: 'chip ' + (query.direction === 'outbound' ? 'active' : ''), onclick: () => go('/visits', { direction: 'outbound' }) }, 'Выездные'),
    h('button', { class: 'chip ' + (query.direction === 'inbound' ? 'active' : ''), onclick: () => go('/visits', { direction: 'inbound' }) }, 'Приём делегаций'),
    h('button', { class: 'chip ' + (query.mine === '1' ? 'active' : ''), onclick: () => go('/visits', { mine: '1' }) }, 'Мои визиты')
  );

  return frag(
    h('div', { class: 'page-head' },
      h('div', { class: 'titles' },
        h('h1', {}, 'Визиты и встречи'),
        h('div', { class: 'subtitle' }, 'Поездки делегаций, приём партнёров и программа встреч по дням')
      ),
      h('div', { class: 'page-actions' },
        exportButton('Выгрузить в CSV', 'visits.csv',
          ['Код', 'Направление', 'Страна', 'Города', 'С', 'По', 'Статус', 'Ответственный', 'Цель', 'Встреч', 'Из них уточняется', 'Итоги'],
          () => rows.map((v) => {
            const meetings = meetingsOfVisit(v.id);
            return [v.code, DIRECTION_LABELS[v.direction], countryName(v.iso2), v.cities, v.date_from, v.date_to,
              dictName(VISIT_STATUSES, v.status_code), userName(v.responsible_user_id), v.goal,
              meetings.length, meetings.filter((m) => m.status_code === 'tbc').length, v.outcome];
          }), 'реестр визитов'),
        can(ui.user, 'visit.create')
          ? h('button', { class: 'btn btn-primary', onclick: openVisitCreate }, '+ Новый визит')
          : permNote('Планирование визитов недоступно наблюдателю')
      )
    ),
    chips,
    h('div', { class: 'grid grid-2' },
      rows.map((visit) => {
        const meetings = meetingsOfVisit(visit.id);
        const tbc = meetings.filter((m) => m.status_code === 'tbc').length;
        const days = daysUntil(visit.date_from);
        return h('div', { class: 'card' },
          h('div', { class: 'card-head' },
            h('h2', {}, h('a', { href: '#/visits/' + visit.id }, countryName(visit.iso2) + ' — ' + visit.cities)),
            statusTag(dictName(VISIT_STATUSES, visit.status_code), dictColor(VISIT_STATUSES, visit.status_code))
          ),
          h('div', { class: 'card-body' },
            h('div', { class: 'pill-row mb-1' },
              h('span', { class: 'tag tag-plain' }, DIRECTION_LABELS[visit.direction]),
              h('span', { class: 'tag tag-plain mono' }, visit.code),
              days >= 0 && ['completed', 'cancelled'].indexOf(visit.status_code) === -1
                ? h('span', { class: 'tag tag-indigo' }, 'через ' + days + ' ' + plural(days, 'день', 'дня', 'дней'))
                : null,
              tbc ? h('span', { class: 'tag tag-warn' }, 'уточняется встреч: ' + tbc) : null
            ),
            h('p', { class: 'small muted' }, formatDate(visit.date_from) + ' — ' + formatDate(visit.date_to) + ' · ' + userName(visit.responsible_user_id)),
            h('p', { class: 'mb-0' }, visit.goal),
            h('div', { class: 'hr' }),
            h('div', { class: 'flex-between' },
              h('span', { class: 'small muted' }, 'встреч в программе: ' + meetings.length),
              h('a', { class: 'btn btn-sm', href: '#/visits/' + visit.id }, 'Программа →')
            )
          )
        );
