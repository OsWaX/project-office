function openCompanyCreate() {
  const form = companyFormFields(null);
  openModal({
    title: 'Новая компания',
    body: form.body,
    footer: (close) => [
      h('button', { class: 'btn', onclick: close }, 'Отмена'),
      h('button', { class: 'btn btn-primary', onclick: () => {
        const values = form.read();
        if (!values.name) { toastError('Укажите наименование компании.'); return; }
        const id = ++db.seq.company;
        const now = new Date().toISOString().slice(0, 19).replace('T', ' ');
        db.companies.push(Object.assign({ id: id, code: 'CMP-' + String(id).padStart(4, '0'), created_by: state.user.id, created_at: now, updated_at: now }, values));
        audit('create', 'company', id, 'Создана компания «' + values.name + '»', []);
        close();
        toastOk('Компания добавлена в справочник.');
        location.hash = '#/companies/' + id;
      } }, 'Создать'),
    ],
  });
}

function openCompanyEdit(company) {
  const form = companyFormFields(company);
  const before = Object.assign({}, company);
  openModal({
    title: 'Изменение компании',
    body: form.body,
    footer: (close) => [
      h('button', { class: 'btn', onclick: close }, 'Отмена'),
      h('button', { class: 'btn btn-primary', onclick: () => {
        const values = form.read();
        if (!values.name) { toastError('Укажите наименование компании.'); return; }
        const labels = { name: 'Наименование', iso2: 'Страна', city: 'Город', industry: 'Отрасль', website: 'Сайт', profile: 'Профиль', responsible_user_id: 'Ответственный' };
        const changes = [];
        Object.keys(values).forEach((key) => {
          if (String(before[key]) !== String(values[key])) {
            changes.push({ label: labels[key], from: key === 'responsible_user_id' ? userName(before[key]) : String(before[key] || '(пусто)'), to: key === 'responsible_user_id' ? userName(values[key]) : String(values[key] || '(пусто)') });
          }
        });
        if (!changes.length) { toastError('Изменений нет.'); return; }
        Object.assign(company, values);
        company.updated_at = new Date().toISOString().slice(0, 19).replace('T', ' ');
        audit('update', 'company', company.id, 'Изменена компания «' + company.name + '»', changes);
        close();
        toastOk('Данные компании обновлены.');
        render();
      } }, 'Сохранить'),
    ],
  });
}

function renderVisits(query) {
  let rows = db.visits.slice().sort((a, b) => (a.date_from < b.date_from ? 1 : -1));
  if (query.status) rows = rows.filter((v) => v.status_code === query.status);
  if (query.direction) rows = rows.filter((v) => v.direction === query.direction);
  if (query.mine === '1') rows = rows.filter((v) => v.responsible_user_id === state.user.id);

  const chips = h('div', { class: 'filter-chips' },
    h('button', { class: 'chip ' + (!query.status && !query.direction && !query.mine ? 'active' : ''), onclick: () => go('/visits', {}) }, 'Все визиты'),
    h('button', { class: 'chip ' + (query.direction === 'outbound' ? 'active' : ''), onclick: () => go('/visits', { direction: 'outbound' }) }, 'Выездные'),
    h('button', { class: 'chip ' + (query.direction === 'inbound' ? 'active' : ''), onclick: () => go('/visits', { direction: 'inbound' }) }, 'Приём делегаций'),
    h('button', { class: 'chip ' + (query.mine === '1' ? 'active' : ''), onclick: () => go('/visits', { mine: '1' }) }, 'Мои визиты')
  );

  return frag(
    h('div', { class: 'page-head' },
      h('div', { class: 'titles' },
        h('h1', {}, 'Визиты и встречи'),
        h('div', { class: 'subtitle' }, 'Поездки делегаций, приём партнёров и программа встреч по дням')
      ),
      h('div', { class: 'page-actions' },
        exportButton('Выгрузить в CSV', 'visits.csv',
          ['Код', 'Направление', 'Страна', 'Города', 'С', 'По', 'Статус', 'Ответственный', 'Цель', 'Встреч', 'Из них уточняется', 'Итоги'],
          () => rows.map((v) => {
            const meetings = meetingsOfVisit(v.id);
            return [v.code, DIRECTION_LABELS[v.direction], countryName(v.iso2), v.cities, v.date_from, v.date_to,
              dictName(VISIT_STATUSES, v.status_code), userName(v.responsible_user_id), v.goal,
              meetings.length, meetings.filter((m) => m.status_code === 'tbc').length, v.outcome];
          }), 'реестр визитов'),
        can(state.user, 'visit.create')
          ? h('button', { class: 'btn btn-primary', onclick: openVisitCreate }, '+ Новый визит')
          : permNote('Планирование визитов недоступно наблюдателю')
      )
    ),
    chips,
    h('div', { class: 'grid grid-2' },
      rows.map((visit) => {
        const meetings = meetingsOfVisit(visit.id);
        const tbc = meetings.filter((m) => m.status_code === 'tbc').length;
        const days = daysUntil(visit.date_from);
        return h('div', { class: 'card' },
          h('div', { class: 'card-head' },
            h('h2', {}, h('a', { href: '#/visits/' + visit.id }, countryName(visit.iso2) + ' — ' + visit.cities)),
            statusTag(dictName(VISIT_STATUSES, visit.status_code), dictColor(VISIT_STATUSES, visit.status_code))
          ),
          h('div', { class: 'card-body' },
            h('div', { class: 'pill-row mb-1' },
              h('span', { class: 'tag tag-plain' }, DIRECTION_LABELS[visit.direction]),
              h('span', { class: 'tag tag-plain mono' }, visit.code),
              days >= 0 && ['completed', 'cancelled'].indexOf(visit.status_code) === -1
                ? h('span', { class: 'tag tag-indigo' }, 'через ' + days + ' ' + plural(days, 'день', 'дня', 'дней'))
                : null,
              tbc ? h('span', { class: 'tag tag-warn' }, 'уточняется встреч: ' + tbc) : null
            ),
            h('p', { class: 'small muted' }, formatDate(visit.date_from) + ' — ' + formatDate(visit.date_to) + ' · ' + userName(visit.responsible_user_id)),
            h('p', { class: 'mb-0' }, visit.goal),
            h('div', { class: 'hr' }),
            h('div', { class: 'flex-between' },
              h('span', { class: 'small muted' }, 'встреч в программе: ' + meetings.length),
              h('a', { class: 'btn btn-sm', href: '#/visits/' + visit.id }, 'Программа →')
            )
          )
        );
      }),
      rows.length ? null : h('div', { class: 'card' }, h('div', { class: 'card-body' }, empty('Визитов не найдено', 'Измените условия фильтрации.', '✈')))
    )
  );
}

function renderVisit(id) {
  const visit = visitById(id);
  if (!visit) return notFound('Визит не найден');
  const meetings = meetingsOfVisit(visit.id).sort((a, b) =>
    a.meet_date === b.meet_date ? (a.meet_time < b.meet_time ? -1 : 1) : (a.meet_date < b.meet_date ? -1 : 1));
  const members = membersOfVisit(visit.id);
  const mayEditMeetings = canOn(state.user, 'meeting.status_change', visit);

  const actions = [];
  if (can(state.user, 'visit.edit')) actions.push(h('button', { class: 'btn btn-primary', onclick: () => openVisitEdit(visit) }, '✎ Изменить'));
  else if (can(state.user, 'correction.request')) actions.push(h('button', { class: 'btn btn-primary', onclick: () => openCorrectionForm('visit', visit.id, countryName(visit.iso2) + ' — ' + visit.cities, visit) }, '✎ Запросить исправление'));
  if (canOn(state.user, 'meeting.create', visit)) actions.push(h('button', { class: 'btn', onclick: () => openMeetingCreate(visit) }, '+ Встреча'));
  actions.push(exportButton('Программа в CSV', 'agenda-' + visit.code + '.csv',
    ['Дата', 'Время', 'Собеседник', 'Место', 'Статус', 'Участники', 'Примечания'],
    () => meetings.map((m) => [m.meet_date, m.meet_time, m.company_name, m.venue, dictName(MEETING_STATUSES, m.status_code), m.participants, m.notes]),
    'программа визита ' + visit.code));

  // Программа встреч, сгруппированная по дням
  const byDay = {};
  meetings.forEach((meeting) => {
    if (!byDay[meeting.meet_date]) byDay[meeting.meet_date] = [];
    byDay[meeting.meet_date].push(meeting);
  });
  const days = Object.keys(byDay).sort();

  const agenda = h('div', { class: 'card' },
    h('div', { class: 'card-head' },
      h('h2', {}, 'Программа встреч'),
      h('span', { class: 'muted small' }, 'встреч: ' + meetings.length + ' · дней: ' + days.length)
    ),
    h('div', { class: 'card-body' },
      days.length
        ? days.map((date) =>
            h('div', { class: 'agenda-day' },
              h('div', { class: 'agenda-date' }, formatDate(date, { long: true }) + ' — ' + WEEKDAYS_SHORT[(new Date(date + 'T00:00:00').getDay() + 6) % 7]),
              byDay[date].map((meeting) =>
                h('div', { class: 'agenda-item' },
                  h('div', { class: 'agenda-time' }, meeting.meet_time || '—'),
                  h('div', { class: 'agenda-body' },
                    h('div', { class: 'agenda-title' },
                      meeting.company_id ? h('a', { href: '#/companies/' + meeting.company_id }, meeting.company_name) : meeting.company_name),
                    h('div', { class: 'agenda-meta' },
                      h('span', {}, meeting.venue || 'место уточняется'),
                      meeting.participants ? h('span', {}, 'участники: ' + meeting.participants) : null,
                      meeting.project_id ? h('a', { href: '#/projects/' + meeting.project_id }, projectById(meeting.project_id) ? projectById(meeting.project_id).code : '') : null,
                      statusTag(dictName(MEETING_STATUSES, meeting.status_code), dictColor(MEETING_STATUSES, meeting.status_code)),
                      mayEditMeetings
                        ? h('button', { class: 'btn btn-sm btn-ghost', onclick: () => openMeetingStatus(visit, meeting) }, 'Статус')
                        : null
                    ),
                    meeting.notes ? h('div', { class: 'small muted mt-1' }, meeting.notes) : null
                  )
                )
              )
            )
          )
        : empty('Программа пуста', 'Добавьте встречи, чтобы составить программу визита.', '✈')
    )
  );

  return frag(
    h('div', { class: 'breadcrumbs' }, h('a', { href: '#/visits' }, 'Визиты и встречи'), ' / ', visit.code),
    h('div', { class: 'page-head' },
      h('div', { class: 'titles' },
        h('h1', {}, countryName(visit.iso2) + ' — ' + visit.cities),
        h('div', { class: 'subtitle' }, DIRECTION_LABELS[visit.direction] + ' · ' + formatDate(visit.date_from) + ' — ' + formatDate(visit.date_to) + ' · ' + userName(visit.responsible_user_id))
      ),
      h('div', { class: 'page-actions' }, actions)
    ),
    h('div', { class: 'pill-row mb-2' },
      statusTag(dictName(VISIT_STATUSES, visit.status_code), dictColor(VISIT_STATUSES, visit.status_code)),
      h('span', { class: 'tag tag-plain mono' }, visit.code),
      h('span', { class: 'tag tag-plain' }, regionName(countryRegion(visit.iso2)))
    ),
    h('div', { class: 'split' },
      column(agenda),
      column(
        h('div', { class: 'card' },
          h('div', { class: 'card-head' }, h('h2', {}, 'Цель визита')),
          h('div', { class: 'card-body' },
            h('p', { class: visit.outcome ? '' : 'mb-0' }, visit.goal),
            visit.outcome ? frag(h('div', { class: 'form-section-title' }, 'Итоги'), h('p', { class: 'mb-0' }, visit.outcome)) : null
          )
        ),
        h('div', { class: 'card' },
          h('div', { class: 'card-head' }, h('h2', {}, 'Состав делегации'), h('span', { class: 'muted small' }, 'человек: ' + members.length)),
          h('div', { class: 'card-body' },
            members.map((member) =>
              h('div', { class: 'file-row' },
                h('span', { class: 'file-icon' }, initials(member.full_name)),
                h('span', { style: { minWidth: '0' } },
                  h('div', { class: 'file-name' }, member.full_name),
                  h('div', { class: 'file-meta' }, member.position),
                  h('div', { class: 'file-meta' }, member.organization)
                )
              )
            )
          )
        ),
        h('div', { class: 'card' },
          h('div', { class: 'card-head' }, h('h2', {}, 'Сводка по встречам')),
          h('div', { class: 'card-body' },
            barList(MEETING_STATUSES.map((status) => ({
              key: status.code, label: status.name, color: status.color,
              count: meetings.filter((m) => m.status_code === status.code).length,
            })).filter((row) => row.count), { showAmount: false })
          )

      )

  );

function renderKanban(query) {
  let projects = db.projects.slice();
  if (query.mine === '1') projects = projects.filter((p) => p.responsible_user_id === state.user.id);
  if (query.sector) projects = projects.filter((p) => p.sector_code === query.sector);

  const columns = PROJECT_STATUSES.map((status) => ({
    status: status,
    items: projects.filter((p) => p.status_code === status.code),
  }));

  const mayMove = can(state.user, 'project.status_change');
  let dragged = null;

  const board = h('div', { class: 'kanban' },
    columns.map((columnData) => {
      const cards = h('div', { class: 'kanban-cards' },
        columnData.items.map((project) => {
          const movable = canOn(state.user, 'project.status_change', project);
          const progress = projectProgress(project.id);
          const overdue = stepsOf(project.id).some((s) => s.state !== 'done' && daysUntil(s.due_date) < 0);
          const card = h('div', {
            class: 'kanban-card',
            draggable: movable ? 'true' : null,
            style: movable ? null : { cursor: 'default' },
            title: movable ? 'Перетащите, чтобы изменить статус' : 'Статус меняет ответственный за запись или администратор',
          },
            h('div', { class: 'kc-code' }, project.code, movable ? null : ' 🔒'),
            h('div', { class: 'kc-title' }, h('a', { href: '#/projects/' + project.id, style: { color: 'inherit' } }, project.title)),
            h('div', { class: 'kc-meta' },
              h('span', {}, companyById(project.company_id).name),
              h('span', {}, formatMoney(project.amount, project.currency, { compact: true }))
            ),
            h('div', { class: 'progress mt-1' }, h('span', { style: { width: progress.percent + '%', background: overdue ? 'var(--danger)' : 'var(--ok)' } })),
            h('div', { class: 'kc-meta mt-1' },
              h('span', {}, userName(project.responsible_user_id)),
              overdue ? h('span', { style: { color: 'var(--danger)', fontWeight: '600' } }, 'просрочка') : null
            )
          );
          if (movable) {
            card.addEventListener('dragstart', (event) => {
              dragged = project;
              card.classList.add('dragging');
              if (event.dataTransfer) {
                event.dataTransfer.effectAllowed = 'move';
                try { event.dataTransfer.setData('text/plain', project.code); } catch (e) { /* старые браузеры */ }
              }
            });
            card.addEventListener('dragend', () => { dragged = null; card.classList.remove('dragging'); });
          }
          return card;
        })
      );

      const column = h('div', { class: 'kanban-col' },
        h('div', { class: 'kanban-col-head' },
          h('span', { class: 'dot', style: { width: '8px', height: '8px', borderRadius: '50%', background: columnData.status.color, display: 'inline-block' } }),
          h('span', {}, columnData.status.name),
          h('span', { class: 'count' }, String(columnData.items.length))
        ),
        cards
      );

      column.addEventListener('dragover', (event) => {
        if (!dragged) return;
        event.preventDefault();
        event.dataTransfer.dropEffect = 'move';
        column.classList.add('drag-over');
      });
      column.addEventListener('dragleave', () => column.classList.remove('drag-over'));
      column.addEventListener('drop', (event) => {
        event.preventDefault();
        column.classList.remove('drag-over');
        if (!dragged) return;
        const project = dragged;
        dragged = null;
        if (project.status_code === columnData.status.code) return;
        if (!canOn(state.user, 'project.status_change', project)) {
          toastError('Статус можно менять только по своим записям.');
          return;
        }
        const from = project.status_code;
        project.status_code = columnData.status.code;
        touchProject(project);
        db.statusHistory.push({
          id: ++db.seq.history, project_id: project.id, from_status: from, to_status: columnData.status.code,
          comment: 'Перенос на доске проектов', user_id: state.user.id,
          created_at: new Date().toISOString().slice(0, 19).replace('T', ' '),
        });
        audit('status_change', 'project', project.id, 'Статус записи ' + project.code + ' изменён на доске проектов',
          [{ label: 'Статус', from: dictName(PROJECT_STATUSES, from), to: columnData.status.name }]);
        toastOk(project.code + ': статус — «' + columnData.status.name + '».');
        render();
      });
      return column;
    })
  );

  return frag(
    h('div', { class: 'page-head' },
      h('div', { class: 'titles' },
        h('h1', {}, 'Доска проектов'),
        h('div', { class: 'subtitle' }, mayMove
          ? 'Перетащите карточку в другую колонку, чтобы изменить статус записи'
          : 'Роль «Наблюдатель» видит доску, но не переносит карточки')
      )
    ),
    h('div', { class: 'filter-chips' },
      h('button', { class: 'chip ' + (!query.mine && !query.sector ? 'active' : ''), onclick: () => go('/kanban', {}) }, 'Все записи'),
      h('button', { class: 'chip ' + (query.mine === '1' ? 'active' : ''), onclick: () => go('/kanban', Object.assign({}, query, { mine: query.mine === '1' ? undefined : '1' })) }, 'Мои проекты'),
      SECTORS.map((sector) =>
        h('button', { class: 'chip ' + (query.sector === sector.code ? 'active' : ''), onclick: () => go('/kanban', Object.assign({}, query, { sector: query.sector === sector.code ? undefined : sector.code })) }, sector.name))
    ),
    state.user.role === 'team'
      ? h('div', { class: 'callout' }, 'Замок на карточке означает, что запись закреплена за другим сотрудником: её статус вы изменить не можете.')
      : null,
    board
  );
}

function calendarEvents() {
  const events = [];
  db.steps.forEach((step) => {
    const project = projectById(step.project_id);
    if (!project) return;
    const overdue = step.state !== 'done' && daysUntil(step.due_date) < 0;
    events.push({
      date: step.due_date, kind: 'step',
      title: step.title,
      color: step.state === 'done' ? '#2e7d4f' : overdue ? '#a33a3a' : '#1f4e9e',
      href: '#/projects/' + project.id,
      meta: project.code + ' — срок этапа',
    });
  });
  db.visits.forEach((visit) => {
    let cursor = new Date(visit.date_from + 'T00:00:00');
    const end = new Date(visit.date_to + 'T00:00:00');
    while (cursor <= end) {
      events.push({
        date: cursor.toISOString().slice(0, 10), kind: 'visit',
        title: countryName(visit.iso2) + ', ' + visit.cities,
        color: '#6f45c9', href: '#/visits/' + visit.id,
        meta: visit.code + ' — ' + DIRECTION_LABELS[visit.direction],
      });
      cursor = new Date(cursor.getTime() + DAY);
    }
  });
  db.meetings.forEach((meeting) => {
    events.push({
      date: meeting.meet_date, kind: 'meeting',
      title: (meeting.meet_time ? meeting.meet_time + ' ' : '') + meeting.company_name,
      color: dictColor(MEETING_STATUSES, meeting.status_code),
      href: '#/visits/' + meeting.visit_id,
      meta: 'встреча · ' + dictName(MEETING_STATUSES, meeting.status_code),
    });
  });
  return events;
}

function renderCalendar(query) {
  const today = new Date();
  const month = query.month !== undefined ? Number(query.month) : today.getMonth();
  const year = query.year !== undefined ? Number(query.year) : today.getFullYear();
  const kinds = query.kind ? query.kind.split(',') : ['step', 'visit', 'meeting'];

  const events = calendarEvents().filter((event) => kinds.indexOf(event.kind) !== -1);
  const first = new Date(year, month, 1);
  const startOffset = (first.getDay() + 6) % 7;
  const gridStart = new Date(year, month, 1 - startOffset);
  const todayKey = new Date().toISOString().slice(0, 10);

  const cells = [];
  for (let i = 0; i < 42; i++) {
    const date = new Date(gridStart.getTime() + i * DAY);
    const key = date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
    const dayEvents = events.filter((event) => event.date === key);
    cells.push(h('div', { class: 'cal-cell ' + (date.getMonth() !== month ? 'other' : '') + (key === todayKey ? ' today' : '') },
      h('div', { class: 'cal-daynum' }, String(date.getDate())),
      dayEvents.slice(0, 4).map((event) =>
        h('a', { class: 'cal-event', href: event.href, style: { background: event.color }, title: event.title + ' — ' + event.meta }, event.title)),
      dayEvents.length > 4 ? h('div', { class: 'small muted' }, 'ещё ' + (dayEvents.length - 4)) : null
    ));
  }

  const shift = (delta) => {
    const date = new Date(year, month + delta, 1);
    go('/calendar', Object.assign({}, query, { month: date.getMonth(), year: date.getFullYear() }));
  };

  const toggleKind = (kind) => {
    const next = kinds.indexOf(kind) !== -1 ? kinds.filter((k) => k !== kind) : kinds.concat([kind]);
    go('/calendar', Object.assign({}, query, { kind: next.length ? next.join(',') : 'none' }));
  };

  const monthEvents = events.filter((event) => {
    const date = new Date(event.date + 'T00:00:00');
    return date.getMonth() === month && date.getFullYear() === year;
  }).sort((a, b) => (a.date < b.date ? -1 : 1));

  return frag(
    h('div', { class: 'page-head' },
      h('div', { class: 'titles' },
        h('h1', {}, 'Календарь'),
        h('div', { class: 'subtitle' }, 'Сроки дорожных карт, визиты делегаций и встречи в одном представлении')
      ),
      h('div', { class: 'page-actions' },
        h('button', { class: 'btn', onclick: () => shift(-1) }, '← ' + MONTHS_NOM[(month + 11) % 12]),
        h('button', { class: 'btn', onclick: () => go('/calendar', { kind: query.kind }) }, 'Сегодня'),
        h('button', { class: 'btn', onclick: () => shift(1) }, MONTHS_NOM[(month + 1) % 12] + ' →'),
        exportButton('События месяца в CSV', 'calendar.csv',
          ['Дата', 'Тип', 'Событие', 'Пояснение'],
          () => monthEvents.map((event) => [event.date, { step: 'Срок этапа', visit: 'Визит', meeting: 'Встреча' }[event.kind], event.title, event.meta]),
          'календарь событий')
      )
    ),
    h('h2', { class: 'mb-1' }, MONTHS_NOM[month] + ' ' + year),
    h('div', { class: 'cal-legend' },
      [{ kind: 'step', label: 'Сроки этапов', color: '#1f4e9e' },
       { kind: 'visit', label: 'Визиты', color: '#6f45c9' },
       { kind: 'meeting', label: 'Встречи', color: '#2e7d4f' }].map((item) =>
        h('button', { class: 'chip ' + (kinds.indexOf(item.kind) !== -1 ? 'active' : ''), onclick: () => toggleKind(item.kind) },
          h('span', { class: 'sw', style: { background: item.color } }), item.label))
    ),
    h('div', { class: 'cal-grid' },
      WEEKDAYS_SHORT.map((day) => h('div', { class: 'cal-dow' }, day)),
      cells
    ),
    h('div', { class: 'card mt-2' },
      h('div', { class: 'card-head' }, h('h2', {}, 'События месяца'), h('span', { class: 'muted small' }, 'всего: ' + monthEvents.length)),
      h('div', { class: 'card-body' },
        monthEvents.length
          ? monthEvents.slice(0, 12).map((event) =>
              h('a', { class: 'attention-item', href: event.href, style: { color: 'inherit', textDecoration: 'none' } },
                h('span', { class: 'marker', style: { background: event.color } }),
                h('span', { style: { minWidth: '0' } },
                  h('div', { class: 'a-title' }, event.title),
                  h('div', { class: 'a-meta' }, event.meta)
                ),
                h('span', { class: 'a-right' }, formatDateShort(event.date))
              )
            )
          : h('p', { class: 'muted mb-0' }, 'В этом месяце событий нет.')
      )
    )
  );
}

function renderReports(query) {

    field('Отрасль', select(SECTORS.map((s) => ({ value: s.code, label: s.name })), { value: query.sector || '', placeholder: 'Все отрасли', onchange: set('sector') })),

  );

  // Показатели работы проектных менеджеров
  const managers = db.users.filter((u) => u.role === 'team' || u.role === 'admin').map((user) => {
    const own = db.projects.filter((p) => p.responsible_user_id === user.id);

    return {
      user: user,

      amount: own.reduce((sum, p) => sum + toUsd(p.amount, p.currency), 0),

      stepsOverdue: ownSteps.filter((s) => s.state !== 'done' && daysUntil(s.due_date) < 0).length,
      visits: db.visits.filter((v) => v.responsible_user_id === user.id).length,
    };
  }).filter((row) => row.projects || row.visits).sort((a, b) => b.amount - a.amount);

  const datasetCard = (title, note, filename, headers, rowsFn, count) =>
    h('div', { class: 'card' },

        exportButton('Выгрузить CSV', filename, headers, rowsFn, title)
      )
    );

  const steps = db.steps.filter((s) => projects.some((p) => p.id === s.project_id));

// ==========================================================================
//  19. Журнал аудита (раздел 10 ТЗ) — только для администратора
// ==========================================================================

const AUDIT_ACTIONS = {
  create: 'Создание', update: 'Изменение', delete: 'Удаление', status_change: 'Смена статуса',
  login: 'Вход в систему', export: 'Выгрузка',
};
const AUDIT_ENTITIES = {
  project: 'Проект', company: 'Компания', visit: 'Визит', meeting: 'Встреча', step: 'Этап',
  comment: 'Комментарий', correction: 'Заявка на исправление', user: 'Пользователь', report: 'Отчёт',
};
const auditTagClass = (action) => ({
  create: 'tag-ok', update: 'tag-indigo', delete: 'tag-danger', status_change: 'tag-indigo', export: 'tag-gold',
}[action] || '');

function renderAudit(query) {
  if (!can(state.user, 'admin.audit')) {
    return frag(
      h('div', { class: 'page-head' }, h('div', { class: 'titles' }, h('h1', {}, 'Журнал аудита'))),
      h('div', { class: 'card' }, h('div', { class: 'card-body' },
        empty('Раздел недоступен', 'Журнал аудита открыт только администратору. Переключите роль в верхней панели.', '🔒')))
    );
  }

  let rows = db.audit.slice();
  if (query.action) rows = rows.filter((r) => r.action === query.action);
  if (query.entity_type) rows = rows.filter((r) => r.entity_type === query.entity_type);
  if (query.user_id) rows = rows.filter((r) => String(r.user_id) === String(query.user_id));
  if (query.search) {
    const term = query.search.toLowerCase();
    rows = rows.filter((r) => (r.summary + ' ' + r.changes.map((c) => c.label + c.from + c.to).join(' ')).toLowerCase().indexOf(term) !== -1);
  }
  if (query.from) rows = rows.filter((r) => r.created_at.slice(0, 10) >= query.from);
  if (query.to) rows = rows.filter((r) => r.created_at.slice(0, 10) <= query.to);

  const searchInput = h('input', { type: 'search', value: query.search || '', placeholder: 'Поиск по описанию и значениям' });
  searchInput.addEventListener('input', debounce(() => go('/audit', Object.assign({}, query, { search: searchInput.value || undefined })), 350));
  const set = (key) => (event) => go('/audit', Object.assign({}, query, { [key]: event.target.value || undefined }));

  const formatValue = (value) => (value === null || value === undefined || value === '' ? '(пусто)' : String(value));

  return frag(
    h('div', { class: 'page-head' },
      h('div', { class: 'titles' },
        h('h1', {}, 'Журнал аудита'),
        h('div', { class: 'subtitle' }, 'Кто, что и когда изменил — со старыми и новыми значениями полей')
      ),
      h('div', { class: 'page-actions' },
        exportButton('Выгрузить в CSV', 'audit.csv',
          ['Дата и время', 'Пользователь', 'Роль', 'Действие', 'Объект', 'Номер', 'Описание', 'Изменения', 'IP'],
          () => rows.map((entry) => [entry.created_at, userName(entry.user_id),
            entry.user_id && userById(entry.user_id) ? ROLE_LABELS[userById(entry.user_id).role] : '',
            AUDIT_ACTIONS[entry.action] || entry.action, AUDIT_ENTITIES[entry.entity_type] || entry.entity_type,
            entry.entity_id || '', entry.summary,
            entry.changes.map((c) => c.label + ': ' + formatValue(c.from) + ' → ' + formatValue(c.to)).join('; '), entry.ip]),
          'журнал аудита')
      )
    ),
    h('div', { class: 'filters' },
      field('Поиск', searchInput),
      field('Действие', select(Object.keys(AUDIT_ACTIONS).map((key) => ({ value: key, label: AUDIT_ACTIONS[key] })), { value: query.action || '', placeholder: 'Все действия', onchange: set('action') })),
      field('Тип записи', select(Object.keys(AUDIT_ENTITIES).map((key) => ({ value: key, label: AUDIT_ENTITIES[key] })), { value: query.entity_type || '', placeholder: 'Все типы', onchange: set('entity_type') })),
      field('Пользователь', select(db.users.map((u) => ({ value: u.id, label: u.full_name })), { value: query.user_id || '', placeholder: 'Все пользователи', onchange: set('user_id') })),
      field('С даты', h('input', { type: 'date', value: query.from || '', onchange: set('from') })),
      field('По дату', h('input', { type: 'date', value: query.to || '', onchange: set('to') }))
    ),
    h('div', { class: 'card' },
      h('div', { class: 'card-head' }, h('h2', {}, 'Записей в журнале: ' + formatNumber(rows.length))),
      rows.length
        ? h('div', { class: 'card-body tight' },
            h('div', { class: 'table-wrap' },
              h('table', { class: 'data' },
                h('thead', {}, h('tr', {},
                  h('th', {}, 'Дата и время'), h('th', {}, 'Пользователь'), h('th', {}, 'Действие'),
                  h('th', {}, 'Объект'), h('th', {}, 'Описание'), h('th', {}, 'Изменения')
                )),
                h('tbody', {}, rows.slice(0, 120).map((entry) =>
                  h('tr', {},
                    h('td', { class: 'nowrap' }, formatDateTime(entry.created_at)),
                    h('td', {}, userName(entry.user_id),
                      h('div', { class: 't-sub' }, entry.user_id && userById(entry.user_id) ? ROLE_LABELS[userById(entry.user_id).role] : ''),
                      h('div', { class: 't-sub mono' }, entry.ip)),
                    h('td', {}, h('span', { class: 'tag ' + auditTagClass(entry.action) }, AUDIT_ACTIONS[entry.action] || entry.action)),
                    h('td', {}, AUDIT_ENTITIES[entry.entity_type] || entry.entity_type,
                      entry.entity_id ? h('div', { class: 't-sub mono' }, '№' + entry.entity_id) : null),
                    h('td', { style: { maxWidth: '320px' } }, entry.summary),
                    h('td', { style: { maxWidth: '340px' } },
                      entry.changes.length
                        ? entry.changes.map((change) =>
                            h('div', { class: 'audit-change' },
                              h('b', {}, change.label + ': '),
                              h('span', { class: 'from' }, formatValue(change.from)),
                              ' → ',
                              h('span', { class: 'to' }, formatValue(change.to))))
                        : h('span', { class: 'muted' }, '—'))
                  )
                ))
              )
            )
          )
        : h('div', { class: 'card-body' }, empty('Записей не найдено', 'Измените условия фильтрации.', '⧉')),
      rows.length > 120 ? h('div', { class: 'pagination' }, h('span', { class: 'muted' }, 'Показаны последние 120 записей из ' + formatNumber(rows.length))) : null
    )
  );
}

// ==========================================================================
//  20. Маршрутизация и запуск
// ==========================================================================

function parseHash() {
  const raw = location.hash.replace(/^#/, '') || '/dashboard';
  const parts = raw.split('?');
  const query = {};
  if (parts[1]) {
    parts[1].split('&').forEach((pair) => {
      if (!pair) return;
      const kv = pair.split('=');
      query[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
    });
  }
  return { path: parts[0] || '/dashboard', query: query };
}

function go(path, query) {
  const pairs = [];
  Object.keys(query || {}).forEach((key) => {
    const value = query[key];
    if (value === undefined || value === null || value === '') return;
    pairs.push(encodeURIComponent(key) + '=' + encodeURIComponent(value));
  });
  location.hash = '#' + path + (pairs.length ? '?' + pairs.join('&') : '');
}

function routeView(route) {
  const segments = route.path.split('/').filter(Boolean);
  const section = segments[0] || 'dashboard';
  const id = segments[1];

  if (section === 'dashboard') return renderDashboard(route.query);
  if (section === 'projects') return id ? renderProject(id) : renderProjects(route.query);
  if (section === 'companies') return id ? renderCompany(id) : renderCompanies(route.query);
  if (section === 'visits') return id ? renderVisit(id) : renderVisits(route.query);
  if (section === 'kanban') return renderKanban(route.query);
  if (section === 'calendar') return renderCalendar(route.query);
  if (section === 'reports') return renderReports(route.query);
  if (section === 'corrections') {
    if (!can(state.user, 'correction.request') && !can(state.user, 'correction.decide')) {
      return frag(
        h('div', { class: 'page-head' }, h('div', { class: 'titles' }, h('h1', {}, 'Заявки на исправление'))),
        h('div', { class: 'card' }, h('div', { class: 'card-body' },
          empty('Раздел недоступен', 'Заявки подают проектные менеджеры, рассматривает администратор. Переключите роль в верхней панели.', '🔒')))
      );
    }
    return renderCorrections(route.query);
  }
  if (section === 'audit') return renderAudit(route.query);
  return notFound('Раздел не найден');
}

function render() {
  saveDatabase();
  const root = document.getElementById('root');
  if (!state.user) {
    setChildren(root, renderLogin());
    document.documentElement.scrollTop = 0;
    return;
  }
  state.route = parseHash();
  let content;
  try {
    content = routeView(state.route);
  } catch (error) {
    content = frag(
      h('div', { class: 'card' }, h('div', { class: 'card-body' },
        empty('Не удалось построить экран', String(error && error.message ? error.message : error), '⚠')))
    );
  }
  setChildren(root, renderShell(content));
}

window.addEventListener('hashchange', () => {
  const previous = state.route.path;
  render();
  if (parseHash().path !== previous) window.scrollTo(0, 0);
});

render();

// Возможность downloads доступна не сразу — включаем выгрузку, когда среда ответит.
if (window.claude && typeof window.claude.use === 'function') {
  window.claude.use('downloads').then((downloads) => {
    state.downloads = downloads;
    state.downloadsReady = true;
    if (state.user) render();
  }).catch(() => {
    state.downloadsReady = true;
    if (state.user) render();
  });
} else {
  state.downloadsReady = true;
}

})();
</script>
